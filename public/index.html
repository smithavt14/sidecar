    pointer-events:none; background:linear-gradient(to bottom, transparent, var(--fill)); }
  .side-list .msg.by-agent.clamped .t::after { background:linear-gradient(to bottom, transparent, var(--chip)); }
  /* The clamp's toggle. It carries a class more than the card's own two rules do and sits after both,
     which it needs for each of them: the first hides every `.more` until a card is docked, and this one
     has to draw on a phone too, since a message is as long there as it is on a desktop; the second
     centres the card's toggle across the full width, and this one is left-aligned under the text it
     belongs to, which is how a reader tells the two apart. */
  .side-list .card .msg .more { display:block; margin:5px 0 0; padding:0; border:0; background:none;
    box-shadow:none; cursor:pointer; color:var(--muted);
    font:600 var(--t-2) 'Geist', ui-sans-serif, sans-serif; }
  .side-list .card .msg .more:hover { color:var(--ink); background:none; }
  /* full-size view of an attached image — click anywhere or Esc to dismiss */
  #lightbox { position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:24px;
    background:var(--scrim); cursor:zoom-out; }
  #lightbox.on { display:grid; }
  /* the shadow sits on the scrim rather than on the page, so it is the same black in both themes */
  #lightbox img { max-width:100%; max-height:100%; border-radius:var(--r-2); box-shadow:0 20px 60px rgba(0,0,0,.45); }
  /* word-level diff — mono well; deletions strike out muted, insertions carry the agent's yellow */
  .diffbox { font:var(--t-2)/1.6 'Geist Mono', ui-monospace, Menlo, monospace; background:var(--fill); border-radius:var(--r-2);
    padding:10px 12px; margin:9px 0; white-space:pre-wrap; word-break:break-word; color:var(--ink-2); }
  .diffbox del { color:var(--faint); text-decoration:line-through; }
  .diffbox ins { background:var(--yellow); color:var(--on-yellow); text-decoration:none; border-radius:var(--r-1); padding:0 2px; }
  .row { display:flex; gap:8px; margin-top:11px; align-items:center; }
  .row.spread { justify-content:space-between; }
  .row .spacer { flex:1; }
  /* a compose box under a dragged image — the only cue that dropping here will do something */
  .dropping { border-color:var(--ink-btn) !important; box-shadow:var(--ring); }
  .reply { width:100%; font:inherit; font-size:var(--t-3); border:1px solid var(--line-2); border-radius:var(--r-2);
    padding:8px 11px; background:var(--bg); color:var(--fg); resize:none; overflow:hidden; line-height:1.45;
    min-height:36px; max-height:40vh; overflow-y:auto; }
  .reply::placeholder { color:var(--faint); }
  .reply:focus { outline:none; border-color:var(--ink-btn); box-shadow:var(--ring); }
  /* floating selection toolbar — a soft light card; hover fills grey (your actions stay monochrome) */
  #seltool { position:absolute; display:none; z-index:30; background:var(--card); border:1px solid var(--line-2);
    border-radius:var(--r-3); box-shadow:var(--shadow); padding:4px; align-items:center; gap:1px;
    flex-wrap:wrap; max-width:calc(100vw - 16px); }
  #seltool button { background:none; border:none; box-shadow:none; color:var(--fg); padding:6px 11px;
    border-radius:var(--r-2); font-size:var(--t-3); font-weight:500; line-height:1; }
  #seltool button:hover { background:var(--fill); color:var(--ink); }
  /* text-style dropdown — a single control replacing the ¶/h1/h2/h3 row */
  #seltool .fmt { position:relative; display:inline-flex; }
  #seltool .fmt-btn { display:inline-flex; align-items:center; gap:3px; }
  #seltool .fmt-btn .car { font-size:var(--t-1); opacity:.55; }
  #seltool .fmt-menu { position:absolute; top:calc(100% + 5px); left:0; z-index:1;
    background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-2); box-shadow:var(--shadow);
    padding:4px; display:flex; flex-direction:column; gap:1px; min-width:132px; }
  #seltool .fmt-menu[hidden] { display:none; }
  #seltool .fmt-menu button { display:block; width:100%; text-align:left; white-space:nowrap; }
  /* The B is a specimen of what the button does, so it has to read heavier than the words beside it.
     It used to do that at 800, a weight nothing else in the tool used; the words dropped to 500
     instead and the B takes 600, which is a step the rest of the chrome already stands on. Declared
     rather than left to the UA, whose `bolder` resolves against the button and lands on 900. */
  #seltool b { font-weight:600; } #seltool i { font-style:italic; font-family:Georgia,serif; }
  #seltool .tsep { width:1px; height:16px; background:var(--line-2); margin:0 3px; }
  #seltool input { background:var(--bg); border:1px solid var(--line-2); color:var(--fg); border-radius:var(--r-2);
    font:inherit; font-size:var(--t-3); padding:6px 10px; width:230px; outline:none; }
  #seltool input:focus { border-color:var(--ink-btn); box-shadow:var(--ring); }
  #popover { position:absolute; display:none; z-index:31; background:var(--card); border:1px solid var(--line-2);
    border-radius:var(--r-3); box-shadow:var(--shadow); padding:13px; width:300px; }
  /* drag handle — grab this to move the comment box off the text you're commenting on */
  #popover .po-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin:-13px -13px 11px; padding:8px 13px; border-bottom:1px solid var(--line);
    border-radius:var(--r-3) var(--r-3) 0 0; cursor:grab; user-select:none; touch-action:none; }
  #popover .po-head:active { cursor:grabbing; }
  #popover .po-title { font-size:var(--t-1); font-weight:600; letter-spacing:var(--track-caps); text-transform:uppercase; color:var(--muted); }
  #popover .po-grip { color:var(--faint); font-size:var(--t-3); line-height:1; letter-spacing:1.5px; }
  #popover textarea { width:100%; min-height:66px; max-height:40vh; overflow-y:auto; font:inherit; font-size:var(--t-3);
    border:1px solid var(--line-2); border-radius:var(--r-2); padding:8px 10px; resize:vertical; outline:none;
    background:var(--bg); color:var(--fg); }
  #popover textarea::placeholder { color:var(--faint); }
  #popover textarea:focus { border-color:var(--ink-btn); box-shadow:var(--ring); }
  #popover .row { justify-content:flex-end; }
  /* toast — the one INVERTED surface, and the only thing here that swaps sides with the theme:
     ink-on-light in light, light-on-ink in dark. Its action buttons invert with it. */
  /* Enters and leaves by the same edge it lives on. `display` can't transition, so visibility carries
     the hiding and the transform/opacity carry the motion — translateX(-50%) has to stay inside every
     transform or the centering snaps. */
  #banner { visibility:hidden; position:fixed; bottom:18px; left:50%; background:var(--toast);
    color:var(--toast-fg); padding:13px 18px; border-radius:var(--r-3); z-index:40; font-size:var(--t-4);
    box-shadow:var(--toast-shadow);
    opacity:0; transform:translate(-50%, 12px);
    transition:opacity .2s ease-out, transform .2s ease-out, visibility 0s linear .2s; }
  #banner.open { visibility:visible; opacity:1; transform:translate(-50%, 0);
    transition:opacity .2s ease-out, transform .2s ease-out, visibility 0s; }
  #banner button { margin-left:10px; background:var(--toast-btn); color:var(--toast-btn-fg); border:none;
    padding:6px 12px; }
  #banner button:hover { background:var(--toast-btn-hover); }
  /* quiet docs link — a text link, never a CTA. It sits in the folder panel's foot now: app-level
     chrome belongs to the frame, and the header carries only the open document's things. */
  .doclink { color:var(--muted); font-size:var(--t-3); font-weight:500; text-decoration:none;
    border-bottom:1.5px solid transparent; }
  .doclink:hover { color:var(--fg); }
  /* Pinned to the panel's foot by the auto margin when the list is short; a long folder scrolls it,
     which is where a footer belongs in a scrolling column. Gone with the collapsed edge, which draws
     nothing but the handle and the count, and gone with the panel itself on the picker screen. */
  .nav-docs { margin:auto 20px 0; padding-top:16px; align-self:flex-start; }
  body.nav-collapsed .nav-docs { display:none; }
  /* right cluster: the orphaned count — the one header number that is actionable (click cycles the
     orphans) and shown nowhere else. The open count lives on the rail's active tab, always visible
     now, so the header repeating it was two counters for one fact. */
  .turn { font-size:var(--t-2); color:var(--faint); display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .turn:empty { display:none; }
  .turn .orphan { color:var(--fg); border-bottom:1.5px solid var(--yellow); cursor:pointer; }
  /* center of the navbar: the readout for the agent being in the room. The header spans only the
     document column now, so the centre it takes is the centre of the PROSE, which is why it says
     nothing at rest. A document nobody was watching used to name that absence at the optical centre of
     the page, permanently, as the first thing the eye landed on. The element stays in the DOM at all
     times so its arrival moves nothing around it; it is EMPTY whenever no agent is watching, and
     `:empty` takes the mobile pill's own padding with it. */
  .presence { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none;
    display:flex; align-items:center; gap:6px; font-size:var(--t-2); white-space:nowrap; }
  .presence:empty { display:none; }
  .presence .dot { width:7px; height:7px; border-radius:50%; flex:none; }
  .presence.here { color:var(--ink-3); font-weight:500; }
  .presence.here .dot { background:var(--yellow); box-shadow:0 0 0 1px var(--yellow-ring); }
  /* It fades UP rather than appearing. `arriving` is set by renderPresence only on the render that
     fills an empty slot, so a 15-second heartbeat re-rendering the same state does not re-animate. */
  @keyframes presIn { from { opacity:0; } to { opacity:1; } }
  .presence.arriving { animation:presIn .2s ease-out; }
  @keyframes presPulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  .presence.working .dot { animation:presPulse 1.4s ease-in-out infinite; }
  /* Per-thread presence: the card the agent is answering right now. Just the label, plain body
     text with a shimmer sweeping through it — no chip, no dot, no spinner. The motion IS the
     signal. Appears when the agent's wait exit names the thread, clears when the reply lands
     (or goes stale). */
  /* padding-left matches .msg's 10px horizontal padding, so the label lines up with the message
     TEXT in the bubbles above it, not with the card's content edge */
  .replying { display:flex; align-items:center; margin-top:8px; padding-left:10px; }
  .replying .lbl { font-size:var(--t-2); font-weight:500; color:transparent;
    background:linear-gradient(90deg, var(--muted) 35%, var(--fg) 50%, var(--muted) 65%);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text;
    animation:shimmerText 1.4s linear infinite; }
  @keyframes shimmerText { from { background-position:200% 0; } to { background-position:-200% 0; } }
  /* Reduced motion: cut the movement, keep the meaning. The toast still fades so it doesn't teleport,
     the sheet still slides (a sheet that jump-cuts loses where it came from), and the presence dot
     holds a steady dim instead of breathing — the "working" state is still legible, just not moving. */
  @media (prefers-reduced-motion: reduce) {
    #banner { transition:opacity .15s ease-out, visibility 0s linear .15s; transform:translate(-50%, 0); }
    #banner.open { transition:opacity .15s ease-out, visibility 0s; transform:translate(-50%, 0); }
    .presence.working .dot { animation:none; opacity:.6; }
    /* the readout still arrives, it just arrives at once */
    .presence.arriving { animation:none; }
    /* the label drops the shimmer for static muted text — still legible, just not moving */
    .replying .lbl { animation:none; background:none; color:var(--muted); }
    /* Cards: no travel. The JS also skips the exit wait entirely, so a decision stays instant. */
    .card.leaving { transform:none; transition:opacity .12s ease-out; }
    .card.entering { animation:none; }
    button:active, .pop:hover:not(:active) { transform:none; }
  }
  /* docs is a LINK (leaves the page) — mark it as one so it reads differently from status + actions */
  .doclink::after { content:'\2197'; font-size:.82em; margin-left:2px; opacity:.6; }
  /* "done reviewing" is a review ACTION → it lives at the foot of the review column, not the nav bar. */
  .done-foot { display:block; width:100%; margin-top:8px; padding:14px 0 4px; text-align:center;
    font-size:var(--t-2); font-weight:500; color:var(--muted); background:none; border:none; box-shadow:none;
    border-top:1px solid var(--line); border-radius:0; }
  .done-foot:hover { color:var(--fg); background:none; }
  /* a suggestion nested inside the comment thread it answers (replyTo) — a quiet recessed panel */
  .subcard { margin:10px 0 5px; padding:12px 13px; border:1px solid var(--line-2);
    border-radius:var(--r-2); background:var(--fill); }
  .subcard .who { font-weight:600; }
  #filelist { padding:48px 40px; max-width:760px; margin:0 auto; }
  #filelist .h { font-size:var(--t-6); font-weight:600; letter-spacing:-.02em; color:var(--ink); margin:0 0 4px; }
  #filelist .sub { font-size:var(--t-3); color:var(--muted); margin:0 0 26px; }
  #filelist .sub code { font-family:'Geist Mono', ui-monospace, monospace; font-size:var(--t-2); color:var(--ink-2); }
  #filelist a { display:flex; align-items:center; gap:12px; padding:14px 12px; border-bottom:1px solid var(--line);
    text-decoration:none; color:var(--ink); border-radius:var(--r-2); }
  #filelist a:hover { background:var(--fill); }
  #filelist a .nm { font-size:var(--t-4); font-weight:500; }
  #filelist a .ext { font-family:'Geist Mono', ui-monospace, monospace; font-size:var(--t-1); color:var(--fainter); }
  #filelist a .sp { flex:1; }
  #filelist a .ago { font-size:var(--t-1); color:var(--faint); font-family:'Geist Mono', ui-monospace, monospace;
    white-space:nowrap; }
  #filelist a .none { font-size:var(--t-2); color:var(--dead); min-width:20px; text-align:center; }
  /* open-count pill — grey chip carrying a single yellow dot (the agent has notes waiting) */
  .count { display:inline-flex; align-items:center; gap:6px; background:var(--chip-n); color:var(--ink-2);
    border-radius:var(--r-pill); font-size:var(--t-2); padding:3px 10px; font-weight:600; }
  .count::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--yellow);
    box-shadow:0 0 0 1px var(--yellow-ring); }
  .empty { color:var(--muted); font-size:var(--t-3); text-align:center; padding:40px 0; line-height:1.45; }

  /* --- mobile: single-column doc, review panel becomes a pull-up bottom sheet --- */
  #sheetToggle, #sheetBackdrop, #navBackdrop { display:none; }
  @media (max-width: 780px) {
    main, body.rail-collapsed main { grid-template-columns: minmax(0,1fr); }   /* minmax(0,…) so a code block can't force overflow */
    /* The frame is a drawer down here, so nothing is inset past it. The desktop rule is scoped to the
       breakpoint rather than undone, same as the collapsed rules below it. */
    /* The rail is a fixed overlay down here, so there are no two columns to divide and nothing for a
       drag to resize: the handle is removed rather than left half-working, and hiding the panel is
       already the sheet's job, so the header toggle goes with it. A collapsed state carried down from
       a wide window must not take the sheet with it — hence the display:flex, which wins on source
       order against the same-specificity rule above. */
    #railGrip, #railToggle { display:none; }
    body.rail-collapsed aside { display:flex; }
    /* The panel is a drawer down here, for the same reason the rail is a sheet: there is one column
       and nothing to divide, so the grip goes rather than half-working. Its header button stays,
       because unlike the rail's sheet the drawer has no other way in. */
    #navGrip { display:none; }
    /* The drawer's own header is off screen with it, so opening it is the one control that has to sit
       outside: the page header, where the rail's floating pill is its equivalent. Minimizing means
       nothing down here, so the in-panel control goes. */
    #navToggle { display:block; }
    #navCollapse { display:none; }
    /* Already fixed on desktop; down here it is the same surface slid off screen and given a width of
       its own — 288px, GD's mobile sheet, capped against a small phone. */
    #nav { width:min(288px, 84vw); z-index:47;
      transform:translateX(-102%); transition:transform .26s ease-out;
      padding:0 0 calc(env(safe-area-inset-bottom) + 20px); }
    .nav-brand { height:calc(52px + env(safe-area-inset-top));   /* clear the notch */
      padding-top:env(safe-area-inset-top); }
    /* The shadow arrives with the drawer. Left on permanently it reaches back across the 2% of travel
       the closed panel keeps off screen and paints a grey seam down the edge of every document. */
    body.nav-open #nav { transform:translateX(0); box-shadow:12px 0 40px var(--shadow-panel); }
    #navBackdrop { display:block; position:fixed; inset:0; background:var(--scrim-soft); z-index:46;
      opacity:0; pointer-events:none; transition:opacity .26s; }
    body.nav-open #navBackdrop { opacity:1; pointer-events:auto; }
    #doc pre { max-width:100%; }
    #pwd { font-size:var(--t-1); }
    /* The gutters are 18px down here, so the cap is the same measure over a narrower margin. On a
       phone the column is the window and nothing binds; on a tablet held wide it still does. */
    #doc { max-width:calc(var(--measure) + 36px); padding:20px 18px 42vh; line-height:1.6; }
    /* The phone's floor. #doc is contenteditable and iOS Safari zooms into an editable under 16px and
       never zooms back out, so the smallest of the four steps reads 16 here and the other three are
       unchanged. --doc-size takes the larger of the two, which is why this is a token rather than a
       font-size: the vertical scale and the measure are multiples of it and follow on their own. */
    :root { --prose-floor:16px; }
    /* The headings close up a little on a phone, so they keep ratios of their own: 25 / 19 / 16.5 over
       the 16 the column reads there. Still ratios, so all four steps scale. */
    #doc h1 { font-size:1.5625em; } #doc h2 { font-size:1.1875em; } #doc h3 { font-size:1.0313em; }
    /* The control stays while the three widths still differ. Below 540px the window is narrower than
       the narrowest measure plus its gutters, all three draw the same column, and the button would do
       nothing visible; a tablet at 768px still gets 500, 564 and 660px columns. */
    @media (max-width: 540px) { #measureToggle { display:none; } }
    /* clear the notch/status bar: pad the top by the safe-area inset so the bar isn't cramped or hidden */
    .hwrap { padding:0 12px; height:calc(51px + env(safe-area-inset-top));
      padding-top:env(safe-area-inset-top); gap:8px; }
    #status { min-width:0; }
    /* The readout is in the flow down here (see .presence below), so it pushes the title rather than
       sitting on top of it, and the desktop bound would only starve a path that is already tight. */
    .htitle, .hwrap:has(.presence:not(:empty)) .htitle { max-width:none; }
    /* the absolute-center readout collides with the cramped mobile header, so drop it into the flow
       as a compact dot-only chip beside the title — the dot's color/pulse still carries the state
       (yellow=here, outline=away, filled=sent, pulsing=working); the label is hidden to save width. */
    .presence { position:static; transform:none; gap:0; padding:5px; margin-left:-2px;
      background:var(--fill); border-radius:var(--r-pill); }
    .presence .lbl { display:none; }
    #filelist { padding:28px 18px; }
    #popover { width:min(300px, calc(100vw - 24px)); }
    /* iOS Safari zooms into any focused input with font-size <16px (and won't zoom back). Pin to 16px. */
    .reply, #popover textarea, #seltool input { font-size:var(--t-5); }

    /* the sidebar, reframed as a bottom sheet */
    aside {
      /* height + overflow live here, not on the base rule: on desktop the rail scrolls with the page so
         cards can dock to their anchors, but the sheet genuinely is its own scrolling surface. */
      position:fixed; left:0; right:0; bottom:0; top:auto; height:76vh; overflow-y:auto;
      border-left:none; border-top:1px solid var(--line); border-radius:var(--r-3) var(--r-3) 0 0;
      background:var(--bg); box-shadow:0 -12px 40px var(--shadow-panel);
      transform:translateY(102%); transition:transform .26s ease-out; z-index:46;
      padding:22px 16px calc(env(safe-area-inset-bottom) + 20px); gap:0;
    }
    aside::before { content:''; position:absolute; top:9px; left:50%; transform:translateX(-50%);
      width:40px; height:4px; border-radius:var(--r-pill); background:var(--line-strong); }
    /* Inside the sheet the tabs stick to the SHEET's scroll box, not the page, so the desktop
       under-the-header offset would push them 51px down. Back to cancelling the sheet's own padding. */
    .tabs { top:-22px; }
    body.sheet-open aside { transform:translateY(0); }

    #sheetBackdrop { display:block; position:fixed; inset:0; background:var(--scrim-soft); z-index:45;
      opacity:0; pointer-events:none; transition:opacity .26s; }
    body.sheet-open #sheetBackdrop { opacity:1; pointer-events:auto; }

    /* the pull-up pill — ink surface, the open-item count in the agent's yellow */
    #sheetToggle { display:inline-flex; align-items:center; gap:8px; position:fixed;
      right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:44;
      background:var(--ink-btn); color:var(--on-ink); border:none; box-shadow:0 8px 20px -6px var(--shadow-pill);
      border-radius:var(--r-pill); padding:11px 18px; font-weight:600; font-size:var(--t-4); }
    #sheetToggle .n { background:var(--yellow); color:var(--on-yellow); border-radius:var(--r-pill);
      min-width:20px; text-align:center; padding:0 6px; font-size:var(--t-2); }
    #sheetToggle .n:empty { display:none; }
    body.sheet-open #sheetToggle { display:none; }
    /* Reading mode, down here. The two panels are already overlays rather than tracks, so collapsing
       --nav-track and --rail-w does nothing and the work is all in what is drawn: the pull-up pill is
       the last piece of review chrome on the screen and it goes with the rest. setReading shuts the
       drawer and the sheet before the mode starts, so neither can be left open behind it. */
    body.reading #sheetToggle, body.reading #sheetBackdrop { display:none; }
    body.reading aside { transform:translateY(102%); }
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <!-- The drawer's way in, below the 780px breakpoint only. Above it the shell owns its own control
         (see #navCollapse) and this is display:none. -->
    <button id="navToggle" class="ghost iconbtn" onclick="toggleNav()" aria-controls="nav" aria-expanded="true"
      title="Show the folder" aria-label="Show the folder"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M7.1 3.75v12.5"/></svg></button>
    <!-- The whole-tree picker has no open document, so it has no folder and no panel — and the frame's
         identity would go with it. The wordmark comes back into the header for exactly that screen. -->
    <a href="/" class="hbrand" title="all documents">
      <img class="mark" src="/mark.svg" alt="" aria-hidden="true">
      <span class="wm">sidecar</span>
    </a>
    <!-- The content area's title: which document is open, and what kind it is. The wordmark it used to
         sit beside now lives at the top of the panel, where the frame's identity belongs. -->
    <div class="htitle">
      <div id="pwd"></div>
    </div>
    <!-- Empty until an agent is watching, working or replying. See renderPresence. -->
    <div id="presence" class="presence"></div>
    <div class="spacer"></div>
    <div id="turn" class="turn"></div>
    <!-- The way into the themes: the mode (system, light, dark) and which theme wears each scheme. The
         icon and the title carry it; there is no label, the same way the two panel toggles beside it
         have none. renderThemeMenu fills the menu. -->
    <div id="themeCtl">
      <button id="themeToggle" class="ghost iconbtn" onclick="toggleThemeMenu()" aria-haspopup="menu"
        aria-expanded="false" title="Theme: system" aria-label="Theme: system"></button>
      <div class="menu" id="themeMenu" role="menu" hidden></div>
    </div>
    <!-- The page width. Three measures, cycled, and the icon's two rules move with them: the only
         thing there is to say about this control is what it does to the column, and the column says
         it the moment it moves. Prose only: paintZoom hides it on an asset, which has a zoom. -->
    <!-- The asset's zoom, in the slot the measure holds on prose: the two are opposites and never both
         apply, so one position in the bar answers "how wide is this drawn" for either kind. Pressed is
         natural size; at rest the asset is scaled into the column. Painted by paintZoom. -->
    <button id="zoomToggle" class="ghost iconbtn" onclick="toggleAssetZoom()" aria-pressed="false" hidden
      title="Actual size" aria-label="Actual size"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.5 7.5v-4h4"/><path d="M16.5 7.5v-4h-4"/><path d="M3.5 12.5v4h4"/><path d="M16.5 12.5v4h-4"/></svg></button>
    <button id="measureToggle" class="ghost iconbtn" onclick="cycleMeasure()"
      title="Page width" aria-label="Page width"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <g class="mwb"><path d="M4 4.75v10.5"/><path d="M16 4.75v10.5"/>
      <path d="M7.6 10h4.8" opacity=".45"/></g></svg></button>
    <!-- The document's type size. Four steps, cycled, and ⌘= / ⌘- / ⌘0 do the same thing from the
         keyboard, which is where this control actually gets used. Prose only, like the measure it sits
         beside: an asset has a zoom. -->
    <button id="proseToggle" class="ghost iconbtn" onclick="cycleProse()"
      title="Text size" aria-label="Text size"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.4 15.4 6.4 4.8l4 10.6"/><path d="M3.7 11.9h5.4" opacity=".55"/>
      <path d="M12.3 15.4 14.9 8.6l2.6 6.8"/><path d="M13.2 13.2h3.4" opacity=".55"/></svg></button>
    <!-- Typewriter scrolling: the caret's line held at 45% of the window while you type. A preference,
         remembered, and the icon's ink is its whole state: pressed is the ink, off is the chrome's
         grey, the way the zoom control's pressed half reads. Prose only: paintZoom hides it on an
         asset, which has no caret to hold. -->
    <button id="typewriterToggle" class="ghost iconbtn" onclick="toggleTypewriter()" aria-pressed="false"
      title="Typewriter scrolling" aria-label="Typewriter scrolling"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <path d="M5.5 4.6h9" opacity=".4"/><path d="M5.5 7.3h9" opacity=".4"/>
      <path d="M2.6 10h14.8"/>
      <path d="M5.5 12.7h9" opacity=".4"/><path d="M5.5 15.4h9" opacity=".4"/></svg></button>
    <!-- Reading mode: the panels, the rail, the marks and the rest of this bar go, and the column is
         centred in the window. The button is its own way back out, which is why it is the one control
         the header keeps while reading (⌘⇧F, or Escape). paintReading swaps the icon. -->
    <button id="readingToggle" class="ghost iconbtn" onclick="toggleReading()" aria-pressed="false"
      title="Reading mode"></button>
    <button id="railToggle" class="ghost iconbtn" onclick="toggleRail()" aria-controls="side" aria-expanded="true"
      title="Hide review panel" aria-label="Hide review panel"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M12.9 3.75v12.5"/></svg><span
      class="n" id="railCount"></span></button>
    <div id="status">saved</div>
  </div>
</header>
<main id="main">
  <!-- The folder the open document lives in. Painted by renderNav; empty until the first /api/dir. -->
  <nav id="nav" aria-label="documents in this folder">
    <!-- The panel's own chrome, sticky over its list. `.nav-head` is one sticky block on purpose:
         revealOpenDoc measures it to know how much of the scrollport is covered, and two independent
         sticky rows would have it measuring half of what is actually in the way. -->
    <div class="nav-head">
      <!-- The brand row. The wordmark, and the control that minimizes the panel, at the top of the
           frame — the way an IDE's explorer owns its own chrome. Collapsed, the wordmark goes and the
           trigger stays: the way back out sits at the top of the collapsed edge. -->
      <div class="nav-brand brand">
        <a href="/" class="home" title="all documents">
          <img class="mark" src="/mark.svg" alt="" aria-hidden="true">
          <span class="wm">sidecar</span>
        </a>
        <button id="navCollapse" class="ghost iconbtn" onclick="toggleNav(false)" aria-controls="nav"
          title="Minimize the folder" aria-label="Minimize the folder"><svg viewBox="0 0 20 20" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M7.1 3.75v12.5"/>
          <path d="M13.5 7.9 11.4 10l2.1 2.1"/></svg></button>
        <button id="navExpand" class="ghost iconbtn" onclick="toggleNav(true)" aria-controls="nav"
          title="Expand the folder" aria-label="Expand the folder"><svg viewBox="0 0 20 20" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M7.1 3.75v12.5"/>
          <path d="M11.4 7.9 13.5 10l-2.1 2.1"/></svg></button>
      </div>
      <!-- Collapsed only, and hidden by renderNav at zero. The collapse takes the list and its badges
           with it, and the badges are what say something is waiting. The edge keeps their sum, as a
           bare pill, and clicking it opens the panel. -->
      <button id="navStripWaiting" class="ghost iconbtn" onclick="toggleNav(true)" hidden><span
        class="n" id="navStripCount"></span></button>
      <div class="nav-nav">
        <div class="nav-sect" id="navSect">
          <div id="navPath">
            <button class="pathbtn" onclick="togglePathMenu()" aria-haspopup="true" aria-expanded="false"><span
              id="navPathLabel"></span><span class="car">▾</span></button>
            <div class="menu" id="navPathMenu" role="menu" hidden></div>
          </div>
          <div id="navSort">
            <button class="sortbtn" onclick="toggleSortMenu()" aria-haspopup="true" aria-expanded="false"
              title="Sort the folder"><span id="navSortLabel">spine</span><span class="car">▾</span></button>
            <div class="menu" id="navSortMenu" role="menu" hidden></div>
          </div>
        </div>
      </div>
    </div>
    <div id="navList" class="nav-list"></div>
    <!-- App-level, so it lives in the panel's foot with the rest of the frame's chrome — the header
         carries only what belongs to the open document. -->
    <a class="doclink nav-docs" href="https://github.com/smithavt14/sidecar" target="_blank" rel="noopener">docs</a>
  </nav>
  <!-- The panel's drag handle. Same contract as #railGrip: over the boundary, not a track of its own. -->
  <div id="navGrip" role="separator" aria-orientation="vertical" aria-label="Resize the folder panel" tabindex="0"></div>
  <div>
    <div id="doc"></div>
    <!-- Asset only: what the pointer is over inside the frame. See the frame's `hover` message. -->
    <div id="hoverHint" aria-hidden="true"></div>
  </div>
  <!-- The drag handle, between the two columns in reading order and placed over their boundary by CSS.
       role=separator + tabindex so it is operable without a pointer (see the keydown handler). -->
  <div id="railGrip" role="separator" aria-orientation="vertical" aria-label="Resize review panel" tabindex="0"></div>
  <aside id="side"></aside>
</main>
<div id="filelist" style="display:none"></div>
<div id="seltool">
  <div class="fmt">
    <button data-op="fmt-toggle" class="fmt-btn pop" title="Text style">¶<span class="car">▾</span></button>
    <div class="fmt-menu" hidden>
      <button data-op="p">¶&nbsp;&nbsp;text</button>
      <button data-op="h1">heading 1</button>
      <button data-op="h2">heading 2</button>
      <button data-op="h3">heading 3</button>
    </div>
  </div>
  <span class="tsep"></span>
  <button class="pop" data-op="bold" title="Bold (⌘B)"><b>B</b></button>
  <button class="pop" data-op="italic" title="Italic (⌘I)"><i>I</i></button>
  <span class="tsep"></span>
  <button class="pop" data-op="link">link</button>
  <button class="pop" data-op="comment">comment</button>
</div>
<div id="popover"></div>
<div id="banner"></div>
<div id="lightbox"><img alt=""></div>
<!-- One file picker for every compose box, not one per card: the "image" button records which
     textarea asked, then clicks this. accept is a hint, not a check — the server sniffs the bytes. -->
<input type="file" id="picker" accept="image/*" multiple hidden>
<!-- The asset frame, written out as markup rather than built in code so the flag set is one literal
     string a test can pin — and the test pins the WHOLE FILE, asserting the same-origin flag is spelled
     nowhere in it, which is why no comment here spells it either. `allow-scripts` and nothing else: a
     frame granted this page's origin would reach sidecar's file read/write API, and the isolation
     guarantee (docs/adr/0001-asset-frame-isolation.md) would be gone. The only script inside is the
     picker, which assetframe.js inlines after DOMPurify has stripped the asset's own. -->
<template id="assetFrameTpl"><iframe class="asset-frame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="asset preview"></iframe></template>
<div id="navBackdrop" onclick="closeNavDrawer()"></div>
<div id="sheetBackdrop" onclick="toggleSheet(false)"></div>
<button id="sheetToggle" onclick="toggleSheet()">review <span class="n" id="sheetCount"></span></button>

<script>
const qs = new URLSearchParams(location.search);
let FILE = qs.get('f');
let state = null, blocks = [], pendingSel = null;
let sideTab = 'active';   // which review-rail tab is showing: 'active' | 'archived'
let dirty = false, saveTimer = null, savedRange = null;

// HTML → markdown serializer. Escaping off so prose keeps clean markers (no `\*` noise);
// this is a personal editor, not a hostile-input renderer.
const td = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-',
  codeBlockStyle: 'fenced', emDelimiter: '_', hr: '---' });
td.escape = (s) => s;
// GFM round-trip: without these rules turndown flattens tables to loose lines, drops task-list
// checkboxes, and strips ~~strikethrough~~ — silently corrupting any such block it re-serializes.
// (tables/strike/tasklist operate on <table>/<del>/<li><input>; no overlap with the custom li rule below.)
td.use(turndownPluginGfm.gfm);
// Tight list markers ("- " / "1. ", 2-space continuation) instead of turndown's 4-space padding,
// so a one-word edit doesn't reflow every bullet in the git diff.
td.addRule('tightList', {
  filter: 'li',
  replacement: (content, node) => {
    content = content.replace(/^\n+/, '').replace(/\n+$/, '\n').replace(/\n/gm, '\n  ');
    const parent = node.parentNode;
    let prefix = '- ';
    if (parent.nodeName === 'OL') {
      const start = parent.getAttribute('start');
      const idx = Array.prototype.indexOf.call(parent.children, node);
      prefix = (start ? Number(start) + idx : idx + 1) + '. ';
    }
    return prefix + content + (node.nextSibling && !/\n$/.test(content) ? '\n' : '');
  },
});
// The serialize/reindex/toMd round-trip lives in /serialize.js (shared with the Node test suite so
// the exact save-path code is what's tested). These thin wrappers bind the page's live state — the
// configured turndown `td`, the current `blocks` model, `$('doc')`, `marked`, `state.markdown` — so
// every call site below (toMd(el), serialize(), reindex()) stays identical to when it was inline.
function toMd(node) { return Serialize.toMd(node, td); }
function serialize() { return Serialize.serialize($('doc'), blocks, td); }
function reindex() { blocks = Serialize.reindex($('doc'), blocks, state.markdown, marked, td); }

const $ = (id) => document.getElementById(id);

// Relative "last reviewed" label for the file picker (mtime of the doc or its sidecar, whichever is newer).
function timeAgo(ms) {
  if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  const m = s / 60; if (m < 60) return Math.floor(m) + 'm ago';
  const h = m / 60; if (h < 24) return Math.floor(h) + 'h ago';
  const d = h / 24; if (d < 7) return Math.floor(d) + 'd ago';
  const w = d / 7; if (w < 5) return Math.floor(w) + 'w ago';
  const mo = d / 30; if (mo < 12) return Math.floor(mo) + 'mo ago';
  return Math.floor(d / 365) + 'y ago';
}

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
}

// ---------- boot ----------
async function boot() {
  if (!FILE) {
    const { files, defaultFile } = await api('GET', '/api/files');
    if (defaultFile) { location.search = '?f=' + encodeURIComponent(defaultFile); return; }
    // The whole-tree picker, which is a different question from the panel's one folder: there is no
    // open document yet, so there is no folder to be in. Its toggle goes with it.
    $('main').style.display = 'none'; $('filelist').style.display = 'block';
    $('navToggle').style.display = 'none';
    document.body.classList.add('no-nav');   // and the inset the frame reserves comes off with it
    const ext = (p) => { const b = p.split('/').pop(); const i = b.lastIndexOf('.'); return i > 0 ? b.slice(i + 1) : ''; };
    $('filelist').innerHTML = '<div class="h">pick a file</div><div class="sub">documents, most recently reviewed first.</div>' + files.map(f =>
      `<a href="/?f=${encodeURIComponent(f.rel)}"><span class="ext">${esc(ext(f.rel))}</span>` +
      `<span class="nm">${esc(f.rel)}</span><span class="sp"></span>` +
      `<span class="ago">${esc(timeAgo(f.mtime))}</span>` +
      (f.open ? `<span class="count">${f.open}</span>` : `<span class="none">—</span>`) + `</a>`).join('');
    return;
  }
  document.title = 'sidecar · ' + FILE;
  $('doc').contentEditable = 'true';
  // Stamp the entry we arrived on, so a back from a document opened in the panel lands here with a
  // state object rather than on the URL fallback.
  history.replaceState({ f: FILE, y: 0 }, '', location.href);
  // Switching documents replaces the page's contents without navigating, so the browser's own scroll
  // restore has nothing to restore from: it would fire against the outgoing document's height and
  // land wherever that happened to be. The position rides on the history entry instead (stampScroll),
  // and openDoc puts it back once the incoming document has a height (restoreScroll).
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  await reloadFile();
  loadDir(dirOf(FILE));   // not awaited: the document is what was asked for, the folder is context
  const es = new EventSource('/events');
  es.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    // A theme file changed under the themes directory. Re-read them and re-apply, which is what makes
    // editing a theme in sidecar repaint the tool on save. It carries `rel` too when the file happens
    // to sit inside the served root, so the document below reloads through exactly the path any other
    // document does — one event, both jobs.
    if (msg.event === 'themes') await loadThemes();
    const rel = msg.rel;
    if (!rel) return;
    navTouched(rel);       // a sibling moved: the folder's order may have, and a new file may exist
    if (rel !== FILE) return;
    const fresh = await api('GET', '/api/state?path=' + encodeURIComponent(FILE));
    if (fresh.hash === state.hash) {          // our own save, or only the sidecar/presence moved — keep the caret
      // A presence heartbeat fires every 15s while an agent is watching, and it
      // arrives here with the review byte-identical. Rebuilding the rail for it
      // threw away scroll position mid-sentence — the rail jumping under you
      // every 15 seconds while writing a reply. Only re-render what moved.
      const reviewMoved = JSON.stringify(fresh.review) !== JSON.stringify(state.review);
      // The rail must also rebuild when the per-thread marks changed (a wait exit delivering item
      // ids, or a re-arm clearing them) — but NOT on the plain 15s watching heartbeat, whose empty
      // item list matches the previous one and would otherwise rebuild the rail under the caret.
      const marksMoved = JSON.stringify((fresh.presence || {}).items || []) !==
                         JSON.stringify((state.presence || {}).items || []);
      state.review = fresh.review;
      state.presence = fresh.presence;        // presence pings arrive here (doc bytes unchanged)
      if (reviewMoved || marksMoved) renderSide();
      else renderPresence();
      return;
    }
    if (dirty) {                              // genuine external edit while we have unsaved text
      showBanner('File changed on disk while you were editing.', [
        { label: 'Reload (discard my edits)', fn: () => { dirty = false; applyState(fresh); } },
        { label: 'Keep typing', fn: () => {} },
      ]);
      return;
    }
    applyState(fresh);
  };
}

async function reloadFile() {
  applyState(await api('GET', '/api/state?path=' + encodeURIComponent(FILE)));
}
function applyState(s) {
  hideBanner();
  state = s; dirty = false;
  // An asset never saves, so "saved" would be a claim about nothing.
  setStatus(s.kind === 'asset' ? '' : 'saved');
  setHoverHint('');
  if (s.code) { const b = document.querySelector('.brand'); if (b) b.title = 'server code ' + s.code; }   // §6b: staleness visible on hover
  renderPwd(); renderDoc(); renderSide();
}
// pwd line above the doc — the document's path, terminal-style (dir muted, filename inked). It is the
// whole of the title group: the extension already says which kind of document is open.
function renderPwd() {
  paintZoom();
  const p = state.pwd || FILE || '';
  // Either separator: the server sends its own platform's path, and on Windows that is backslashes.
  const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
  // The name is the title. The folders are in the panel beside it, as a menu that can show all of
  // them, so printing them here a second time only made the bar longer; the whole path is the hover.
  $('pwd').innerHTML = `<span class="file">${esc(i >= 0 ? p.slice(i + 1) : p)}</span>`;
  $('pwd').title = p;
}
// Settled is silence: 'saved' is the steady state and a label that never changes is furniture. The
// transient states (editing…, saving…) and the two that need acting on (conflict, save failed) show.
function setStatus(s) { $('status').textContent = s === 'saved' ? '' : s; }
// The asset's hover label. Pinned to the document column's left edge when it is written, because the
// column moves with two draggable panels and the hint is fixed to the window.
function setHoverHint(s) {
  const el = $('hoverHint');
  if (!el) return;
  if (s) el.style.left = Math.round($('doc').getBoundingClientRect().left + 12) + 'px';
  el.textContent = s || '';
}
// The text is cleared on transitionend, not immediately: emptying it mid-flight would collapse the
// toast to a dot and animate that instead. A guard covers the case where the class is re-added before
// the exit finishes (a second banner raised straight after a dismissal).
function hideBanner() {
  const b = $('banner');
  if (!b.classList.contains('open')) { b.innerHTML = ''; return; }
  b.classList.remove('open');
  b.addEventListener('transitionend', function done(e) {
    if (e.target !== b || e.propertyName !== 'opacity') return;
    b.removeEventListener('transitionend', done);
    if (!b.classList.contains('open')) b.innerHTML = '';
  });
}
function showBanner(text, actions) { // actions: [{label, fn}]
  const b = $('banner');
  b.innerHTML = '';
  b.append(text);
  for (const a of actions) {
    const btn = document.createElement('button');
    btn.textContent = a.label;
    btn.onclick = () => { hideBanner(); a.fn(); };
    b.appendChild(btn);
  }
  // No rAF dance needed: the toast is `visibility:hidden`, not `display:none`, so it always has a
  // resting opacity/transform to animate FROM. Re-raising mid-exit just retargets the transition.
  b.classList.add('open');
}

// marked v12 ships no sanitizer, so its HTML output — including any raw HTML embedded in the source
// markdown (<img onerror>, <svg onload>, <script>, javascript: URLs) — would execute when assigned to
// innerHTML, on a page that's same-origin with the file read/write API. Scrub every marked→innerHTML
// path through DOMPurify first. Defaults already drop scripts, event-handler attrs, and unsafe URL
// schemes while keeping headings/lists/tables/links/code/images/bold/italic, so no extra config needed.
// Display-only: the serialize()/toMd save path is separate, so untouched blocks still emit their raw bytes.
function renderMd(tokens) { return DOMPurify.sanitize(marked.parser(tokens)); }

// ---------- doc: one live rich-text surface (contenteditable), saved as markdown ----------
function renderDoc() {
  const doc = $('doc');
  doc.innerHTML = '';
  // An asset is HTML reviewed as a rendered visual: it goes into a sandboxed frame, not through the
  // markdown path, which would draw its source as text under an editable surface.
  if (state.kind === 'asset') {
    doc.contentEditable = 'false';
    doc.classList.add('asset');     // drops the prose measure — see #doc.asset
    blocks = [];
    doc.appendChild(buildAssetFrame());
    refreshFrame();
    return;
  }
  // Set on every markdown render, not once at boot: switching from an asset to a document in the same
  // view would otherwise leave the read-only surface the asset asked for, with no way to type in a
  // document that is perfectly editable. The measure comes back for the same reason.
  doc.contentEditable = 'true';
  doc.classList.remove('asset');
  const tokens = marked.lexer(state.markdown);
  blocks = []; let off = 0;
  for (const t of tokens) {
    const start = off; off += t.raw.length;
    blocks.push({ token: t, start, end: off });
  }
  blocks.forEach((b, i) => {
    if (b.token.type === 'space') return;
    const el = document.createElement('div');
    el.className = 'block'; el.dataset.i = i;
    if (renderAtomic(el, b)) { doc.appendChild(el); return; }   // sets its own md0; never goes through turndown
    el.innerHTML = renderMd([b.token]);   // sanitized before it hits the DOM; .block wrapper added after, structure intact

    // safe to add: turndown's link rule reads href and title, so nothing about it reaches the file.
    el.querySelectorAll('a[href]').forEach(a => {

// A relative image path in the document is relative to the DOCUMENT, but the page lives at `/?f=…`,
// so the browser would resolve `./flow.png` against the app root and 404. Hand both halves to the

// (safePath), instead of being re-derived here where it would drift.

// ---------- the asset frame ----------
// An .html asset renders in a sandboxed iframe whose srcdoc the CLIENT assembles: DOMPurify strips the
// asset's scripts, handlers and embedded browsing contexts while keeping its styles, relative
// references are rewritten to the /assets route, and sidecar's picker is inlined as the only script
// that runs in there. The pipeline itself lives in /assetframe.js, shared with the Node tests.
//
// Everything the page needs from inside the frame crosses a postMessage boundary, because the sandbox
// deliberately withholds this page's origin from it: the natural canvas size (to scale by), per-item
// rects (to dock cards by), and picks. See docs/adr/0001-asset-frame-isolation.md for why a frame and
// not a shadow root.
const isAsset = () => !!state && state.kind === 'asset';

let frameAnchors = {};     // item id → 'resolved' | 'missing', the frame's own view of each anchor
let pendingElement = null; // the element anchor a pick is composing against

// server; the frame could not fetch it at all without a round trip on an opaque origin.
let pickerSrc = null;
async function pickerSource() {
  if (pickerSrc == null) pickerSrc = await (await fetch('/picker.js')).text();
  return pickerSrc;
}

function buildAssetFrame() {

  wrap.className = 'asset-wrap';

  // comment on #assetFrameTpl.
  frameEl = $('assetFrameTpl').content.firstElementChild.cloneNode(true);
  frameGeometry = {}; frameAnchors = {}; frameNatural = null; frameScale = 1;
  // Is the pointer over the frame? The AUTHORITY is the picker's `pointer` message: under site
  // isolation the frame is another process and these enter/leave listeners never fire (real Chrome),
  // while the picker sees every move from inside. The pair stays as a fallback for engines that do
  // deliver it — both describe the same truth, so they cannot disagree for long.
  pointerInFrame = false;
  frameEl.addEventListener('mouseenter', () => { pointerInFrame = true; });
  frameEl.addEventListener('mouseleave', () => { pointerInFrame = false; });
  // Before the first `ready`, the frame has the browser-default 300px viewport, and that is the width
  // the picker MEASURES a responsive document at (a fixed-size poster reports its own width either
  // way). Lay the frame out at the column width first, so a responsive asset is measured at the width
  // it will actually be read at; sizeFrame then pins the measured width explicitly.
  frameEl.style.width = '100%';
  wrap.appendChild(frameEl);
  return wrap;
}

// Alt taps step the picker one layer down its stack, which is how a covered element is reached at all
// (a full-bleed scrim owns every point it covers). A keydown goes to whichever document has focus, and
// the frame has none until it is clicked, so the page forwards the first press itself. The picker
// handles `step` identically to its own keydown, so the two routes cannot drift.
let pointerInFrame = false;
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Alt' || e.repeat || !pointerInFrame || !isAsset()) return;
  e.preventDefault();      // Alt alone focuses the menu bar on Windows and Linux
  sendFrame('step', {});
});
// Shift held over the frame puts the asset in LINK MODE: its links read as links and a click follows one
// (see the picker's STYLE and its click handler). Forwarded for the same reason Alt is, that the frame has
// no focus until it is clicked, so the first press would otherwise do nothing.
//
// The key is only ever forwarded ON here. Turning it off is the picker's own keyup, its blur, and the true
// state on every mouse event, because the press that got us here can be released anywhere: another
// window, another tab, the rail. The clear below is the page's half of the same insurance.
const sayLinkMode = (on) => { if (isAsset()) sendFrame('linkmode', { on: on }); };
window.addEventListener('keydown', (e) => { if (e.key === 'Shift' && pointerInFrame) sayLinkMode(true); });

window.addEventListener('blur', () => sayLinkMode(false));

async function refreshFrame() {
  const el = frameEl, src = await pickerSource();

  frameEl.setAttribute('srcdoc', AssetFrame.buildFrame({
    html: state.markdown, docRel: FILE, purify: DOMPurify, picker: src }));
}

// Scale the natural canvas into the document column. A transform rather than a width: an asset is laid
// out to the pixel (a 1080x1350 poster), so reflowing it to fit would review a different document.
// Two zooms, and the transform is the whole difference between them (see assetZoom): `fit` scales the

function sizeFrame() {

  // Toggle the scroller BEFORE measuring. Coming back from 100% the wrapper may still be carrying a

  // short and never recovers, because the next fit measures the same wrong width.

  // zero on macOS, ~15px on Windows — instead of reserving a guess on every platform.

function sendFrame(name, body) {

function frameItems() {

// answers, and only the first two are navigation: another document in this root (public/doclink.js
// decides, and it refuses anything that climbs out of it), an outbound URL, a fragment in this asset,
// and nothing sidecar follows (an absolute path, a mailto:, a file it does not review), which stays an

    // the modifier and the destination, which is the half of the confusion the outline could not fix:

// The picker resolved an anchor and knows more about it than the store does — a terminal-written item
// carries only its `sel`, and one that re-resolved by signature has a path that has moved. Write the

async function backfillElement(id, element) {
  const it = state.review.items.find(i => i.id === id);

  if (cur.path === element.path && cur.sig === element.sig) return;   // nothing new — never write in a loop

// ---------- atomic blocks ----------

// human cannot type into, and that is the entire safety story: the save path re-serializes an EDITED
// block through turndown, which has no idea what an <svg> is and flattens it to its bare label text
// ("Sign up\n\nVerify"). Making the block uneditable means that code path can never be reached for it,
// rather than merely being unlikely. Their md0 is the ORIGINAL markdown, so serialize() emits the
// source bytes verbatim on every save, in both the aligned and the block-count-changed path.
// The floor a diagram is allowed to shrink to. Flow.render draws its labels at 13px (see .fl-label),
// so a diagram scaled to s renders them at 13s; 11px is the smallest that still reads as a label on a

  const btn = $('navToggle');
  if (btn) {
    const label = shown ? 'Hide the folder' : 'Show the folder';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }
  for (const id of ['navToggle', 'navCollapse', 'navExpand']) {
    const el = $(id);
    if (el) el.setAttribute('aria-expanded', shown ? 'true' : 'false');
  }
}
(function navDrag() {
  const grip = $('navGrip');
  let dragId = null;
  grip.addEventListener('pointerdown', (e) => {
    if (!railResizable() || navCollapsed()) return;
    dragId = e.pointerId;
    grip.setPointerCapture(dragId);
    document.body.classList.add('nav-dragging');
    e.preventDefault();
  });
  grip.addEventListener('pointermove', (e) => {
    if (dragId === null) return;
    // The panel's left edge is the WINDOW's, so the width is just the pointer's x.
    //
    // It used to read main's left edge, which was the same pixel back when the panel was main's first
    // grid track. It is not any more: main starts AFTER the panel now, so this measured the pointer
    // against the panel's own right edge and every drag computed a width near zero, pinned to NAV_MIN,
    // and then fed the smaller track back into the next move. The panel snapped to its minimum and
    // stayed there, which is what a resize that "does not work" looked like.
    applyNavWidth(e.clientX, false);
    applyRailWidth(restRail(), false);   // the fill is measured against what the panel leaves
    relayoutDoc();
  });
  const endDrag = () => {
    if (dragId === null) return;
    try { grip.releasePointerCapture(dragId); } catch {}
    dragId = null;
    document.body.classList.remove('nav-dragging');
    applyNavWidth(navWidth, true);   // one write at the end, not one per pointermove
    relayoutDoc();
  };
  grip.addEventListener('pointerup', endDrag);
  grip.addEventListener('pointercancel', endDrag);
  // Right widens the panel, because right is the direction its edge travels — the mirror of the
  // rail's handle, which is the other way round for the same reason.
  grip.addEventListener('keydown', (e) => {
    if (!railResizable() || navCollapsed()) return;
    const step = e.shiftKey ? 48 : 12;
    if (e.key === 'ArrowRight') applyNavWidth(clampNav(navWidth) + step, true);
    else if (e.key === 'ArrowLeft') applyNavWidth(clampNav(navWidth) - step, true);
    else return;
    e.preventDefault();
    applyRailWidth(restRail(), false);
    relayoutDoc();
  });
})();
// Restore before the first render, so the panel never flashes at the default width and then jumps.
//
// With no preference on file the default depends on what was ASKED FOR. A URL naming a document is a
// request to read that document, and 248px of folder listing beside it is the answer to a question
// nobody asked, so the panel rests as its bare edge, one click from the full list. Arriving with no
// document is the other request, the picker, and there the panel is the point.
//
// Three states in the store, not two: `1` collapsed, `''` open, absent never answered. toggleNav
// writes the empty string on every expand, so anyone who has opened the panel once has said so, and
// this only decides for someone who never has.
const navPref = uiStore.get('navCollapsed', null);
if (navPref === null ? !!FILE : navPref === '1') document.body.classList.add('nav-collapsed');
applyNavWidth(navWidth, false);
paintNavToggle();
// The rail's fill is measured against what the panel left of the window, and the panel's own width
// only just landed — the rail applied itself against the stylesheet's 248px default further up this
// file. Re-apply now that the two are in the order they will be in for the rest of the session.
applyRailWidth(restRail(), false);

// ---------- mobile bottom sheet ----------
function toggleSheet(force) {
  const open = force === undefined ? !document.body.classList.contains('sheet-open') : force;
  document.body.classList.toggle('sheet-open', !!open);
}
// Drag-to-dismiss: the sheet follows the finger down and closes past a threshold, else snaps back.
// Only when the card list is scrolled to the top (scrollTop<=0), so dragging doesn't fight scrolling.
(function sheetDrag() {
  const sheet = $('side');
  let startY = 0, dy = 0, dragging = false, fromTop = false;
  sheet.addEventListener('touchstart', (e) => {
    if (!document.body.classList.contains('sheet-open')) return;
    startY = e.touches[0].clientY; dy = 0;
    fromTop = sheet.scrollTop <= 0;
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0 && fromTop) {                 // dragging the sheet down (not scrolling the list)
      e.preventDefault();
      sheet.style.transform = 'translateY(' + dy + 'px)';
    }
  }, { passive: false });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';             // restore the .26s ease so close/snap-back animates
    sheet.style.transform = '';              // fall back to CSS: translateY(0) or (on close) 102%
    if (dy > 110) toggleSheet(false);        // past threshold → dismiss
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
})();

// ---------- anchor highlights: a persistent cue on every commented/suggested span ----------
// Wrap the (occurrence-th) match of an anchor quote in <mark data-id> — across text nodes, so a
// phrase that spans bold/links stays fully highlighted. Marks are contenteditable:false (a clean tap
// target, no keyboard) and are stripped by toMd() on save, so they never touch the markdown.
// The document's rendered text as one string, plus the text nodes it was built from. Shared by the
// highlighter and the rail's ordering so an anchor's offset and its highlight can never disagree.
// (wrapAnchor must re-read this per item: wrapping one anchor mutates the tree under the next walk.)
function docText() {
  // Atomic blocks are excluded on purpose, for two independent reasons. (1) surroundContents() would
  // inject an HTML <mark> into the SVG namespace, where it doesn't render — the diagram would just
  // lose a label. (2) A diagram's rendered text is its node labels, one per node, while the fence
  // SOURCE mentions a label once per edge; letting the two into the same offset space makes the
  // occurrence index mean different things at write time and at highlight time. Anchored nodes get
  // their cue from markAnchors() marking the <g> instead.
  const walker = document.createTreeWalker($('doc'), NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentElement && n.parentElement.closest('[data-atomic]'))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = []; let full = '';
  while (walker.nextNode()) { nodes.push({ node: walker.currentNode, start: full.length }); full += walker.currentNode.textContent; }
  return { nodes, full };
}
function wrapAnchor(quote, occurrence, id, mine) {
  const { nodes, full } = docText();
  // Same matcher the server + occurrenceFor use, run over the concatenated rendered text; the returned
  // offsets index straight into `full`, so the text-node slicing below is unchanged.
  const hit = Anchor.findNth(full, quote, occurrence || 0);
  if (!hit) return null;
  const { start, end } = hit;
  const slices = [];
  for (const { node, start: ns } of nodes) {
    const ne = ns + node.textContent.length;
    if (ne <= start || ns >= end) continue;
    slices.push({ node, s: Math.max(0, start - ns), e: Math.min(node.textContent.length, end - ns) });
  }
  let first = null;
  for (const sl of slices) {
    // A span crossing a block boundary also covers the structural newline BETWEEN the blocks, which is
    // its own whitespace text node. Wrapping it produced a 2px cue floating in the paragraph gap,
    // highlighting nothing. Skip whitespace-only slices that carry a newline: an inter-word space
    // between two inline elements is whitespace too, but never contains one, so it still gets marked.
    const slice = sl.node.textContent.slice(sl.s, sl.e);
    if (!slice.trim() && slice.includes('\n')) continue;
    const r = document.createRange(); r.setStart(sl.node, sl.s); r.setEnd(sl.node, sl.e);
    const mark = document.createElement('mark'); mark.className = 'anchor' + (mine ? ' mine' : '');
    mark.dataset.id = id; mark.contentEditable = 'false';
    try { r.surroundContents(mark); if (!first) first = mark; } catch {}
  }
  return first;
}
// Re-apply the cues to match current open items. Skipped while the doc is being edited (protects the
// caret); the marks refresh on the next render/save cycle.
function markAnchors() {
  const doc = $('doc');
  // An asset's cues are drawn by the picker, inside the frame, on the elements themselves. Hand it the
  // current anchor set instead of running the text matcher over a document that holds one iframe.
  if (isAsset()) { sendFrame('init', { items: frameItems() }); return; }
  if (document.activeElement === doc || doc.contains(document.activeElement)) return;
  doc.querySelectorAll('mark.anchor').forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); });
  doc.querySelectorAll('.fl-node.anchored').forEach(g => { g.classList.remove('anchored'); delete g.dataset.itemId; });
  doc.normalize();
  litId = null;   // every mark that carried it has just been unwrapped
  for (const it of state.review.items) {
    if (!['open', 'pending'].includes(it.status)) continue;
    if (it.kind === 'suggestion' && it.replyTo) continue;   // shares its parent comment's span — don't double-wrap
    // Guarded per item: a throw here used to abandon every REMAINING highlight, so the document
    // silently lost its cues while the cards still listed them.
    // Nodes first, and a node claims the item outright. The quote is the node's LABEL, which usually
    // also appears in the prose around the diagram — highlighting that instead put the cue, and the
    // docked card, next to a paragraph the comment was never about.
    let onNode = false;
    try { onNode = markNodes(it.anchor.quote, it.id) > 0; }
    catch (e) { console.error('sidecar: failed to highlight node', it.id, e); }
    if (onNode) continue;
    // Whose span this is, so the wash matches the dot on the card. Same whoCls the card head uses, so
    // a custom SIDECAR_USER or SIDECAR_AGENT colours both ends identically.
    try { wrapAnchor(it.anchor.quote, it.anchor.occurrence || 0, it.id, whoCls(it.by) === 'human'); }
    catch (e) { console.error('sidecar: failed to highlight', it.id, e); }
  }
  syncMarkEditing();
}
// A mark is contenteditable:false everywhere else, which is what makes it a clean tap target for its
// card. In reading mode there is no card to tap and the mark is not painted, so an anchored sentence
// would be an invisible island the caret could not enter — the one thing the mode promises you can
// still do. Called from both ends, because marks are rebuilt on every render.
function syncMarkEditing() {
  for (const m of $('doc').querySelectorAll('mark.anchor')) {
    if (isReading()) m.removeAttribute('contenteditable');   // inherit #doc's own editability
    else m.contentEditable = 'false';
  }
}
// A diagram node whose label IS this item's quote gets the cue. Matched on the label rather than on
// anything stored in the sidecar, so a node comment stays an ordinary comment on disk — an agent that
// quotes a node by name from the CLI lights it up too, without knowing diagrams exist.
function markNodes(quote, id) {
  const want = String(quote || '').trim();
  if (!want) return 0;
  let hit = 0;
  for (const blockEl of $('doc').querySelectorAll('.block[data-atomic]')) {
    (blockEl.__flowNodes || []).forEach((n, i) => {
      if (n.label !== want) return;
      const g = blockEl.querySelector('.fl-node[data-node="' + i + '"]');
      if (g) { g.classList.add('anchored'); g.dataset.itemId = id; hit++; }
    });
  }
  return hit;
}
function pulse(nodes) { nodes.forEach(m => m.classList.add('flash')); setTimeout(() => nodes.forEach(m => m.classList.remove('flash')), 1400); }
// Tap a highlight in the doc → open its review (sheet on mobile) and flash the matching card.
$('doc').addEventListener('click', (e) => {
  if (isReading()) return;   // the rail is not on screen; opening a card would drag it back on
  const m = e.target.closest && e.target.closest('mark.anchor');
  if (m && m.dataset.id) openReview(m.dataset.id);
});
// A link to another document in this root opens IN sidecar, on a plain click, the way the panel's rows
// do. Reviewing a folder means following its citations, and the alternative was editing the URL by
// hand. The reach is deliberately narrow — DocLink refuses anything with a scheme, an absolute path, a
// bare fragment, an extension sidecar does not review, or a path that climbs out of the served root —
// so every other link keeps the behaviour it has today, including placing the caret in this
// contenteditable. The cost is that the text of one of these links is awkward to click into; the class
// added at render time at least says so with the cursor.
//
// Modifiers and non-left buttons bail, same as the panel, so cmd-click still opens a second tab.
$('doc').addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  const to = DocLink.route(a.getAttribute('href') || '', FILE);
  if (!to) return;
  e.preventDefault();
  openDoc(to.rel);
});
// Cmd/Ctrl+click opens a link in a new tab. A PLAIN click must keep placing the caret: this is a
// contenteditable, so hijacking every click would make the text around a link uneditable.
$('doc').addEventListener('click', (e) => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href') || '';
  // A document-relative link has no address the browser could open on its own: `./research.md` off
  // `/?f=…` resolves to a path this server does not serve. The tab gets the same `/?f=` URL the panel's
  // rows carry, which is what makes cmd-click mean the same thing in both places.
  const to = DocLink.route(href, FILE);
  if (to) {
    e.preventDefault();
    window.open('/?f=' + encodeURIComponent(to.rel), '_blank', 'noopener,noreferrer');
    return;
  }
  if (!/^https?:\/\//i.test(href)) return;   // outbound http(s) only — never javascript:/file paths
  e.preventDefault();
  window.open(href, '_blank', 'noopener,noreferrer');
});
// While Cmd/Ctrl is held, mark the doc so links show a pointer (see #doc.mod a[href]). Cleared on
// keyup AND on window blur — otherwise Cmd+Tab away leaves the modifier stuck "held" on return.
const setModHeld = (on) => $('doc').classList.toggle('mod', on);
window.addEventListener('keydown', (e) => { if (e.key === 'Meta' || e.key === 'Control') setModHeld(true); });
window.addEventListener('keyup', (e) => { if (e.key === 'Meta' || e.key === 'Control') setModHeld(false); });
window.addEventListener('blur', () => setModHeld(false));
// Resize changes both the text reflow and the desktop/mobile cutoff, so the docked layout is recomputed
// (or torn down, below 781px) on every resize. An asset frame also re-scales: its canvas is fixed, the
// column it has to fit into is not.
// Both panels' bounds are viewport-relative, so a resize also re-clamps them — without persisting,
// since narrowing the window is not the human changing their mind about how wide either should be.
// Crossing up out of the drawer breakpoint also drops an open drawer: on the desktop grid the panel is
// a column, and a leftover "open" would come back the next time the window narrowed.
window.addEventListener('resize', () => {
  if (!navIsDrawer() && navDrawerOpen()) document.body.classList.remove('nav-open');
  applyNavWidth(navWidth, false);
  applyRailWidth(restRail(), false);
  paintNavToggle();          // the button means "collapse" above the breakpoint and "open" below it
  if (isAsset()) sizeFrame();
  scheduleDock();
});
// Everything in the document that stands for this item: its prose highlights, or the diagram node
// standing in for them. One helper so jumping, flashing and docking can never disagree about where an
// item lives — they did, and a node comment flashed nothing while its card docked next to a paragraph.
function anchorEls(id) {
  const sel = cssId(id);
  const marks = [...$('doc').querySelectorAll('mark.anchor[data-id="' + sel + '"]')];
  return marks.length ? marks : [...$('doc').querySelectorAll('.fl-node.anchored[data-item-id="' + sel + '"]')];
}
function openReview(id) {
  toggleSheet(true);
  document.querySelectorAll('.flash').forEach(m => m.classList.remove('flash'));
  pulse(anchorEls(id));
  if (isAsset()) sendFrame('pulse', { id });
  const card = $('side').querySelector('.card[data-id="' + id + '"]');
  if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); pulse([card]); }
}
// Click a card's quote → jump to (and flash) its highlight in the doc.
function locate(id) {
  toggleSheet(false);
  markAnchors();
  document.querySelectorAll('.flash').forEach(m => m.classList.remove('flash'));
  // On an asset the flash happens inside the frame; the page can only scroll to the element's rect,
  // which it has from the picker's geometry.
  if (isAsset()) {
    sendFrame('pulse', { id });
    const r = frameRectFor(id);
    if (r) scrollTo({ top: Math.max(0, scrollY + r.top - innerHeight / 2), behavior: 'smooth' });
    return;
  }
  const marks = anchorEls(id);
  if (!marks.length) return;
  marks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  pulse(marks);
}
// Hovering a card lights the span it is about: `.lit` in the document, or the element inside the frame
// on an asset. The mark rests as a wash now and takes its underline back here, so the link between one
// card and one span is explicit exactly when somebody is looking for it, instead of a rule under every
// anchored sentence all the time. Delegated, because renderSide rebuilds every card.
let litId = null;
function litAnchor(id) {
  if (id === litId) return;
  litId = id;
  $('doc').querySelectorAll('.lit').forEach(m => m.classList.remove('lit'));
  if (id) anchorEls(id).forEach(m => m.classList.add('lit'));
}
$('side').addEventListener('mouseover', (e) => {
  const card = e.target.closest && e.target.closest('.card[data-id]');
  const id = card ? card.dataset.id : null;
  if (isAsset()) sendFrame('highlight', { id });
  else litAnchor(id);
});
$('side').addEventListener('mouseleave', () => {
  if (isAsset()) sendFrame('highlight', { id: null }); else litAnchor(null);
});

boot();
</script>
