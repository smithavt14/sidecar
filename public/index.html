<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sidecar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/anchor.js"></script>   <!-- the shared matcher; server requires the same file so both agree on occurrences -->
<script src="/serialize.js"></script>   <!-- the tight-diff serialize/reindex round-trip; Node tests require the same file -->
<script src="/flow.js"></script>   <!-- ```flow fences → SVG; pure string in/out, Node tests require the same file -->
<script src="/navsort.js"></script>   <!-- the directory panel's ordering; pure list in/out, Node tests require the same file -->
<script src="/doclink.js"></script>   <!-- does a link in the document open IN sidecar; pure string in/out, Node tests require the same file -->
<script src="/turn.js"></script>   <!-- whose turn is it: the panel's badges and the inbox; server.js requires the same file -->
<script src="/stability.js"></script>   <!-- freeze / last known position / orphan grace for the docked rail; Node tests require the same file -->
<script src="/assetframe.js"></script>   <!-- an .html asset → the sandboxed frame's srcdoc; Node tests require the same file -->
<script src="/lib/marked/marked.min.js"></script>
<script src="/lib/dompurify/dist/purify.min.js"></script>   <!-- marked v12 has no sanitizer; scrub its HTML before it hits innerHTML (XSS) -->
<script src="/lib/diff/dist/diff.min.js"></script>
<script src="/lib/turndown/dist/turndown.js"></script>
<script src="/lib/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>
<style>
  /* sidecar design system — clean, modern, single-user. Distinct from the spktr neo-brutalist look:
     hairlines + soft depth shadows, no hard offset borders. One rule holds it together —
     YELLOW = THE AGENT. #ffeb00 appears only on claude's presence, its diffs, its anchors, and
     open-item dots. Never on you, never on a primary button. Ink does the work; chrome is lowercase.
     Source: claude.ai/design "Sidecar Review" spec. */
  @font-face { font-family:'Geist'; font-weight:100 900; font-display:swap;
    src:url('/fonts/geist-latin.woff2') format('woff2'), url('/fonts/geist-latin-ext.woff2') format('woff2'); }
  :root {
    --bg:#ffffff;            /* page surface */
    --fill:#faf9f4;          /* recessed wells: code, diffs, icon holders */
    --ink:#141410;           /* headings, structure, your identity */
    --ink-btn:#1b1a15;       /* primary button */
    --fg:#33332c;            /* body copy */
    --muted:#8a8a82;         /* labels, secondary */
    --faint:#a3a39b;         /* timestamps, quiet quotes */
    --fainter:#b0b0a8;       /* mono meta, em-dash */
    --line:rgba(20,20,15,.08);      /* hairline */
    --line-2:rgba(20,20,15,.14);    /* quote rule, table cell */
    --line-strong:rgba(20,20,15,.16); /* button outline, input */
    /* The application frame. The folder panel is a SURFACE rather than a margin of the page, so it
       needs a ground of its own — grey text floating on the document's own white is the thing that
       made the panel read as a stray column. Warm, one step off --bg, with its own row states: hover
       and open are separated (Grant Developer's rail gives both the same tint and leans on weight
       alone, which is a step too quiet once every row is a filename rather than a destination). */
    --shell:#f6f5ef;         /* the panel's ground */
    --shell-row:rgba(20,20,15,.05);    /* a row under the pointer */
    --shell-on:rgba(20,20,15,.095);    /* the open document */
    --yellow:#ffeb00;        /* THE AGENT — nothing else */
    --yellow-ring:rgba(190,172,0,.65);
    --chip:#fffce0;          /* claude chip tint */
    --chip-fg:#2b2a20;
    --dark:#1b1a15;          /* toast surface */
    --shadow:0 1px 2px rgba(20,20,15,.05), 0 10px 30px -20px rgba(20,20,15,.35);
    --ring:0 0 0 3px rgba(20,20,15,.08);   /* focus — ink-tinted, not yellow (yellow is the agent's) */
    /* Release spring for pressable things. Solved from stiffness 500 / damping 30 / mass 0.6, which is
       zeta 0.87 — it overshoots by 0.4%, so the "pop" is the curve's shape rather than a bounce. A real
       bounce on a button you hit fifty times in a review would read as slop. */
    --spring-press:linear(0,0.088,0.266,0.457,0.624,0.754,0.849,0.913,0.954,0.979,0.993,1.001,1.004);
    /* The review rail's width, in one place: the grid track, the drag handle's position and the
       persisted preference are all this number. JS overwrites it on the root element. */
    --rail-w:372px;
    /* The directory panel's width, the same way. Two variables rather than one because the panel has
       a second resting size: --nav-w is the preference the human dragged to, --nav-track is what the
       grid actually gives it, which collapsing swaps for the icon strip without touching the
       preference underneath. */
    --nav-w:248px;
    --nav-track:var(--nav-w);
    color-scheme:light;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.6 'Geist', ui-sans-serif, system-ui, sans-serif; background:var(--bg);
    color:var(--fg); -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--yellow); color:var(--chip-fg); }
  /* The shell: the folder panel is a fixed column down the left of the WINDOW and everything else is
     inset past it. The panel used to be the grid's first track, which meant it started wherever main's
     centred cap happened to put it and ended wherever the tallest document did — a panel floating in
     the page rather than the frame the page sits in. Fixed and full height, it is the frame; the
     header and the document are its contents. The inset is one declaration on the body, so the page
     header, the document, the rail and the whole-tree picker all follow it without knowing about it. */
  @media (min-width: 781px) { body { padding-left:var(--nav-track); } }
  /* No open document means no folder to be in: the panel is not rendered (main is hidden with it), so
     the inset it reserves has to come off too. See boot's no-FILE branch. */
  body.no-nav { padding-left:0; }
  /* The content area's header, to the RIGHT of the panel and never over it. 52px, the same as the
     panel's own brand row, so one hairline runs unbroken across the top of the application — the
     measurement borrowed straight from Grant Developer's shell, where a two-pixel step between the
     rail's rule and the header's was the bug that made the two read as separate bars. */
  header { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  /* 51px + the 1px rule = the same 52px band the panel's brand row is, rule included. Both are
     border-box, so the two hairlines land on the same pixel row and read as one line across the app. */
  .hwrap { position:relative; display:flex; align-items:center; gap:12px; height:51px; padding:0 20px; }
  /* The title group, bounded so it can never run under the presence readout. That readout is
     absolutely centred, so it exerts no pressure on the flow and a long path simply slid beneath it:
     an asset's `read-only` tag and the word `claude` printed on top of each other at 1440. Half the
     bar, less the widest half a readout gets, is where the title has to stop. */
  .htitle { display:flex; align-items:center; gap:10px; min-width:0; max-width:calc(50% - 92px); }
  .hbrand { display:none; align-items:center; gap:8px; text-decoration:none; color:inherit; }
  body.no-nav .hbrand { display:flex; }
  .hbrand .mark, .nav-brand .mark { height:20px; width:auto; flex:none; display:block; }
  .hbrand .wm, .nav-brand .wm { color:var(--ink); font:600 15px 'Geist', ui-sans-serif, sans-serif; letter-spacing:-.02em; }
  .spacer { flex:1; }
  #status { font-size:12.5px; color:var(--faint); min-width:64px; text-align:right; }
  /* buttons — ink primary, thin-outline secondary, text ghost. Depth, not weight. */
  button { font:600 13px 'Geist', ui-sans-serif, sans-serif; padding:8px 16px; border:1px solid var(--line-strong);
    border-radius:9px; background:var(--bg); color:var(--fg); cursor:pointer;
    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease,
               transform .2s var(--spring-press); }
  button:hover { background:var(--fill); }
  /* Lift on hover, compress on press, spring back on release. The press uses a plain fast ease-out on
     the way DOWN (a spring there fights the finger) and the spring only on the way back up, which is
     where the pop lives. Hover lift is pointer-gated: on touch there is no hover, and without the gate
     the scale sticks after a tap. */
  @media (hover:hover) and (pointer:fine) { button:hover { transform:scale(1.02); } }
  button:active { transform:scale(.96); transition:transform .1s ease-out; }
  /* Dark buttons: a faint light edge so they read as a surface rather than a slab, and a faint white
     wash on hover instead of going darker (going darker on a near-black button reads as nothing). */
  button.primary { background:var(--ink-btn); color:#fff; border-color:rgba(255,255,255,.16);
    padding:8px 18px; }
  button.primary:hover { background:#26251e; border-color:rgba(255,255,255,.3); }
  button.ghost { border:none; background:none; color:var(--muted); font-weight:500; padding:8px 4px; }
  button.ghost:hover { color:var(--fg); background:none; }
  /* The only icon button in the tool — everything else here is a word. It sits in a row of text
     buttons, so it matches their ink and weight rather than announcing itself: 16px, currentColor,
     same 1.5 stroke as the wordmark. pointer-events:none on the svg keeps the delegated click
     dispatcher seeing the BUTTON as e.target, never the path inside it. */
  button.iconbtn { padding:7px 6px; line-height:0; }
  button.iconbtn svg { width:16px; height:16px; display:block; pointer-events:none; }
  /* Two columns: the document and the review. It FILLS the frame rather than being capped and centred
     inside it. The 1280 cap used to be here, and on a wide window it cost twice over: a dead band of
     nothing to the right of the cards, and cards squeezed to 372px while that band sat beside them.
     The measure the cap was protecting belongs to the DOCUMENT, so it is on the document (below), and
     what the document does not want goes to the rail (see autoRailWidth). */
  main { position:relative; display:grid; grid-template-columns: minmax(0,1fr) var(--rail-w); gap:0; }
  /* ---------- the divider between the document and the rail ----------
     Absolutely placed over the column boundary rather than given a grid track of its own, so the two
     tracks stay exactly what they were and nothing that measures the document column (sizeFrame,
     dockCards) sees a third participant. 11px of grab area straddling the aside's hairline; the 1px
     line it draws on hover is the only thing it adds visually. */
  #railGrip { position:absolute; top:0; bottom:0; right:calc(var(--rail-w) - 5px); width:11px; z-index:3;
    cursor:col-resize; touch-action:none; }
  #railGrip::after { content:''; position:absolute; top:0; bottom:0; left:5px; width:1px;
    background:var(--ink); opacity:0; transition:opacity .15s ease; }
  #railGrip:hover::after, #railGrip:focus-visible::after, body.rail-dragging #railGrip::after { opacity:.3; }
  #railGrip:focus { outline:none; }
  /* While dragging, the cursor has to hold everywhere (the pointer leaves the 11px strip immediately)
     and nothing may select. The asset frame is a separate document that would otherwise swallow the
     pointer the moment the drag crossed it. */
  body.rail-dragging, body.nav-dragging { cursor:col-resize; user-select:none; }
  body.rail-dragging iframe, body.nav-dragging iframe { pointer-events:none; }
  /* Collapsed: the rail's track is gone, so the document column measures wider — which is why
     toggleRail re-runs the same relayout a window resize does. The panel's track stays; collapsing
     the two panels is two independent decisions. */
  body.rail-collapsed main { grid-template-columns: minmax(0,1fr); }
  body.rail-collapsed aside, body.rail-collapsed #railGrip { display:none; }
  /* The rail's toggle: an icon button in the header chrome. Its badge is the agent's yellow, because
     what it counts is the agent's notes arriving while the panel was shut. */
  #railToggle { position:relative; }
  #railToggle .n { position:absolute; top:1px; right:-2px; min-width:14px; height:14px; padding:0 3px;
    border-radius:99px; background:var(--yellow); color:var(--chip-fg); box-shadow:0 0 0 1.5px var(--bg);
    font:600 10px/14px 'Geist', ui-sans-serif, sans-serif; text-align:center; }
  #railToggle .n:empty { display:none; }
  /* ---------- the directory panel ----------
     The folder the open document lives in, listed — and the application's frame. Fixed to the window
     rather than sitting in main's grid: full height, its own ground, one hairline down its right
     edge. It scrolls in its own box, because nothing in here has to stay level with the text and a
     folder of sixty documents would otherwise run the page's scroll height off the bottom of a short
     one. */
  #nav { position:fixed; top:0; left:0; bottom:0; width:var(--nav-track); z-index:32; overflow-y:auto;
    display:flex; flex-direction:column; min-width:0;
    padding:0 0 28px; border-right:1px solid var(--line); background:var(--shell); }
  /* The panel's chrome, sticky over its own list: a sixty-document folder otherwise scrolls its own
     controls away, and the panel scrolls itself to the open document on load. Opaque, so nothing
     shows through above it. */
  .nav-head { position:sticky; top:0; z-index:4; background:var(--shell);
    display:flex; flex-direction:column; }
  /* The brand row. The wordmark and the control that minimizes the panel sit together at the top of
     the frame, which is where Grant Developer puts its own wordmark and rail trigger — and it is what
     turns the panel from a column hung off the left edge into the application's first region. 52px and
     a hairline, matching the content header's to the pixel so the two rules meet as one line. */
  .nav-brand { display:flex; align-items:center; gap:8px; height:52px; flex:none; padding:0 10px 0 14px;
    border-bottom:1px solid var(--line); }
  .nav-brand .home { display:flex; align-items:center; gap:8px; min-width:0; text-decoration:none;
    color:inherit; border-radius:8px; padding:3px 5px; margin-left:-5px; transition:background .15s ease; }
  .nav-brand .home:hover { background:var(--shell-row); }
  /* 28px square, the trigger's size in GD's shell, and the same quiet ink so it reads as chrome. */
  #navCollapse, #navExpand { flex:none; margin-left:auto; width:28px; height:28px; padding:0;
    display:flex; align-items:center; justify-content:center; color:var(--faint); border-radius:7px; }
  #navCollapse:hover, #navExpand:hover { color:var(--ink); background:var(--shell-row); }
  /* Everything under the brand row that is still chrome: the path, then the list's label and its
     ordering control. Gone when the panel is a strip. */
  .nav-nav { display:flex; flex-direction:column; gap:2px; padding:11px 8px 4px; }
  /* The breadcrumb is the OPEN DOCUMENT's path, not a trail of where you have clicked, and every
     segment is live. Stepping up a level is clicking a shallower one; coming back down is clicking a
     deeper one, which is the half a one-way "up" button loses — a folder above a project usually
     holds no documents at all, so up with no way back is a dead end.
     ONE LINE. It wrapped into a three-line stack at 248px, which read as a paragraph of grey rather
     than as a path. Every segment keeps its whole name and the row overflows to the LEFT instead —
     pushed right, clipped, and faded out where it is cut. Ellipsising each segment in turn was worse
     at the width this actually runs at: four stubs reading `h… / vau… / projec… / ccdc-portal` is a
     path nobody can read, and the deep end, the folder the list below belongs to, is the end that has
     to survive. The fade is what says there is more to the left rather than leaving a hard cut. */
  #navCrumb { display:flex; flex-wrap:nowrap; align-items:center; justify-content:flex-end;
    gap:0 1px; padding:0 5px; min-width:0; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 22px);
    mask-image:linear-gradient(90deg, transparent 0, #000 22px);
    font-family:'Geist Mono', ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; line-height:1.6; }
  #navCrumb button { flex:none; border:none; background:none; box-shadow:none;
    padding:1px 3px; border-radius:5px; font:inherit; color:var(--faint); white-space:nowrap; }
  #navCrumb button:hover { background:var(--shell-row); color:var(--fg); transform:none; }
  #navCrumb button.here { color:#57574f; font-weight:600; }
  #navCrumb .sep { flex:none; color:var(--fainter); }
  /* The list's own label, and its ordering control, on one row. The uppercase micro-label is GD's
     section label (9.5px/700 at .15em, its rail's WORK and ORGANIZATION) — structure stated once,
     quietly, so the filenames below it are the only thing competing for the eye. */
  .nav-sect { display:flex; align-items:center; gap:8px; padding:9px 5px 3px; }
  /* `hidden` is how the two views are switched, and a `display` set anywhere in this file beats the
     browser's own `[hidden] { display:none }` — which is why both of the things it hides say so
     themselves. The list stayed on screen under the inbox until they did. */
  .nav-sect[hidden], .nav-list[hidden] { display:none; }
  .nav-label { flex:1; min-width:0; font:700 9.5px 'Geist', ui-sans-serif, sans-serif;
    letter-spacing:.15em; text-transform:uppercase; color:var(--muted); }
  /* the sort switcher — a menu, not three tabs: at 248px three labels have nowhere to sit, and the
     one that is chosen is the one worth reading. It is drawn as a CONTROL: an outlined chip with a
     caret, which is what a bare lowercase word sitting on the panel's ground could never say. */
  #navSort { position:relative; flex:none; }
  #navSort .sortbtn { display:flex; align-items:center; gap:5px; max-width:112px;
    border:1px solid var(--line-2); background:var(--bg); box-shadow:none;
    color:var(--fg); font:500 11.5px 'Geist', ui-sans-serif, sans-serif; padding:2px 6px; border-radius:7px; }
  #navSort .sortbtn:hover { background:var(--fill); border-color:var(--line-strong); color:var(--ink); transform:none; }
  #navSort .sortbtn #navSortLabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #navSort .sortbtn .car { flex:none; font-size:8px; opacity:.5; }
  #navSort .menu { position:absolute; top:calc(100% + 5px); right:0; left:auto; min-width:132px; z-index:6;
    background:var(--bg); border:1px solid var(--line-2); border-radius:10px; box-shadow:var(--shadow);
    padding:4px; display:flex; flex-direction:column; gap:1px; }
  #navSort .menu[hidden] { display:none; }
  #navSort .menu button { display:block; width:100%; text-align:left; white-space:nowrap; border:none;
    background:none; box-shadow:none; padding:7px 9px; border-radius:7px; color:var(--fg);
    font:500 12.5px 'Geist', ui-sans-serif, sans-serif; }
  #navSort .menu button:hover { background:var(--fill); transform:none; }
  #navSort .menu button[aria-checked="true"] { font-weight:600; color:var(--ink); background:var(--fill); }
  .nav-list { display:flex; flex-direction:column; gap:1px; padding:0 8px; }
  /* An icon-led row, GD's rail item measured across: 13.5px label, a 16px glyph, 2.5px of horizontal
     padding on a 6px radius. Its 7px of vertical padding lands a 30px row, compact enough that a
     project folder is one glance. */
  .nav-list a { display:flex; align-items:center; gap:8px; min-width:0; padding:6px 9px; border-radius:7px;
    text-decoration:none; color:var(--fg); font-size:13.5px; line-height:1.35; }
  .nav-list a .ic { flex:none; width:15px; height:15px; display:block; color:var(--faint); }
  .nav-list a:hover { background:var(--shell-row); color:var(--ink); }
  .nav-list a:hover .ic { color:var(--muted); }
  /* the open document: filled and inked, no accent bar. The panel is chrome and stays monochrome —
     yellow belongs to the agent. */
  .nav-list a.on { background:var(--shell-on); color:var(--ink); font-weight:600; }
  .nav-list a.on .ic { color:var(--ink); }
  .nav-list a .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* The row's right edge, kept as a slot rather than as whatever happens to be there: the sort's
     timestamp today, the your-turn badge next. GD's rail counts sit in exactly this position. */
  .nav-list a .meta { flex:none; margin-left:auto; display:flex; align-items:center; gap:6px;
    font-family:'Geist Mono', ui-monospace, monospace; font-size:10.5px; font-weight:400; color:var(--faint); }
  .nav-list a .meta:empty { display:none; }
  .nav-list a .ini { display:none; }
  .nav-empty { padding:10px; margin:0 8px; color:var(--muted); font-size:12.5px; line-height:1.5; }
  /* ---------- the your-turn badge ----------
     The count of items on a document that are waiting on the HUMAN (public/turn.js). Yellow, because
     yellow is the agent everywhere in this tool and a badge here means the agent is holding something
     out to you. A document with open items that are NOT your turn gets the neutral dot instead: still
     live, but the next move is the agent's, and drawing that in the same colour would make the whole
     folder look like a to-do list.
     The same pill as #railToggle's unread count, which is the other place a number means "look here". */
  .nav-list a .meta .nb { flex:none; }
  .nav-list a .meta .nb.turn { min-width:16px; height:16px; padding:0 4px; border-radius:99px;
    background:var(--yellow); color:var(--chip-fg); box-shadow:0 0 0 1px var(--yellow-ring);
    font:600 10px/16px 'Geist', ui-sans-serif, sans-serif; text-align:center; }
  .nav-list a .meta .nb.dot { width:6px; height:6px; margin:0 5px; border-radius:50%;
    background:var(--fainter); }
  .nav-list a.on .meta .nb.dot { background:var(--muted); }
  /* ---------- files / inbox ----------
     One choice, two states, so it is drawn as one control: a recessed track with the chosen half
     raised onto the page's own ground. GD's segmented switch, at the panel's scale. */
  .nav-tabs { display:flex; gap:2px; margin:0 5px 2px; padding:2px; border-radius:9px;
    background:var(--shell-row); }
  .nav-tabs button { flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    border:none; background:none; box-shadow:none; border-radius:7px; padding:4px 8px; color:var(--muted);
    font:500 12px 'Geist', ui-sans-serif, sans-serif; }
  .nav-tabs button:hover { color:var(--ink); transform:none; }
  .nav-tabs button[aria-selected="true"] { background:var(--bg); color:var(--ink); font-weight:600;
    box-shadow:0 1px 2px rgba(20,20,15,.06); }
  .nav-tabs .n { min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:var(--yellow);
    color:var(--chip-fg); font:600 9.5px/15px 'Geist', ui-sans-serif, sans-serif; text-align:center; }
  .nav-tabs .n:empty { display:none; }
  /* ---------- the inbox ----------
     Every open item in the folder, grouped under the document it is on. A row has to be recognisable
     without opening it, so it carries who spoke last, what kind of item it is, and the span it is
     about — the quote on its own line, because at 248px a quote sharing a line with anything is two
     words and an ellipsis. */
  .nav-inbox { display:flex; flex-direction:column; gap:2px; padding:0 8px; }
  .nav-inbox[hidden] { display:none; }
  .ib-group { margin-bottom:9px; }
  .ib-doc { display:flex; align-items:center; gap:6px; width:100%; padding:4px 9px; border:none;
    background:none; box-shadow:none; border-radius:7px; color:var(--muted); text-align:left;
    font:700 9.5px 'Geist', ui-sans-serif, sans-serif; letter-spacing:.13em; text-transform:uppercase; }
  .ib-doc:hover { background:var(--shell-row); color:var(--ink); transform:none; }
  .ib-doc .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ib-doc .n { flex:none; margin-left:auto; letter-spacing:0; font-size:10px; color:var(--faint); }
  .ib-item { display:block; width:100%; text-align:left; border:none; box-shadow:none;
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 9px 7px;
    margin-top:2px; color:var(--fg); font:400 12.5px/1.45 'Geist', ui-sans-serif, sans-serif; }
  .ib-item:hover { border-color:var(--line-strong); transform:none; }
  /* Your turn reads as the agent's yellow, same as the badge and the same as a card's chip. Everything
     else stays on the page's ground: open, and not yours to move.
     `ib-turn` rather than a bare `turn`, which the header's open/orphaned cluster already owns as a
     FLEX row — every yellow inbox row laid its quote out beside its header until this was renamed. */
  .ib-item.ib-turn { background:var(--chip); border-color:var(--yellow-ring); }
  .ib-item .hd { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .ib-item .who { flex:none; font-weight:600; font-size:11.5px; color:var(--ink); }
  .ib-item .kind { flex:none; font-size:9.5px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); }
  .ib-item .when { flex:none; margin-left:auto; font-family:'Geist Mono', ui-monospace, monospace;
    font-size:10px; color:var(--faint); }
  /* Two lines of the quote and then a cut: enough to recognise the sentence, never enough for one
     item to own the panel. */
  .ib-item .q { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    color:var(--muted); font-size:12px; line-height:1.4; }
  .ib-empty { padding:14px 10px; margin:0 8px; color:var(--muted); font-size:12.5px; line-height:1.55; }
  .ib-empty b { display:block; color:var(--ink); font-weight:600; margin-bottom:3px; }
  /* the handle between the panel and the document — the rail's grip mirrored, same 11px of grab area
     straddling the hairline, same reason it is placed over the boundary rather than given a track.
     Fixed now, because the boundary it straddles belongs to the window rather than to main. */
  #navGrip { position:fixed; top:0; bottom:0; left:calc(var(--nav-track) - 6px); width:11px; z-index:33;
    cursor:col-resize; touch-action:none; }
  #navGrip::after { content:''; position:absolute; top:0; bottom:0; right:5px; width:1px;
    background:var(--ink); opacity:0; transition:opacity .15s ease; }
  #navGrip:hover::after, #navGrip:focus-visible::after, body.nav-dragging #navGrip::after { opacity:.3; }
  #navGrip:focus { outline:none; }
  /* The panel's own control lives in its header, so the page header carries one only where the panel
     is a drawer and its header is off screen with it. */
  #navToggle, #navExpand { display:none; }
  /* Collapsed is an icon strip and only ever a DESKTOP state: down at the drawer breakpoint the panel
     is a fixed overlay with no track to shrink, so these rules are scoped rather than undone one by
     one below — the rail learned that lesson the expensive way. */
  @media (min-width: 781px) {
    /* 48px, GD's icon rail exactly (3rem). The brand row SURVIVES the collapse — its wordmark goes and
       its trigger stays, centred — so the way back out is at the top of the strip, where an IDE's
       activity bar puts it, and the rule under it still lines up with the header's. */
    body.nav-collapsed { --nav-track:48px; }
    body.nav-collapsed #navGrip, body.nav-collapsed .nav-nav { display:none; }
    body.nav-collapsed .nav-brand { padding:0; justify-content:center; }
    body.nav-collapsed .nav-brand .home { display:none; }
    body.nav-collapsed #navCollapse { display:none; }
    body.nav-collapsed #navExpand { display:flex; margin-left:0; }
    body.nav-collapsed .nav-list { padding:8px 0 0; align-items:center; gap:2px; }
    /* Each document keeps its click target, as its initial. A strip of blank squares would be a
       decoration; this one still switches documents, and the title carries the name. */
    body.nav-collapsed .nav-list a { position:relative; justify-content:center; width:32px; height:32px; padding:0; gap:0; }
    body.nav-collapsed .nav-list a .nm, body.nav-collapsed .nav-list a .ic { display:none; }
    body.nav-collapsed .nav-list a .ini { display:block; font-size:12.5px; text-transform:uppercase; }
    body.nav-collapsed .nav-empty { display:none; }
    /* The badge SURVIVES the collapse, as a corner dot. Minimizing the folder is a request for less
       chrome, not a request to stop being told which document is waiting on you — and a strip that
       hides that is a strip you have to expand to check, every time. The number goes (nothing legible
       fits on a 32px square) and the colour stays, which is the half that carries the meaning. */
    body.nav-collapsed .nav-list a .meta { position:absolute; top:1px; right:1px; margin:0; gap:0; }
    body.nav-collapsed .nav-list a .meta .ago { display:none; }
    body.nav-collapsed .nav-list a .meta .nb.turn { min-width:0; width:7px; height:7px; padding:0;
      font-size:0; box-shadow:0 0 0 1.5px var(--shell); }
    body.nav-collapsed .nav-list a .meta .nb.dot { width:5px; height:5px; margin:1px; }
    /* A strip has no room for the inbox, and no tabs to switch back with (they live in .nav-nav, which
       the collapse removes). So the strip is always the documents, whatever view the panel was left on;
       expanding restores it. */
    body.nav-collapsed #navInbox { display:none; }
    body.nav-collapsed #navList { display:flex; }
  }
  /* The document itself is the editor: edit rich text in place, no mode switch, no chrome. */
  /* pwd — the document's path, and the content header's title. It sits IN the header now rather than
     floating above the prose, which is what the shell asks for: the panel says which folder, the
     header says which document. The FOLDERS are what give way when the row is tight, the filename
     never — a path ellipsised from the right hides the one word that names what is open. */
  #pwd { display:flex; align-items:baseline; min-width:0; flex:0 1 auto;
    font-family:'Geist Mono', ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; letter-spacing:0; }
  #pwd .dir { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--faint); }
  #pwd .file { flex:none; color:var(--ink); font-weight:600; }
  #pwd:empty { display:none; }
  /* The document's own measure, and the only place a measure is now capped. 908px is 820 of text
     between 44px margins, which is exactly what the shell's old 1280 cap left the document once the
     rail had taken its 372 — so prose is the width it has always been, and the space beyond it is the
     rail's to take rather than a gutter. Centred in its column, because once the rail has stopped
     growing the slack is symmetric margin around the text and never a band on one side of it. */
  #doc { max-width:908px; margin:0 auto; padding:30px 44px 40vh; min-width:0; outline:none;
    caret-color:var(--ink); color:var(--fg); }
  /* An ASSET is not prose and has no reason to inherit the measure. A 1600px artboard read inside 820
     of text column is read at half size, and half of a design is a different design — the type is
     unreadable and the spacing is a guess. So the cap comes off, and the column the two panels leave
     is the asset's to fill.
     The cap is lifted on the element that CARRIES it rather than the asset breaking out of it. A
     breakout wrapper would have to reconstruct the column width it is escaping (negative margins
     against a track that two independently draggable panels move, plus a breakpoint where both
     become overlays), and #doc already is that column — there is nothing to escape, only a measure
     that prose asked for and a picture did not. The gutter narrows with it: the frame draws its own
     edge, so the 44px reading margin is 40px of scale spent on nothing. */
  #doc.asset { max-width:none; padding-left:24px; padding-right:24px; }
  #doc:focus, #doc *:focus { outline:none; }
  #doc h1 { font-size:31px; font-weight:600; letter-spacing:-.03em; color:var(--ink); margin:.2em 0 .55em; }
  #doc h2 { font-size:20px; font-weight:600; letter-spacing:-.02em; color:var(--ink);
    border-bottom:1px solid var(--line); padding-bottom:7px; margin:1.1em 0 .4em; }
  #doc h3 { font-size:16px; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  #doc p, #doc li { line-height:1.62; }
  #doc pre { background:var(--fill); padding:12px 16px; border-radius:10px; overflow-x:auto;
    font:13px/1.55 'Geist Mono', ui-monospace, Menlo, monospace; }
  #doc code { background:var(--fill); padding:1px 5px; border-radius:4px; font-size:.9em;
    font-family:'Geist Mono', ui-monospace, Menlo, monospace; }
  #doc pre code { padding:0; background:none; }
  #doc img { max-width:100%; height:auto; }
  /* ---------- atomic blocks: a rendered diagram or a raw-HTML island ----------
     These are contenteditable=false (set in renderDoc, not in the markup — DOMPurify strips the
     attribute). They can't be typed into, so turndown never gets the chance to flatten an SVG back
     into its bare label text, which is what it does to any HTML it doesn't understand. */
  #doc .block[data-atomic] { position:relative; margin:22px 0; }
  #doc .block[data-atomic]:focus-within, #doc .block[data-atomic]:focus { outline:none; }
  /* A diagram is only worth drawing at a size its labels can be read at. `max-width:100%` alone
     shrank a six-node flow to fit a phone and produced 5px text — the picture was there and said
     nothing, which Alex hit reading a brief on his phone. So the SVG keeps a MIN-WIDTH (set in
     renderAtomic from its own intrinsic width and the smallest label size still worth reading) and
     this box scrolls sideways when the two conflict. min-width beats max-width in CSS, which is the
     whole mechanism: a diagram that fits legibly still shrinks to the column, and one that cannot
     stops shrinking and starts scrolling. */
  .fl-scroll { overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch; }
  .fl { display:block; max-width:100%; height:auto; margin:0 auto; }
  .fl-box { fill:#fff; stroke:var(--line-strong); stroke-width:1.25; }
  .fl-label { font:13px/1 'Geist', ui-sans-serif, system-ui, sans-serif; fill:var(--ink); text-anchor:middle; }
  .fl-edge { stroke:var(--line-2); stroke-width:1.5; fill:none; }
  .fl-head { fill:var(--line-2); }
  .fl-elabel { font:11px/1 'Geist', ui-sans-serif, system-ui, sans-serif; fill:var(--muted); text-anchor:middle; }
  .fl-elabel-bg { fill:var(--bg); }
  /* a node is the click target — the affordance has to be visible before the click, or nobody finds it */
  .fl-node { cursor:pointer; }
  .fl-node:hover .fl-box, .fl-node:focus .fl-box { stroke:var(--ink); fill:var(--fill); }
  .fl-node:focus { outline:none; }
  /* an open comment on a node: the same yellow that marks the agent's anchors in prose */
  .fl-node.anchored .fl-box { stroke:var(--yellow-ring); stroke-width:2; }
  /* the flash on jump. `box-shadow` does nothing inside SVG, so this is the fill instead */
  .fl-node.flash .fl-box { fill:rgba(255,235,0,.32); stroke:var(--yellow-ring); stroke-width:2.5; }
  .fl-errors { margin-top:8px; text-align:center; font:12px/1.5 'Geist Mono', ui-monospace, Menlo, monospace;
    color:var(--muted); }
  /* the one thing that tells you the boxes are live; hidden on touch, where hover doesn't exist */
  .fl-hint { position:absolute; right:0; top:-18px; font-size:11px; color:var(--faint);
    opacity:0; transition:opacity .15s; pointer-events:none; }
  #doc .block[data-atomic]:hover .fl-hint { opacity:1; }
  @media (hover:none) { .fl-hint { display:none; } }
  /* ---------- the asset frame ----------
     An .html asset renders in a sandboxed iframe at its NATURAL size, scaled down to the document
     column with a transform (see sizeFrame). The wrapper carries the scaled height, because a
     transform does not change layout size and the page would otherwise scroll to the unscaled one. */
  #doc .asset-wrap { position:relative; margin:10px 0 0; }
  /* At 100% nothing is scaling the canvas any more, so a design wider than the column overflows for
     real. The WRAPPER takes that scroll, never the page: a body scrolling sideways moves the header,
     the rail and every docked card with it. `overscroll-behavior-x` keeps a trackpad swipe that runs
     out of asset from becoming the browser's back gesture. */
  #doc .asset-wrap.zoomed { overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch; }
  #doc iframe.asset-frame { display:block; border:0; transform-origin:top left; background:#fff;
    border-radius:12px; box-shadow:var(--shadow); }
  /* the document column's read-only tell, beside the filename in the header */
  .kindtag { font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted); background:var(--fill); border-radius:6px; padding:3px 8px; white-space:nowrap; }
  .kindtag:empty { display:none; }
  /* The asset's zoom. A segmented pair, same shape as the panel's view tabs, because it is the same
     kind of choice: two states and only one can be true. It sits inside .htitle so the title group's
     cap bounds it too — outside, a fixed-width control after a capped group runs under the centred
     presence readout, which is the collision that cap exists to prevent. flex:none, so the path
     ellipsises around it the way it already does around the kind tag. */
  .zoomctl { display:flex; flex:none; gap:2px; padding:2px; border-radius:8px; background:var(--fill); }
  .zoomctl[hidden] { display:none; }
  .zoomctl button { border:none; background:none; box-shadow:none; border-radius:6px;
    padding:3px 8px; color:var(--muted); font:600 10.5px 'Geist', ui-sans-serif, sans-serif;
    letter-spacing:.03em; }
  .zoomctl button:hover { color:var(--ink); background:none; transform:none; }
  .zoomctl button[aria-pressed="true"] { background:var(--bg); color:var(--ink);
    box-shadow:0 1px 2px rgba(20,20,15,.06); }
  #doc table { border-collapse:collapse; } #doc td, #doc th { border:1px solid var(--line-2); padding:6px 11px; font-size:14px; }
  /* a document blockquote is CONTENT, not the agent — keep it monochrome (yellow is reserved) */
  #doc blockquote { border-left:2px solid var(--line-2); margin-left:0; padding-left:14px; color:var(--muted); }
  /* an in-doc hyperlink is distinct from an agent anchor (2px yellow underline) — ink, quiet underline */
  #doc a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--line-strong);
    text-underline-offset:2px; }
  #doc a:hover { text-decoration-color:var(--ink); }
  /* An outbound link opens only while Cmd/Ctrl is held (a plain click has to place the caret in a
     contenteditable), so show the pointer exactly then — same convention as an editor's ctrl+click. */
  #doc.mod a[href] { cursor:pointer; text-decoration-color:var(--accent, var(--ink)); }
  /* A link to another document in this root is the exception: a plain click opens it in place, so it
     points like a link at all times. Every other link keeps the caret the rest of the surface has. */
  #doc a.xdoc { cursor:pointer; }
  .block { position:relative; }
  .block > :first-child { margin-top:.4em; } .block > :last-child { margin-bottom:.4em; }
  /* persistent cue: an open item softly underlines its span in the agent's yellow, tappable */
  mark.anchor { background:transparent; border-bottom:2px solid var(--yellow); padding:0 1px; cursor:pointer;
    transition:background .15s ease; border-radius:1px; }
  mark.anchor.flash { background:rgba(255,235,0,.32); box-shadow:0 0 0 3px rgba(255,235,0,.3); }
  /* The rail scrolls WITH the page rather than in its own scroll box. That's what lets a card sit level
     with the text it's about (see dockCards): two independent scrollers can't stay aligned without a
     scroll handler, and one shared scroll context needs none. The mobile sheet below re-adds its own
     height + overflow, since there it really is a separate scrolling surface. */
  aside { border-left:1px solid var(--line); padding:22px 20px; display:flex; flex-direction:column; gap:0;
    background:var(--bg); }
  /* review-rail tabs: active threads ↔ archived threads. Sticky to the PAGE now (under the 52px header),
     so the tabs and their counts stay reachable however far down the document you are.
     The padding is an OPAQUE buffer (no transparent margin/gap) so scrolling cards can't crowd under it. */
  .tabs { position:sticky; top:52px; z-index:2; display:flex; gap:2px; margin:0 -2px;
    padding:10px 2px 14px; background:var(--bg); }
  .tab { font:600 13px 'Geist', ui-sans-serif, sans-serif; border:none; background:none; color:var(--muted);
    padding:7px 11px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; box-shadow:none; }
  .tab:hover { background:var(--fill); color:var(--fg); }
  .tab.on { color:var(--ink); background:var(--fill); }
  .tab .tc { font-size:11px; font-weight:600; background:#eeeee8; color:#57574f; border-radius:20px;
    padding:0 6px; min-width:17px; text-align:center; }
  .tab.on .tc { background:#e4e4dc; }
  .side-list { display:flex; flex-direction:column; gap:8px; }
  /* ---------- the full-height rail (desktop) ----------
     The rail is the frame's right column now, the folder panel mirrored: it runs the full height of
     the window and the header spans only the band between the two panels. The aside STAYS a grid
     item — its content still sizes main, and the one shared scroll context is what lets dockCards
     hold a card level with its anchor — the negative margin just extends it up over the 52px the
     header no longer covers. The header's inset follows --rail-w the same way the body's follows
     --nav-track, so a drag on the grip moves both edges together. */
  @media (min-width: 781px) {
    body:not(.no-nav):not(.rail-collapsed) header { margin-right:var(--rail-w); }
    aside { margin-top:-52px; padding:0 20px 28px; }
    #railGrip { top:-52px; }
    /* The tabs are the rail's brand row now: 52px including the rule, full bleed past the aside's
       padding, sticky at the top of the WINDOW — so the folder's brand row, the header and this row
       put their three hairlines on the same pixel line across the application. */
    .tabs { top:0; height:52px; align-items:center; margin:0 -20px; padding:0 14px;
      border-bottom:1px solid var(--line); }
    .side-list { margin-top:16px; }
  }
  /* Docked layout (desktop, active tab): each card is absolutely placed level with its anchor by
     dockCards(), which also sets the list's height so the page can scroll to the last one. Cards keep
     left/right 0 so they still span the rail's width and measure the same height they did in flow. */
  .side-list.docked { display:block; position:relative; }
  .side-list.docked .card { position:absolute; left:0; right:0; }
  /* A docked card SLIDES to its new home rather than appearing in it. The move that matters is the
     one an agent causes: it rewrites the anchored sentence, the anchor stops matching, and a few
     seconds later `sidecar reanchor` points the card at the new text. Two jumps with a pause between
     them read as a glitch; one glide reads as the document settling. renderSide rebuilds every card
     via innerHTML, so a fresh element has no `top` to move FROM — dockCards seeds it with the position
     the card held before the rebuild, which is what gives this rule something to animate. */
  .side-list.docked .card { transition:box-shadow .2s ease, background .2s ease, top .22s ease; }
  /* A card being typed into is pinned where it is; if a neighbour above grows past it, it stays
     readable rather than being painted under. */
  .side-list.docked .card.pinned { z-index:1; }
  @media (prefers-reduced-motion: reduce) {
    .side-list.docked .card { transition:box-shadow .2s ease, background .2s ease; }
  }
  /* A tall card would shove every later card far below its own anchor, so unfocused cards are clipped to
     a cap (set inline by dockCards) and carry a fade + toggle. This is what keeps the column honest.
     Only .cbody clips: resolve / reply / send sit OUTSIDE it and stay reachable without expanding. */
  .card .cbody { position:relative; }
  .side-list.docked .card.clipped .cbody { overflow:hidden; }
  .side-list.docked .card.clipped .cbody::after { content:''; position:absolute; left:0; right:0; bottom:0;
    height:44px; pointer-events:none; background:linear-gradient(to bottom, rgba(255,255,255,0), var(--bg)); }
  .side-list .card .more { display:none; }
  .side-list.docked .card.has-more .more { display:block; width:100%; text-align:center; margin:7px 0 0;
    padding:2px 0; border:0; background:none; box-shadow:none; cursor:pointer;
    font:600 12px 'Geist', ui-sans-serif, sans-serif; color:var(--muted); }
  .side-list.docked .card.has-more .more:hover { color:var(--ink); background:none; }
  /* review card — no border; a soft depth shadow lifts it off the rail */
  .card { background:var(--bg); border-radius:14px; padding:15px 16px; font-size:13px; box-shadow:var(--shadow);
    transition:box-shadow .2s ease, background .2s ease; }
  .card.flash { box-shadow:var(--shadow), 0 0 0 3px rgba(255,235,0,.55); }
  /* A decided card leaves toward the document it was anchored to, which is where the change just
     landed. Short, because the list rebuild is waiting on it. */
  .card.leaving { opacity:0; transform:translateX(-10px); transition:opacity .18s ease-out, transform .18s ease-out; }
  /* A newly arrived card fades up rather than appearing mid-list. Marked by renderSide, which knows
     which ids it had not rendered before. */
  @keyframes cardIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .card.entering { animation:cardIn .22s ease-out; }
  /* orphaned: the anchor text is gone — greyed surface, muted identity. The background transition on
     .card above carries this, so an item going orphaned under you fades rather than blinks. */
  .card.orphaned { background:#fafaf8; }
  /* identity — the agent is a yellow chip (its color); the human is an ink dot + name. Classed
     .agent / .human, not by literal name, so any SIDECAR_USER / SIDECAR_AGENT colors correctly. */
  .card .who { font-weight:600; display:inline-flex; align-items:center; }
  .who.agent { gap:5px; font-size:12px; color:var(--chip-fg); background:var(--chip);
    border-radius:6px; padding:2px 8px; }
  .who.agent::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--yellow);
    box-shadow:0 0 0 1px var(--yellow-ring); }
  .who.human { gap:6px; font-size:13px; color:var(--ink); }
  .who.human::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--ink); }
  .card.orphaned .who.agent { color:#57574f; background:#f2f2ee; }
  .card.orphaned .who.agent::before { background:#c2c2ba; box-shadow:none; }
  /* kind label — quiet uppercase text, not a bordered badge */
  .card .badge { font-size:10.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    color:var(--muted); margin-left:8px; }
  .card .badge.suggestion { color:var(--muted); }
  /* flag = "look here" from you — monochrome chip (yellow is the agent's, never yours) */
  .card .badge.flag { background:#f4f4f1; color:#57574f; border-radius:20px; padding:2px 9px;
    margin-left:8px; letter-spacing:.02em; }
  .card .badge.orphaned { color:var(--muted); }
  /* final-status chips on archived cards — monochrome, quiet */
  .card .badge.accepted, .card .badge.rejected, .card .badge.resolved {
    background:#f4f4f1; color:#57574f; border-radius:20px; padding:2px 9px; letter-spacing:.02em; }
  /* archived card — settled, recessed; a flex header so the decided-time sits at the right */
  .card.archived { background:#fafaf8; }
  .card.archived .quote { cursor:default; }
  .card .chead { display:flex; align-items:center; }
  /* the anchored span the card refers to — a yellow left-rule (the agent's), quiet quoted text */
  .card .quote { color:var(--muted); font-size:12.5px; border-left:2px solid var(--yellow); padding-left:10px;
    margin:9px 0; line-height:1.4; cursor:pointer; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card.orphaned .quote { border-left-color:var(--line-2); color:var(--faint); text-decoration:line-through; }
  .card .when { font-size:11px; color:var(--fainter); margin-left:auto; }
  /* thread messages — bold name (no chip, no dot; the header carries identity) + body */
  /* A thread message is a block with its own tint, so who said what is legible at a glance instead of
     depending on reading the name. The tints are the identity colors already in use elsewhere: the
     agent's yellow chip, the human's neutral well. Left border carries it when tints get subtle. */
  .msg { margin:8px 0; padding:7px 10px; border-radius:9px; font-size:13px; line-height:1.5;
    color:var(--fg); background:var(--fill); }
  .msg.by-agent { background:var(--chip); }
  .msg .who { background:none; padding:0; color:inherit; font-size:12px; display:block; margin-bottom:2px; }
  /* The dot comes back in-thread — it is the fastest identity read, and hiding it was why replies all
     looked alike. Inline-flex on the name row keeps it aligned with the text. */
  .msg .who::before { display:inline-block; vertical-align:middle; margin-right:5px; }
  .msg .who.agent { color:var(--chip-fg); }
  .msg .who.human { color:var(--ink); }
  .msg .t { color:var(--fg); }
  /* A message body is rendered markdown (proseHtml). One-paragraph bodies come back inline and sit on
     the author's line; anything structured brings real blocks, styled tight so a card stays scannable. */
  .msg .t > :first-child { margin-top:0; }
  .msg .t > :last-child { margin-bottom:0; }
  .msg .t p { margin:0 0 8px; }
  .msg .t ul, .msg .t ol { margin:6px 0; padding-left:19px; }
  .msg .t li { margin:3px 0; }
  .msg .t li > p { margin:0; }
  .msg .t h1, .msg .t h2, .msg .t h3, .msg .t h4 {
    font-size:13px; font-weight:650; color:var(--ink); margin:11px 0 4px; letter-spacing:0; }
  .msg .t code { font:12px 'Geist Mono', ui-monospace, Menlo, monospace;
    background:var(--fill); border-radius:4px; padding:1px 4px; word-break:break-word; }
  .msg .t pre { background:var(--fill); border-radius:9px; padding:9px 11px; margin:8px 0; overflow-x:auto; }
  .msg .t pre code { background:none; padding:0; }
  .msg .t blockquote { margin:8px 0; padding-left:10px; border-left:2px solid var(--line-2); color:var(--muted); }
  .msg .t a { color:var(--ink); text-decoration:underline; text-underline-offset:2px; }
  .msg .t hr { border:0; border-top:1px solid var(--line); margin:11px 0; }
  .msg .t table { border-collapse:collapse; margin:8px 0; font-size:12.5px; display:block; overflow-x:auto; }
  .msg .t th, .msg .t td { border:1px solid var(--line-2); padding:4px 7px; text-align:left; }
  /* An attached screenshot in a 300px rail is unreadable at rail width — it's a thumbnail that
     opens. zoom-in says so before the click does. */
  .msg .t img { max-width:100%; height:auto; border-radius:6px; display:block; margin:7px 0;
    border:1px solid var(--line-2); cursor:zoom-in; background:var(--fill); }
  /* full-size view of an attached image — click anywhere or Esc to dismiss */
  #lightbox { position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:24px;
    background:rgba(20,20,18,.82); cursor:zoom-out; }
  #lightbox.on { display:grid; }
  #lightbox img { max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  /* word-level diff — mono well; deletions strike out muted, insertions carry the agent's yellow */
  .diffbox { font:12.5px/1.6 'Geist Mono', ui-monospace, Menlo, monospace; background:var(--fill); border-radius:10px;
    padding:10px 12px; margin:9px 0; white-space:pre-wrap; word-break:break-word; color:#57574f; }
  .diffbox del { color:var(--faint); text-decoration:line-through; }
  .diffbox ins { background:var(--yellow); color:var(--chip-fg); text-decoration:none; border-radius:3px; padding:0 2px; }
  .row { display:flex; gap:8px; margin-top:11px; align-items:center; }
  .row.spread { justify-content:space-between; }
  .row .spacer { flex:1; }
  /* a compose box under a dragged image — the only cue that dropping here will do something */
  .dropping { border-color:var(--ink-btn) !important; box-shadow:var(--ring); }
  .reply { width:100%; font:inherit; font-size:13px; border:1px solid var(--line-2); border-radius:9px;
    padding:8px 11px; background:var(--bg); color:var(--fg); resize:none; overflow:hidden; line-height:1.45;
    min-height:36px; max-height:40vh; overflow-y:auto; }
  .reply::placeholder { color:var(--faint); }
  .reply:focus { outline:none; border-color:var(--ink-btn); box-shadow:var(--ring); }
  /* floating selection toolbar — a soft light card; hover fills grey (your actions stay monochrome) */
  #seltool { position:absolute; display:none; z-index:30; background:var(--bg); border:1px solid var(--line-2);
    border-radius:10px; box-shadow:var(--shadow); padding:4px; align-items:center; gap:1px;
    flex-wrap:wrap; max-width:calc(100vw - 16px); }
  #seltool button { background:none; border:none; box-shadow:none; color:var(--fg); padding:6px 11px;
    border-radius:7px; font-size:13px; font-weight:600; line-height:1; }
  #seltool button:hover { background:var(--fill); color:var(--ink); }
  /* text-style dropdown — a single control replacing the ¶/h1/h2/h3 row */
  #seltool .fmt { position:relative; display:inline-flex; }
  #seltool .fmt-btn { display:inline-flex; align-items:center; gap:3px; }
  #seltool .fmt-btn .car { font-size:9px; opacity:.55; }
  #seltool .fmt-menu { position:absolute; top:calc(100% + 5px); left:0; z-index:1;
    background:var(--bg); border:1px solid var(--line-2); border-radius:10px; box-shadow:var(--shadow);
    padding:4px; display:flex; flex-direction:column; gap:1px; min-width:132px; }
  #seltool .fmt-menu[hidden] { display:none; }
  #seltool .fmt-menu button { display:block; width:100%; text-align:left; white-space:nowrap; }
  #seltool b { font-weight:800; } #seltool i { font-style:italic; font-family:Georgia,serif; }
  #seltool .tsep { width:1px; height:16px; background:var(--line-2); margin:0 3px; }
  #seltool input { background:var(--bg); border:1px solid var(--line-2); color:var(--fg); border-radius:7px;
    font:inherit; font-size:13px; padding:6px 10px; width:230px; outline:none; }
  #seltool input:focus { border-color:var(--ink-btn); box-shadow:var(--ring); }
  #popover { position:absolute; display:none; z-index:31; background:var(--bg); border:1px solid var(--line-2);
    border-radius:12px; box-shadow:var(--shadow); padding:13px; width:300px; }
  /* drag handle — grab this to move the comment box off the text you're commenting on */
  #popover .po-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin:-13px -13px 11px; padding:8px 13px; border-bottom:1px solid var(--line);
    border-radius:12px 12px 0 0; cursor:grab; user-select:none; touch-action:none; }
  #popover .po-head:active { cursor:grabbing; }
  #popover .po-title { font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  #popover .po-grip { color:var(--faint); font-size:13px; line-height:1; letter-spacing:1.5px; }
  #popover textarea { width:100%; min-height:66px; max-height:40vh; overflow-y:auto; font:inherit; font-size:13px;
    border:1px solid var(--line-2); border-radius:9px; padding:8px 10px; resize:vertical; outline:none;
    background:var(--bg); color:var(--fg); }
  #popover textarea::placeholder { color:var(--faint); }
  #popover textarea:focus { border-color:var(--ink-btn); box-shadow:var(--ring); }
  #popover .row { justify-content:flex-end; }
  /* toast — the one dark surface; light action buttons (your decisions stay monochrome) */
  /* Enters and leaves by the same edge it lives on. `display` can't transition, so visibility carries
     the hiding and the transform/opacity carry the motion — translateX(-50%) has to stay inside every
     transform or the centering snaps. */
  #banner { visibility:hidden; position:fixed; bottom:18px; left:50%; background:var(--dark);
    color:#faf9f4; padding:13px 18px; border-radius:12px; z-index:40; font-size:13.5px;
    box-shadow:0 1px 2px rgba(0,0,0,.2), 0 18px 40px -18px rgba(0,0,0,.5);
    opacity:0; transform:translate(-50%, 12px);
    transition:opacity .2s ease-out, transform .2s ease-out, visibility 0s linear .2s; }
  #banner.open { visibility:visible; opacity:1; transform:translate(-50%, 0);
    transition:opacity .2s ease-out, transform .2s ease-out, visibility 0s; }
  #banner button { margin-left:10px; background:#fff; color:var(--ink); border:none; font-size:12.5px; padding:6px 12px; }
  #banner button:hover { background:#f0f0ea; }
  /* quiet docs link — a text link, never a CTA. It sits in the folder panel's foot now: app-level
     chrome belongs to the frame, and the header carries only the open document's things. */
  .doclink { color:var(--muted); font-size:13px; font-weight:500; text-decoration:none;
    border-bottom:1.5px solid transparent; }
  .doclink:hover { color:var(--fg); }
  /* Pinned to the panel's foot by the auto margin when the list is short; a long folder scrolls it,
     which is where a footer belongs in a scrolling column. Gone with the icon strip — 48px fits
     nothing legible — and gone with the panel itself on the picker screen. */
  .nav-docs { margin:auto 20px 0; padding-top:16px; align-self:flex-start; }
  body.nav-collapsed .nav-docs { display:none; }
  /* right cluster: the orphaned count — the one header number that is actionable (click cycles the
     orphans) and shown nowhere else. The open count lives on the rail's active tab, always visible
     now, so the header repeating it was two counters for one fact. */
  .turn { font-size:12.5px; color:var(--faint); display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .turn:empty { display:none; }
  .turn .orphan { color:var(--fg); border-bottom:1.5px solid var(--yellow); cursor:pointer; }
  /* center of the navbar: the shared "are we in the room together?" readout — here ↔ waiting. The
     header spans only the document column now, so the centre it takes is the centre of the PROSE. */
  .presence { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none;
    display:flex; align-items:center; gap:6px; font-size:12.5px; white-space:nowrap; }
  .presence .dot { width:7px; height:7px; border-radius:50%; flex:none; }
  .presence.here { color:#6b6b64; font-weight:500; }
  .presence.here .dot { background:var(--yellow); box-shadow:0 0 0 1px var(--yellow-ring); }
  .presence.away { color:var(--muted); font-weight:500; }
  .presence.away .dot { background:transparent; border:1.5px solid var(--line-strong); }
  .presence.sent { color:var(--muted); font-weight:500; }            /* review handed off — a settled, filled dot */
  .presence.sent .dot { background:var(--muted); box-shadow:none; }
  @keyframes presPulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  .presence.working .dot { animation:presPulse 1.4s ease-in-out infinite; }
  /* Per-thread presence: the card the agent is answering right now. Just the label, plain body
     text with a shimmer sweeping through it — no chip, no dot, no spinner. The motion IS the
     signal. Appears when the agent's wait exit names the thread, clears when the reply lands
     (or goes stale). */
  /* padding-left matches .msg's 10px horizontal padding, so the label lines up with the message
     TEXT in the bubbles above it, not with the card's content edge */
  .replying { display:flex; align-items:center; margin-top:8px; padding-left:10px; }
  .replying .lbl { font-size:12.5px; font-weight:500; color:transparent;
    background:linear-gradient(90deg, var(--muted) 35%, var(--fg) 50%, var(--muted) 65%);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text;
    animation:shimmerText 1.4s linear infinite; }
  @keyframes shimmerText { from { background-position:200% 0; } to { background-position:-200% 0; } }
  /* Reduced motion: cut the movement, keep the meaning. The toast still fades so it doesn't teleport,
     the sheet still slides (a sheet that jump-cuts loses where it came from), and the presence dot
     holds a steady dim instead of breathing — the "working" state is still legible, just not moving. */
  @media (prefers-reduced-motion: reduce) {
    #banner { transition:opacity .15s ease-out, visibility 0s linear .15s; transform:translate(-50%, 0); }
    #banner.open { transition:opacity .15s ease-out, visibility 0s; transform:translate(-50%, 0); }
    .presence.working .dot { animation:none; opacity:.6; }
    /* the label drops the shimmer for static muted text — still legible, just not moving */
    .replying .lbl { animation:none; background:none; color:var(--muted); }
    /* Cards: no travel. The JS also skips the exit wait entirely, so a decision stays instant. */
    .card.leaving { transform:none; transition:opacity .12s ease-out; }
    .card.entering { animation:none; }
    button:active, button:hover { transform:none; }
  }
  /* docs is a LINK (leaves the page) — mark it as one so it reads differently from status + actions */
  .doclink::after { content:'\2197'; font-size:.82em; margin-left:2px; opacity:.6; }
  /* "done reviewing" is a review ACTION → it lives at the foot of the review column, not the nav bar. */
  .done-foot { display:block; width:100%; margin-top:8px; padding:14px 0 4px; text-align:center;
    font-size:12.5px; font-weight:500; color:var(--muted); background:none; border:none; box-shadow:none;
    border-top:1px solid var(--line); border-radius:0; }
  .done-foot:hover { color:var(--fg); background:none; }
  /* a suggestion nested inside the comment thread it answers (replyTo) — a quiet recessed panel */
  .subcard { margin:10px 0 5px; padding:12px 13px; border:1px solid var(--line-2);
    border-radius:12px; background:var(--fill); }
  .subcard .who { font-weight:600; }
  #filelist { padding:48px 40px; max-width:760px; margin:0 auto; }
  #filelist .h { font-size:22px; font-weight:600; letter-spacing:-.02em; color:var(--ink); margin:0 0 4px; }
  #filelist .sub { font-size:13.5px; color:var(--muted); margin:0 0 26px; }
  #filelist .sub code { font-family:'Geist Mono', ui-monospace, monospace; font-size:12.5px; color:#57574f; }
  #filelist a { display:flex; align-items:center; gap:12px; padding:14px 12px; border-bottom:1px solid var(--line);
    text-decoration:none; color:var(--ink); border-radius:9px; }
  #filelist a:hover { background:var(--fill); }
  #filelist a .nm { font-size:14.5px; font-weight:500; }
  #filelist a .ext { font-family:'Geist Mono', ui-monospace, monospace; font-size:11px; color:var(--fainter); }
  #filelist a .sp { flex:1; }
  #filelist a .ago { font-size:11.5px; color:var(--faint); font-family:'Geist Mono', ui-monospace, monospace;
    white-space:nowrap; }
  #filelist a .none { font-size:12px; color:#c2c2ba; min-width:20px; text-align:center; }
  /* open-count pill — grey chip carrying a single yellow dot (the agent has notes waiting) */
  .count { display:inline-flex; align-items:center; gap:6px; background:#f6f6f2; color:#57574f;
    border-radius:20px; font-size:12px; padding:3px 10px; font-weight:600; }
  .count::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--yellow);
    box-shadow:0 0 0 1px var(--yellow-ring); }
  .empty { color:var(--muted); font-size:13px; text-align:center; padding:40px 0; line-height:1.55; }

  /* --- mobile: single-column doc, review panel becomes a pull-up bottom sheet --- */
  #sheetToggle, #sheetBackdrop, #navBackdrop { display:none; }
  @media (max-width: 780px) {
    main, body.rail-collapsed main { grid-template-columns: minmax(0,1fr); }   /* minmax(0,…) so a code block can't force overflow */
    /* The frame is a drawer down here, so nothing is inset past it. The desktop rule is scoped to the
       breakpoint rather than undone, same as the collapsed rules below it. */
    /* The rail is a fixed overlay down here, so there are no two columns to divide and nothing for a
       drag to resize: the handle is removed rather than left half-working, and hiding the panel is
       already the sheet's job, so the header toggle goes with it. A collapsed state carried down from
       a wide window must not take the sheet with it — hence the display:flex, which wins on source
       order against the same-specificity rule above. */
    #railGrip, #railToggle { display:none; }
    body.rail-collapsed aside { display:flex; }
    /* The panel is a drawer down here, for the same reason the rail is a sheet: there is one column
       and nothing to divide, so the grip goes rather than half-working. Its header button stays,
       because unlike the rail's sheet the drawer has no other way in. */
    #navGrip { display:none; }
    /* The drawer's own header is off screen with it, so opening it is the one control that has to sit
       outside: the page header, where the rail's floating pill is its equivalent. Minimizing means
       nothing down here, so the in-panel control goes. */
    #navToggle { display:block; }
    #navCollapse { display:none; }
    /* Already fixed on desktop; down here it is the same surface slid off screen and given a width of
       its own — 288px, GD's mobile sheet, capped against a small phone. */
    #nav { width:min(288px, 84vw); z-index:47;
      transform:translateX(-102%); transition:transform .26s ease-out;
      padding:0 0 calc(env(safe-area-inset-bottom) + 20px); }
    .nav-brand { height:calc(52px + env(safe-area-inset-top));   /* clear the notch */
      padding-top:env(safe-area-inset-top); }
    /* The shadow arrives with the drawer. Left on permanently it reaches back across the 2% of travel
       the closed panel keeps off screen and paints a grey seam down the edge of every document. */
    body.nav-open #nav { transform:translateX(0); box-shadow:12px 0 40px rgba(20,20,15,.18); }
    #navBackdrop { display:block; position:fixed; inset:0; background:rgba(20,20,15,.28); z-index:46;
      opacity:0; pointer-events:none; transition:opacity .26s; }
    body.nav-open #navBackdrop { opacity:1; pointer-events:auto; }
    #doc pre { max-width:100%; }
    #pwd { font-size:11.5px; }
    #doc { padding: 20px 18px 42vh; font-size: 16px; line-height:1.62; }
    #doc h1 { font-size:25px; } #doc h2 { font-size:18px; }
    /* clear the notch/status bar: pad the top by the safe-area inset so the bar isn't cramped or hidden */
    .hwrap { padding:0 12px; height:calc(51px + env(safe-area-inset-top));
      padding-top:env(safe-area-inset-top); gap:8px; }
    #status { min-width:0; }
    /* The zoom control and the kind tag are both asset-only, and at 390px the two of them together
       squeeze #pwd below its filename — which the title group exists to prevent. The tag is the wider
       and the more redundant of the two down here (a phone offers no caret to explain the absence of),
       so it drops its qualifier and the path keeps its name. */
    .kindtag .ro { display:none; }
    /* The readout is in the flow down here (see .presence below), so it pushes the title rather than
       sitting on top of it, and the desktop bound would only starve a path that is already tight. */
    .htitle { max-width:none; }
    /* the absolute-center readout collides with the cramped mobile header, so drop it into the flow
       as a compact dot-only chip beside the title — the dot's color/pulse still carries the state
       (yellow=here, outline=away, filled=sent, pulsing=working); the label is hidden to save width. */
    .presence { position:static; transform:none; gap:0; padding:5px; margin-left:-2px;
      background:var(--fill); border-radius:99px; }
    .presence .lbl { display:none; }
    #filelist { padding:28px 18px; }
    #popover { width:min(300px, calc(100vw - 24px)); }
    /* iOS Safari zooms into any focused input with font-size <16px (and won't zoom back). Pin to 16px. */
    .reply, #popover textarea, #seltool input { font-size:16px; }

    /* the sidebar, reframed as a bottom sheet */
    aside {
      /* height + overflow live here, not on the base rule: on desktop the rail scrolls with the page so
         cards can dock to their anchors, but the sheet genuinely is its own scrolling surface. */
      position:fixed; left:0; right:0; bottom:0; top:auto; height:76vh; overflow-y:auto;
      border-left:none; border-top:1px solid var(--line); border-radius:22px 22px 0 0;
      background:var(--bg); box-shadow:0 -12px 40px rgba(20,20,15,.18);
      transform:translateY(102%); transition:transform .26s ease-out; z-index:46;
      padding:22px 16px calc(env(safe-area-inset-bottom) + 20px); gap:0;
    }
    aside::before { content:''; position:absolute; top:9px; left:50%; transform:translateX(-50%);
      width:40px; height:4px; border-radius:99px; background:var(--line-strong); }
    /* Inside the sheet the tabs stick to the SHEET's scroll box, not the page, so the desktop
       under-the-header offset would push them 51px down. Back to cancelling the sheet's own padding. */
    .tabs { top:-22px; }
    body.sheet-open aside { transform:translateY(0); }

    #sheetBackdrop { display:block; position:fixed; inset:0; background:rgba(20,20,15,.28); z-index:45;
      opacity:0; pointer-events:none; transition:opacity .26s; }
    body.sheet-open #sheetBackdrop { opacity:1; pointer-events:auto; }

    /* the pull-up pill — ink surface, the open-item count in the agent's yellow */
    #sheetToggle { display:inline-flex; align-items:center; gap:8px; position:fixed;
      right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px); z-index:44;
      background:var(--ink-btn); color:#fff; border:none; box-shadow:0 8px 20px -6px rgba(20,20,15,.4);
      border-radius:99px; padding:11px 18px; font-weight:600; font-size:14px; }
    #sheetToggle .n { background:var(--yellow); color:var(--chip-fg); border-radius:99px;
      min-width:20px; text-align:center; padding:0 6px; font-size:12.5px; }
    #sheetToggle .n:empty { display:none; }
    body.sheet-open #sheetToggle { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <!-- The drawer's way in, below the 780px breakpoint only. Above it the shell owns its own control
         (see #navCollapse) and this is display:none. -->
    <button id="navToggle" class="ghost iconbtn" onclick="toggleNav()" aria-controls="nav" aria-expanded="true"
      title="Show the folder" aria-label="Show the folder"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M7.1 3.75v12.5"/></svg></button>
    <!-- The whole-tree picker has no open document, so it has no folder and no panel — and the frame's
         identity would go with it. The wordmark comes back into the header for exactly that screen. -->
    <a href="/" class="hbrand" title="all documents">
      <img class="mark" src="/mark.svg" alt="" aria-hidden="true">
      <span class="wm">sidecar</span>
    </a>
    <!-- The content area's title: which document is open, and what kind it is. The wordmark it used to
         sit beside now lives at the top of the panel, where the frame's identity belongs. -->
    <div class="htitle">
      <div id="pwd"></div>
      <div id="kind" class="kindtag"></div>
      <!-- Asset only, and painted by paintZoom. Prose has a measure rather than a zoom, so on a
           markdown document this is not there at all. -->
      <div id="zoom" class="zoomctl" role="group" aria-label="Zoom" hidden>
        <button type="button" data-zoom="fit" aria-pressed="true" title="Scale the asset into the column">fit</button>
        <button type="button" data-zoom="full" aria-pressed="false" title="Show the asset at its natural size">100%</button>
      </div>
    </div>
    <div id="presence" class="presence away"></div>
    <div class="spacer"></div>
    <div id="turn" class="turn"></div>
    <button id="railToggle" class="ghost iconbtn" onclick="toggleRail()" aria-controls="side" aria-expanded="true"
      title="Hide review panel" aria-label="Hide review panel"><svg viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M12.9 3.75v12.5"/></svg><span
      class="n" id="railCount"></span></button>
    <div id="status">saved</div>
  </div>
</header>
<main id="main">
  <!-- The folder the open document lives in. Painted by renderNav; empty until the first /api/dir. -->
  <nav id="nav" aria-label="documents in this folder">
    <!-- The panel's own chrome, sticky over its list. `.nav-head` is one sticky block on purpose:
         revealOpenDoc measures it to know how much of the scrollport is covered, and two independent
         sticky rows would have it measuring half of what is actually in the way. -->
    <div class="nav-head">
      <!-- The brand row. The wordmark, and the control that minimizes the panel, at the top of the
           frame — the way an IDE's explorer owns its own chrome. Collapsed, the wordmark goes and the
           trigger stays: the way back out sits at the top of the strip. -->
      <div class="nav-brand brand">
        <a href="/" class="home" title="all documents">
          <img class="mark" src="/mark.svg" alt="" aria-hidden="true">

        <button id="navCollapse" class="ghost iconbtn" onclick="toggleNav(false)" aria-controls="nav"
          title="Minimize the folder" aria-label="Minimize the folder"><svg viewBox="0 0 20 20" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M7.1 3.75v12.5"/>

          <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/><path d="M7.1 3.75v12.5"/>

        <!-- Two ways to read the same folder: what is IN it, and what is still open across it. A

        <div class="nav-tabs" role="tablist" aria-label="folder view">

    <!-- App-level, so it lives in the panel's foot with the rest of the frame's chrome — the header
         carries only what belongs to the open document. -->

  </nav>
  <!-- The panel's drag handle. Same contract as #railGrip: over the boundary, not a track of its own. -->

  <div>
    <div id="doc"></div>

  <!-- The drag handle, between the two columns in reading order and placed over their boundary by CSS.
       role=separator + tabindex so it is operable without a pointer (see the keydown handler). -->
  <div id="railGrip" role="separator" aria-orientation="vertical" aria-label="Resize review panel" tabindex="0"></div>

</main>
<div id="filelist" style="display:none"></div>
<div id="seltool">
  <div class="fmt">
    <button data-op="fmt-toggle" class="fmt-btn" title="Text style">¶<span class="car">▾</span></button>
    <div class="fmt-menu" hidden>
      <button data-op="p">¶&nbsp;&nbsp;text</button>
