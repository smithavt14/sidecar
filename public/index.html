<!-- One file picker for every compose box, not one per card: the "image" button records which
     textarea asked, then clicks this. accept is a hint, not a check — the server sniffs the bytes. -->
<input type="file" id="picker" accept="image/*" multiple hidden>
<!-- The asset frame, written out as markup rather than built in code so the flag set is one literal
     string a test can pin — and the test pins the WHOLE FILE, asserting the same-origin flag is spelled
     nowhere in it, which is why no comment here spells it either. `allow-scripts` and nothing else: a
     frame granted this page's origin would reach sidecar's file read/write API, and the isolation
     guarantee (docs/adr/0001-asset-frame-isolation.md) would be gone. The only script inside is the
     picker, which assetframe.js inlines after DOMPurify has stripped the asset's own. -->
<template id="assetFrameTpl"><iframe class="asset-frame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="asset preview"></iframe></template>
<div id="navBackdrop" onclick="closeNavDrawer()"></div>
<div id="sheetBackdrop" onclick="toggleSheet(false)"></div>
<button id="sheetToggle" onclick="toggleSheet()">review <span class="n" id="sheetCount"></span></button>

<script>
const qs = new URLSearchParams(location.search);
let FILE = qs.get('f');
let state = null, blocks = [], pendingSel = null;
let sideTab = 'active';   // which review-rail tab is showing: 'active' | 'archived'
let dirty = false, saveTimer = null, savedRange = null;

// HTML → markdown serializer. Escaping off so prose keeps clean markers (no `\*` noise);
// this is a personal editor, not a hostile-input renderer.
const td = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-',
  codeBlockStyle: 'fenced', emDelimiter: '_', hr: '---' });
td.escape = (s) => s;
// GFM round-trip: without these rules turndown flattens tables to loose lines, drops task-list
// checkboxes, and strips ~~strikethrough~~ — silently corrupting any such block it re-serializes.
// (tables/strike/tasklist operate on <table>/<del>/<li><input>; no overlap with the custom li rule below.)
td.use(turndownPluginGfm.gfm);
// Tight list markers ("- " / "1. ", 2-space continuation) instead of turndown's 4-space padding,
// so a one-word edit doesn't reflow every bullet in the git diff.
td.addRule('tightList', {
  filter: 'li',
  replacement: (content, node) => {
    content = content.replace(/^\n+/, '').replace(/\n+$/, '\n').replace(/\n/gm, '\n  ');
    const parent = node.parentNode;
    let prefix = '- ';
    if (parent.nodeName === 'OL') {
      const start = parent.getAttribute('start');
      const idx = Array.prototype.indexOf.call(parent.children, node);
      prefix = (start ? Number(start) + idx : idx + 1) + '. ';
    }
    return prefix + content + (node.nextSibling && !/\n$/.test(content) ? '\n' : '');
  },
});
// The serialize/reindex/toMd round-trip lives in /serialize.js (shared with the Node test suite so
// the exact save-path code is what's tested). These thin wrappers bind the page's live state — the
// configured turndown `td`, the current `blocks` model, `$('doc')`, `marked`, `state.markdown` — so
// every call site below (toMd(el), serialize(), reindex()) stays identical to when it was inline.
function toMd(node) { return Serialize.toMd(node, td); }
function serialize() { return Serialize.serialize($('doc'), blocks, td); }
function reindex() { blocks = Serialize.reindex($('doc'), blocks, state.markdown, marked, td); }

const $ = (id) => document.getElementById(id);

// Relative "last reviewed" label for the file picker (mtime of the doc or its sidecar, whichever is newer).
function timeAgo(ms) {
  if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  const m = s / 60; if (m < 60) return Math.floor(m) + 'm ago';
  const h = m / 60; if (h < 24) return Math.floor(h) + 'h ago';
  const d = h / 24; if (d < 7) return Math.floor(d) + 'd ago';
  const w = d / 7; if (w < 5) return Math.floor(w) + 'w ago';
  const mo = d / 30; if (mo < 12) return Math.floor(mo) + 'mo ago';
  return Math.floor(d / 365) + 'y ago';
}

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
}

// ---------- boot ----------
async function boot() {
  if (!FILE) {
    const { files, defaultFile } = await api('GET', '/api/files');
    if (defaultFile) { location.search = '?f=' + encodeURIComponent(defaultFile); return; }
    // The whole-tree picker, which is a different question from the panel's one folder: there is no
    // open document yet, so there is no folder to be in. Its toggle goes with it.
    $('main').style.display = 'none'; $('filelist').style.display = 'block';
    $('navToggle').style.display = 'none';
    document.body.classList.add('no-nav');   // and the inset the frame reserves comes off with it
    const ext = (p) => { const b = p.split('/').pop(); const i = b.lastIndexOf('.'); return i > 0 ? b.slice(i + 1) : ''; };
    $('filelist').innerHTML = '<div class="h">pick a file</div><div class="sub">documents, most recently reviewed first.</div>' + files.map(f =>
      `<a href="/?f=${encodeURIComponent(f.rel)}"><span class="ext">${esc(ext(f.rel))}</span>` +
      `<span class="nm">${esc(f.rel)}</span><span class="sp"></span>` +
      `<span class="ago">${esc(timeAgo(f.mtime))}</span>` +
      (f.open ? `<span class="count">${f.open}</span>` : `<span class="none">—</span>`) + `</a>`).join('');
    return;
  }
  document.title = 'sidecar · ' + FILE;
  $('doc').contentEditable = 'true';
  // Stamp the entry we arrived on, so a back from a document opened in the panel lands here with a
  // state object rather than on the URL fallback.
  history.replaceState({ f: FILE, y: 0 }, '', location.href);
  // Switching documents replaces the page's contents without navigating, so the browser's own scroll
  // restore has nothing to restore from: it would fire against the outgoing document's height and
  // land wherever that happened to be. The position rides on the history entry instead (stampScroll),
  // and openDoc puts it back once the incoming document has a height (restoreScroll).
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  await reloadFile();
  loadDir(dirOf(FILE));   // not awaited: the document is what was asked for, the folder is context
  const es = new EventSource('/events');
  es.onmessage = async (e) => {
    const { rel } = JSON.parse(e.data);
    navTouched(rel);       // a sibling moved: the folder's order may have, and a new file may exist
    if (rel !== FILE) return;
    const fresh = await api('GET', '/api/state?path=' + encodeURIComponent(FILE));
    if (fresh.hash === state.hash) {          // our own save, or only the sidecar/presence moved — keep the caret
      // A presence heartbeat fires every 15s while an agent is watching, and it
      // arrives here with the review byte-identical. Rebuilding the rail for it
      // threw away scroll position mid-sentence — the rail jumping under you
      // every 15 seconds while writing a reply. Only re-render what moved.
      const reviewMoved = JSON.stringify(fresh.review) !== JSON.stringify(state.review);
      // The rail must also rebuild when the per-thread marks changed (a wait exit delivering item
      // ids, or a re-arm clearing them) — but NOT on the plain 15s watching heartbeat, whose empty
      // item list matches the previous one and would otherwise rebuild the rail under the caret.
      const marksMoved = JSON.stringify((fresh.presence || {}).items || []) !==
                         JSON.stringify((state.presence || {}).items || []);
      state.review = fresh.review;
      state.presence = fresh.presence;        // presence pings arrive here (doc bytes unchanged)
      if (reviewMoved || marksMoved) renderSide();
      else renderPresence();
      return;
    }
    if (dirty) {                              // genuine external edit while we have unsaved text
      showBanner('File changed on disk while you were editing.', [
        { label: 'Reload (discard my edits)', fn: () => { dirty = false; applyState(fresh); } },
        { label: 'Keep typing', fn: () => {} },
      ]);
      return;
    }
    applyState(fresh);
  };
}

async function reloadFile() {
  applyState(await api('GET', '/api/state?path=' + encodeURIComponent(FILE)));
}
function applyState(s) {
  hideBanner();
  state = s; dirty = false;
  // An asset never saves, so "saved" would be a claim about nothing. The slot carries the picker's
  // hover label instead (see the frame's `hover` message).
  setStatus(s.kind === 'asset' ? '' : 'saved');
  if (s.code) { const b = document.querySelector('.brand'); if (b) b.title = 'server code ' + s.code; }   // §6b: staleness visible on hover
  renderPwd(); renderDoc(); renderSide();
}
// pwd line above the doc — the document's path, terminal-style (dir muted, filename inked). The kind
// tag beside the filename says "asset" on an HTML document, because the read-only surface is otherwise
// an unexplained absence: no caret, no toolbar, nothing to blame.
function renderPwd() {
  // Two spans rather than one string: on a phone the qualifier is dropped in CSS so the zoom control
  // and the filename both fit. Static markup, no interpolation.
  $('kind').innerHTML = isAsset() ? 'asset<span class="ro"> · read-only</span>' : '';
  paintZoom();
  const p = state.pwd || FILE || '';
  const i = p.lastIndexOf('/');
  $('pwd').innerHTML = i >= 0
    ? `<span class="dir">${esc(p.slice(0, i + 1))}</span><span class="file">${esc(p.slice(i + 1))}</span>`
    : `<span class="file">${esc(p)}</span>`;
}
// Settled is silence: 'saved' is the steady state and a label that never changes is furniture. The
// transient states (editing…, saving…) and the two that need acting on (conflict, save failed) show.
function setStatus(s) { $('status').textContent = s === 'saved' ? '' : s; }
// The text is cleared on transitionend, not immediately: emptying it mid-flight would collapse the
// toast to a dot and animate that instead. A guard covers the case where the class is re-added before
// the exit finishes (a second banner raised straight after a dismissal).
function hideBanner() {
  const b = $('banner');
  if (!b.classList.contains('open')) { b.innerHTML = ''; return; }
  b.classList.remove('open');
  b.addEventListener('transitionend', function done(e) {
    if (e.target !== b || e.propertyName !== 'opacity') return;
    b.removeEventListener('transitionend', done);
    if (!b.classList.contains('open')) b.innerHTML = '';
  });
}
function showBanner(text, actions) { // actions: [{label, fn}]
  const b = $('banner');
  b.innerHTML = '';
  b.append(text);
  for (const a of actions) {
    const btn = document.createElement('button');
    btn.textContent = a.label;
    btn.onclick = () => { hideBanner(); a.fn(); };
    b.appendChild(btn);
  }
  // No rAF dance needed: the toast is `visibility:hidden`, not `display:none`, so it always has a
  // resting opacity/transform to animate FROM. Re-raising mid-exit just retargets the transition.
  b.classList.add('open');
}

// marked v12 ships no sanitizer, so its HTML output — including any raw HTML embedded in the source
// markdown (<img onerror>, <svg onload>, <script>, javascript: URLs) — would execute when assigned to
// innerHTML, on a page that's same-origin with the file read/write API. Scrub every marked→innerHTML
// path through DOMPurify first. Defaults already drop scripts, event-handler attrs, and unsafe URL
// schemes while keeping headings/lists/tables/links/code/images/bold/italic, so no extra config needed.
// Display-only: the serialize()/toMd save path is separate, so untouched blocks still emit their raw bytes.
function renderMd(tokens) { return DOMPurify.sanitize(marked.parser(tokens)); }

// ---------- doc: one live rich-text surface (contenteditable), saved as markdown ----------
function renderDoc() {
  const doc = $('doc');
  doc.innerHTML = '';
  // An asset is HTML reviewed as a rendered visual: it goes into a sandboxed frame, not through the
  // markdown path, which would draw its source as text under an editable surface.
  if (state.kind === 'asset') {
    doc.contentEditable = 'false';
    doc.classList.add('asset');     // drops the prose measure — see #doc.asset
    blocks = [];
    doc.appendChild(buildAssetFrame());
    refreshFrame();
    return;
  }
  // Set on every markdown render, not once at boot: switching from an asset to a document in the same
  // view would otherwise leave the read-only surface the asset asked for, with no way to type in a
  // document that is perfectly editable. The measure comes back for the same reason.
  doc.contentEditable = 'true';
  doc.classList.remove('asset');
  const tokens = marked.lexer(state.markdown);
  blocks = []; let off = 0;
  for (const t of tokens) {
    const start = off; off += t.raw.length;
    blocks.push({ token: t, start, end: off });
  }
  blocks.forEach((b, i) => {
    if (b.token.type === 'space') return;
    const el = document.createElement('div');
    el.className = 'block'; el.dataset.i = i;
    if (renderAtomic(el, b)) { doc.appendChild(el); return; }   // sets its own md0; never goes through turndown
    el.innerHTML = renderMd([b.token]);   // sanitized before it hits the DOM; .block wrapper added after, structure intact
    // Surface a link's destination on hover — inside a contenteditable the href is otherwise invisible.
    // A link to another document in this root is also MARKED, so the cursor says a plain click will
    // follow it (see the #doc a.xdoc rule and the click handler at the foot of this file). The class is
    // safe to add: turndown's link rule reads href and title, so nothing about it reaches the file.
    el.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href') || '';
      if (!a.title) a.title = href;
      if (DocLink.route(href, FILE)) a.classList.add('xdoc');
    });
    el.querySelectorAll('img[src]').forEach(rewriteAssetSrc);
    doc.appendChild(el);
    b.md0 = toMd(el);   // baseline for tight-diff change detection
  });
}

// A relative image path in the document is relative to the DOCUMENT, but the page lives at `/?f=…`,
// so the browser would resolve `./flow.png` against the app root and 404. Hand both halves to the
// server and let it resolve + confine them — path safety stays in the one place that already does it
// (safePath), instead of being re-derived here where it would drift.
function rewriteAssetSrc(img) {
  const src = img.getAttribute('src') || '';
  if (!src || /^([a-z][a-z0-9+.-]*:|\/\/|\/)/i.test(src)) return;   // absolute, protocol-relative, or data: → leave it
  img.setAttribute('src', '/assets?doc=' + encodeURIComponent(FILE) + '&src=' + encodeURIComponent(src));
}

// ---------- the asset frame ----------
// An .html asset renders in a sandboxed iframe whose srcdoc the CLIENT assembles: DOMPurify strips the
// asset's scripts, handlers and embedded browsing contexts while keeping its styles, relative
// references are rewritten to the /assets route, and sidecar's picker is inlined as the only script
// that runs in there. The pipeline itself lives in /assetframe.js, shared with the Node tests.
//
// Everything the page needs from inside the frame crosses a postMessage boundary, because the sandbox
// deliberately withholds this page's origin from it: the natural canvas size (to scale by), per-item
// rects (to dock cards by), and picks. See docs/adr/0001-asset-frame-isolation.md for why a frame and
// not a shadow root.
const isAsset = () => !!state && state.kind === 'asset';
let frameEl = null, frameNatural = null, frameScale = 1;
let frameGeometry = {};    // item id → rect in the frame's own coordinates
let frameAnchors = {};     // item id → 'resolved' | 'missing', the frame's own view of each anchor
let pendingElement = null; // the element anchor a pick is composing against

// The picker's source, fetched once and inlined. Fetched from the PAGE, which is same-origin with the
// server; the frame could not fetch it at all without a round trip on an opaque origin.
let pickerSrc = null;
async function pickerSource() {
  if (pickerSrc == null) pickerSrc = await (await fetch('/picker.js')).text();
  return pickerSrc;
}

function buildAssetFrame() {
  const wrap = document.createElement('div');
  wrap.className = 'asset-wrap';
  // Cloned from the template in the markup so the sandbox flags are never assembled in code — see the
  // comment on #assetFrameTpl.
  frameEl = $('assetFrameTpl').content.firstElementChild.cloneNode(true);
  frameGeometry = {}; frameAnchors = {}; frameNatural = null; frameScale = 1;
  // Is the pointer over the frame? The AUTHORITY is the picker's `pointer` message: under site
  // isolation the frame is another process and these enter/leave listeners never fire (real Chrome),
  // while the picker sees every move from inside. The pair stays as a fallback for engines that do
  // deliver it — both describe the same truth, so they cannot disagree for long.
  pointerInFrame = false;
  frameEl.addEventListener('mouseenter', () => { pointerInFrame = true; });
  frameEl.addEventListener('mouseleave', () => { pointerInFrame = false; });
  // Before the first `ready`, the frame has the browser-default 300px viewport, and that is the width
  // the picker MEASURES a responsive document at (a fixed-size poster reports its own width either
  // way). Lay the frame out at the column width first, so a responsive asset is measured at the width
  // it will actually be read at; sizeFrame then pins the measured width explicitly.
  frameEl.style.width = '100%';
  wrap.appendChild(frameEl);
  return wrap;
}

// Alt taps step the picker one layer down its stack, which is how a covered element is reached at all
// (a full-bleed scrim owns every point it covers). A keydown goes to whichever document has focus, and
// the frame has none until it is clicked, so the page forwards the first press itself. The picker
// handles `step` identically to its own keydown, so the two routes cannot drift.
let pointerInFrame = false;
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Alt' || e.repeat || !pointerInFrame || !isAsset()) return;
  e.preventDefault();      // Alt alone focuses the menu bar on Windows and Linux
  sendFrame('step', {});
});
// Shift held over the frame puts the asset in LINK MODE: its links read as links and a click follows one
// (see the picker's STYLE and its click handler). Forwarded for the same reason Alt is, that the frame has
// no focus until it is clicked, so the first press would otherwise do nothing.
//
// The key is only ever forwarded ON here. Turning it off is the picker's own keyup, its blur, and the true
// state on every mouse event, because the press that got us here can be released anywhere: another
// window, another tab, the rail. The clear below is the page's half of the same insurance.
const sayLinkMode = (on) => { if (isAsset()) sendFrame('linkmode', { on: on }); };
window.addEventListener('keydown', (e) => { if (e.key === 'Shift' && pointerInFrame) sayLinkMode(true); });
window.addEventListener('keyup', (e) => { if (e.key === 'Shift') sayLinkMode(false); });
window.addEventListener('blur', () => sayLinkMode(false));

async function refreshFrame() {
  const el = frameEl, src = await pickerSource();
  if (el !== frameEl) return;   // a reload landed while the source was in flight; that render owns the frame
  frameEl.setAttribute('srcdoc', AssetFrame.buildFrame({
    html: state.markdown, docRel: FILE, purify: DOMPurify, picker: src }));
}

// Scale the natural canvas into the document column. A transform rather than a width: an asset is laid
// out to the pixel (a 1080x1350 poster), so reflowing it to fit would review a different document.
// Two zooms, and the transform is the whole difference between them (see assetZoom): `fit` scales the
// canvas down to the column, `100%` leaves it alone and the wrapper scrolls it.
function sizeFrame() {
  if (!frameEl || !frameNatural || !frameEl.parentElement) return;
  const wrap = frameEl.parentElement, full = assetZoom === 'full';
  // Toggle the scroller BEFORE measuring. Coming back from 100% the wrapper may still be carrying a
  // horizontal scrollbar, and a fit computed against a column reported narrower than it is comes out
  // short and never recovers, because the next fit measures the same wrong width.
  wrap.classList.toggle('zoomed', full);
  const avail = wrap.clientWidth;
  // Zero is "layout has not run", never a real column width — `ready` can land while the page is in a
  // hidden pane or background tab, where committing 0 would pin the frame at scale(0) until the next
  // window resize. Retry on a timer: rAF is precisely what a hidden page starves.
  if (!avail) { setTimeout(sizeFrame, 250); return; }
  frameScale = full ? 1 : Math.min(1, avail / Math.max(1, frameNatural.width));
  frameEl.style.width = frameNatural.width + 'px';
  frameEl.style.height = frameNatural.height + 'px';
  frameEl.style.transform = frameScale < 1 ? 'scale(' + frameScale + ')' : '';
  // A transform does not change layout size, so the wrapper carries the scaled height or the page
  // scrolls to the unscaled one and leaves a screen of blank below a tall poster.
  const scaled = Math.ceil(frameNatural.height * frameScale);
  wrap.style.height = scaled + 'px';
  // Where the platform draws classic scrollbars rather than overlay ones, the horizontal bar is drawn
  // INSIDE that height and takes the last rows of the asset with it. Measure what it actually took —
  // zero on macOS, ~15px on Windows — instead of reserving a guess on every platform.
  if (full) {
    const bar = wrap.offsetHeight - wrap.clientHeight;
    if (bar > 0) wrap.style.height = (scaled + bar) + 'px';
  }
  // The lines above are where an asset first HAS a height. A back into one restores its scroll position
  // here rather than in openDoc, where the frame is an empty box and every position clamps to zero.
  applyPendingScroll();
}

function sendFrame(name, body) {

// move and all the way through a mouse drag, so it would raise the toolbar mid-drag and would need its
// own pointer-down and composition suppression to leave the pointer path alone. Keyup reaches the same
// selections through the same onSelectEnd, and a character key is not in the list, so typing stays
// quiet. What it gives up is a selection made by neither pointer nor keyboard (a menu's Select All, a
// programmatic range); nothing in sidecar makes one.
// Meta and Control are in the list because macOS swallows the keyup of a letter held under Cmd, so the
// modifier's own release is the only event Cmd+A reliably delivers.
const SELECTION_KEYS = new Set([
  'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown',
  'Shift', 'Meta', 'Control', 'a', 'A',
]);
document.addEventListener('keyup', (e) => {
  if (e.isComposing || !SELECTION_KEYS.has(e.key)) return;   // IME: mid-composition the composing run reads as a selection
  if ((e.key === 'a' || e.key === 'A') && !(e.metaKey || e.ctrlKey)) return;   // a bare "a" is typing
  onSelectEnd(e);   // same gate the pointer path uses: under 3 chars, a collapsed caret included, hides it
});

// ---------- a diagram node -> a comment anchored to that node ----------
// The picture is not the source. A node comment anchors to the node's LABEL TEXT inside the fence,
// which is ordinary document text the matcher already reaches (test.js pins that a comment can anchor
// inside a fenced code block, and spliceRisk refuses to splice across one — highlight allowed exactly
// where mutation isn't). So these orphan, re-anchor and merge like every other comment: no second
// anchor type, no new orphan semantics, nothing in the sidecar JSON that says "diagram".
let pendingNode = null;

// Where this fence's CONTENT starts in the current document. b.start goes stale after a structural
// edit — serialize()'s block-count-changed path doesn't reindex — so find the fence by its content and
// use the recorded offset only to break ties between two identical fences.
function fenceBase(b) {
  const raw = b.token.raw, hits = [];
  for (let i = state.markdown.indexOf(raw); i !== -1; i = state.markdown.indexOf(raw, i + 1)) hits.push(i);
  const at = hits.length ? hits.reduce((best, h) => Math.abs(h - b.start) < Math.abs(best - b.start) ? h : best) : b.start;
  return at + Math.max(0, raw.indexOf(b.token.text || ''));
}

// Resolved at SUBMIT time, not at click time: flushSave() runs in between and can shift every offset
// in the document, and the anchor has to match what actually landed on disk.
function nodeAnchor(p) {
  const b = blocks[p.blockIdx];
  const el = $('doc').querySelector('.block[data-i="' + p.blockIdx + '"]');
  const node = el && el.__flowNodes && el.__flowNodes[p.nodeIdx];
  if (!b || !node) return null;
  const hits = Anchor.findAll(state.markdown, node.label);
  if (!hits.length) return null;
  // The label almost always also appears in the prose around the diagram; pick the mention that is
  // this node's own, by proximity to where it sits inside the fence.
  const target = fenceBase(b) + node.at;
  let occurrence = 0, bd = Infinity;
  hits.forEach((h, i) => { const d = Math.abs(h.start - target); if (d < bd) { bd = d; occurrence = i; } });
  return { quote: node.label, occurrence };
}

$('doc').addEventListener('click', (e) => {
  const g = e.target.closest && e.target.closest('.fl-node');
  if (!g) return;
  const blockEl = g.closest('.block');
  const nodeIdx = Number(g.dataset.node);
  if (!blockEl || !blockEl.__flowNodes || !blockEl.__flowNodes[nodeIdx]) return;
  hideTool();
  // Already commented on → open that thread, the same as clicking a highlight in the prose. Otherwise
  // every click on a discussed node would start a second thread about it.
  if (g.dataset.itemId) return openReview(g.dataset.itemId);
  pendingNode = { blockIdx: Number(blockEl.dataset.i), nodeIdx };
  pendingSel = blockEl.__flowNodes[nodeIdx].label;
  pendingSelBlock = pendingNode.blockIdx; pendingSelOffset = null; savedRange = null;
  selRect = g.getBoundingClientRect();
  openComment();
});
// Keyboard parity — the nodes are focusable, so Enter has to do what the click does.
$('doc').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const g = e.target.closest && e.target.closest('.fl-node');
  if (g) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
const SELTOOL_HTML = $('seltool').innerHTML;   // captured once — openLinkInput() replaces the buttons with a URL field
function showTool() {
  const st = $('seltool');
  st.innerHTML = SELTOOL_HTML;                  // always rebuild the full button set (the link input never restored itself)
  st.style.display = 'flex';
  const w = st.offsetWidth || 260;
  st.style.left = Math.max(8, Math.min(selRect.left, innerWidth - w - 8)) + 'px';
  st.style.top = Math.max(scrollY + 4, selRect.top + scrollY - st.offsetHeight - 8) + 'px';
}
function hideTool() { $('seltool').style.display = 'none'; }
function hidePopover() { $('popover').style.display = 'none'; $('popover').innerHTML = ''; pendingNode = null; pendingElement = null; }

$('seltool').addEventListener('mousedown', (e) => e.preventDefault()); // keep the text selection alive
$('seltool').addEventListener('click', (e) => {
  const op = e.target.closest('button') && e.target.closest('button').dataset.op;
  if (!op) return;
  if (op === 'fmt-toggle') { toggleFmtMenu(); return; }   // open/close the text-style dropdown
  if (!pendingSel) return;
  if (op === 'bold' || op === 'italic') exec(op);
  else if (op === 'link') openLinkInput();
  else if (op === 'comment') openComment();
  else if (op === 'p' || op === 'h1' || op === 'h2' || op === 'h3') setBlockFormat(op);
});
// The text-style dropdown (¶ / h1–h3). Lives inside #seltool so the toolbar's mousedown-preventDefault
// keeps the text selection alive; setBlockFormat restores savedRange, same as the old inline buttons.
function toggleFmtMenu(force) {
  const m = $('seltool').querySelector('.fmt-menu'); if (!m) return;
  const open = force === undefined ? m.hasAttribute('hidden') : force;
  if (open) m.removeAttribute('hidden'); else m.setAttribute('hidden', '');
}

// Change the selected block between normal text (p) and headings (h1–h3) — the reverse of type-to-format,
// and the way OUT of a heading. Only simple text blocks convert; lists/tables/quotes/code are left alone.
function setBlockFormat(tag) {
  restoreSelection();                       // bring back the pre-toolbar selection so we know the block
  const b = caretBlock(); if (!b) { hideTool(); return; }
  const inner = b.firstElementChild;
  if (!inner || !/^(P|H[1-6])$/.test(inner.nodeName)) { hideTool(); return; }
  if (inner.nodeName.toLowerCase() === tag) { hideTool(); return; }   // already that format
  const el = document.createElement(tag);
  while (inner.firstChild) el.appendChild(inner.firstChild);          // move the exact nodes (keeps inline marks)
  inner.replaceWith(el);
  const r = document.createRange(); r.selectNodeContents(el);         // keep the text selected so it reads as "changed"
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  hideTool();
  dirty = true; setStatus('editing…'); scheduleSave();
}

// Position the popover just below where the toolbar sits.
function popoverAt() {
  const po = $('popover');
  po.style.display = 'block';                              // display first so we can measure it
  const w = po.offsetWidth || 300, h = po.offsetHeight || 170;
  const left = Math.max(12, Math.min(selRect.left, innerWidth - w - 12));
  // Prefer BELOW the selection so the text you're commenting on stays visible; flip above if no room.
  let top = selRect.bottom + 10;
  if (top + h > innerHeight - 12) top = Math.max(12, selRect.top - h - 10);
  po.style.left = (left + scrollX) + 'px';
  po.style.top = (top + scrollY) + 'px';
}

// Restore the pre-toolbar selection, then run a rich-text command; the debounced save serializes it.
function restoreSelection() {
  if (!savedRange) return;
  $('doc').focus();
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(savedRange);
}
function exec(op, url) {
  restoreSelection();
  document.execCommand(op === 'bold' ? 'bold' : op === 'italic' ? 'italic' : 'createLink', false, url);
  hideTool();
  dirty = true; setStatus('editing…'); scheduleSave();
}

// The <a> the selection sits inside, if any — so the link button can edit or remove an existing
// link rather than only ever adding one.
function selectedLink() {
  const r = savedRange || (getSelection().rangeCount ? getSelection().getRangeAt(0) : null);
  if (!r) return null;
  let n = r.commonAncestorContainer;
  if (n.nodeType === 3) n = n.parentNode;
  return n && n.closest ? n.closest('#doc a') : null;
}

function unlink() {
  const a = selectedLink();
  restoreSelection();
  if (a) {                       // unwrap directly: execCommand('unlink') needs the whole <a> selected
    const p = a.parentNode;
    while (a.firstChild) p.insertBefore(a.firstChild, a);
    p.removeChild(a); p.normalize();
  } else {
    document.execCommand('unlink');
  }
  hideTool();
  dirty = true; setStatus('editing…'); scheduleSave();
}

// Link: swap the toolbar into a URL field in place, apply on Enter. If the selection is already
// inside a link, prefill it and offer removal — submitting an empty field unlinks, which is the way
// back out of a link you didn't mean to make.
function openLinkInput() {
  const st = $('seltool');
  const existing = selectedLink();
  st.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'url';
  input.placeholder = existing ? 'Enter to update · empty to remove' : 'https://…  (Enter to add)';
  if (existing) input.value = existing.getAttribute('href') || '';
  st.appendChild(input);
  if (existing) {
    const rm = document.createElement('button');
    rm.textContent = 'unlink';
    rm.addEventListener('mousedown', (e) => { e.preventDefault(); unlink(); });
    st.appendChild(rm);
  }
  input.focus(); input.select();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const u = input.value.trim();
      if (u) exec('link', u);
      else if (existing) unlink();
      else hideTool();
    }
    if (e.key === 'Escape') hideTool();
  });
}

// ---------- images in comments ----------
// A pasted screenshot becomes a FILE next to the review and a markdown link in the comment body —
// not a base64 blob in the sidecar. Three reasons it has to be a file: the .sidecar.json is rewritten
// and merged on every reply, and megabytes of base64 in there make every write and every SSE push
// expensive; `sidecar show` would print an unreadable wall to the agent; and the whole promise is
// "these are your files on your disk", which a blob inside a JSON quietly stops being true of.
// Because the reference is ordinary markdown relative to the document, the agent that reads the
// comment gets a path it can open with its own file tools, and rendering needed no new code.
async function uploadImage(file) {
  const r = await fetch('/api/asset?doc=' + encodeURIComponent(FILE), {
    method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file });
  const out = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(out.error || 'upload failed');
  return out;   // { src, markdown }
}
// Insert at the caret, on its own line — an image link jammed mid-sentence renders inline and breaks
// the sentence around it. Keeps focus and caret after the insertion so typing continues naturally.
function insertAtCaret(ta, text) {
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const pad = (before && !before.endsWith('\n') ? '\n' : '') + text + (after && !after.startsWith('\n') ? '\n' : '');
  ta.value = before + pad + after;
  const caret = before.length + pad.length;
  ta.selectionStart = ta.selectionEnd = caret;
  ta.focus(); autogrow(ta);
}
// An upload spans an await, and renderSide() rebuilds every card from scratch whenever the review
// changes — so the textarea we started on can be a detached node by the time the bytes land, and
// writing the markdown into it would put it nowhere. Re-resolve the box by its slot instead of
// holding the element: the popover's is a fixed id, a reply's is its card.
function boxSlot(ta) {
  const card = ta.closest && ta.closest('.card');
  return card ? { card: card.dataset.id } : { id: ta.id };
}
function liveBox(slot) {
  if (slot.card) { const c = $('side').querySelector(`.card[data-id="${CSS.escape(slot.card)}"]`); return c && c.querySelector('textarea.reply'); }
  return document.getElementById(slot.id);
}
// Upload each file and drop its markdown in. A placeholder holds the spot while the bytes are written,
// so a big paste doesn't look like nothing happened, and a failure leaves a visible reason in the box
// rather than silently swallowing the image.
async function attachFiles(ta, files) {
  const slot = boxSlot(ta);
  for (const f of files) {
    if (!/^image\//.test(f.type || '') && !/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(f.name || '')) continue;
    const tag = '![uploading ' + (f.name || 'image') + '…]()';
    insertAtCaret(ta, tag);
    let out, err = null;
    try { out = await uploadImage(f); } catch (e) { err = e; }
    const box = liveBox(slot) || ta;
    box.value = box.value.replace(tag, err
      ? '`could not attach ' + (f.name || 'image') + ': ' + err.message + '`'
      : out.markdown);
    autogrow(box);
    ta = box;   // subsequent files insert into the box that's actually on screen
  }
}
// Paste and drop on any compose box. Bound per-textarea rather than delegated because both events need
// preventDefault BEFORE the browser's own handling — a dropped PNG otherwise navigates the page to it,
// and a pasted image with no handler is silently dropped.
function wireAttach(ta) {
  ta.addEventListener('paste', (e) => {
    const files = [...(e.clipboardData?.files || [])];
    if (!files.length) return;   // plain text paste — leave it entirely alone
    e.preventDefault();
    attachFiles(ta, files);
  });
  ta.addEventListener('dragover', (e) => { if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); ta.classList.add('dropping'); } });
  ta.addEventListener('dragleave', () => ta.classList.remove('dropping'));
  ta.addEventListener('drop', (e) => {
    const files = [...(e.dataTransfer?.files || [])];
    ta.classList.remove('dropping');
    if (!files.length) return;
    e.preventDefault();
    attachFiles(ta, files);
  });
}
// The file picker is shared, so it has to remember who opened it. On a phone this button IS the
// feature — there is no drag, and iOS routes it to the camera roll.
// One definition, two callers (the comment popover and every reply row) — a second copy of this
// markup is a second thing to keep in sync for no gain. title + aria-label because an icon with no
// name is a guess: this is the tool's only wordless control.
const IMG_ICON = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="2.5" y="3.75" width="15" height="12.5" rx="2.5"/>
  <circle cx="7.25" cy="8.25" r="1.35"/>
  <path d="M3.7 14.6 7.5 11.1a1.55 1.55 0 0 1 2 0l3.9 3.5M12.6 12.2l1.3-1.1a1.55 1.55 0 0 1 2 0l1.4 1.2"/>
</svg>`;
const imgBtn = (attrs) => `<button class="ghost iconbtn" ${attrs} title="Attach an image" aria-label="Attach an image">${IMG_ICON}</button>`;

let pickerTarget = null;
function pickImage(ta) { pickerTarget = ta; const p = $('picker'); p.value = ''; p.click(); }
$('picker').addEventListener('change', (e) => {
  const ta = pickerTarget; pickerTarget = null;
  if (ta && e.target.files.length) attachFiles(ta, [...e.target.files]);
});
// Click any image in a comment to see it at full size. A screenshot is pasted in *because* the detail
// matters, and the rail is 300px wide.
const lightbox = $('lightbox');
function openLightbox(src) { lightbox.querySelector('img').src = src; lightbox.classList.add('on'); }
lightbox.addEventListener('click', () => lightbox.classList.remove('on'));
addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('on'); });

function openComment() {
  hideTool();
  const po = $('popover');
  po.innerHTML = `<div class="po-head" id="poHead"><span class="po-title">comment</span><span class="po-grip">⠿</span></div>
    <textarea id="pobody" placeholder="comment… or paste an image"></textarea>
    <div class="row">${imgBtn('id="poImage"')}<span class="spacer"></span>
    <button class="ghost" id="poCancel">cancel</button>
    <button class="primary" id="poSubmit">comment</button></div>`;
  popoverAt();
  makeDraggable(po, $('poHead'));   // drag the header to move it off the text you're commenting on
  const ta = $('pobody'); ta.focus();
  $('poCancel').onclick = hidePopover;
  $('poSubmit').onclick = submitComment;
  $('poImage').onclick = () => pickImage(ta);
  wireAttach(ta);
  ta.addEventListener('input', () => autogrow(ta));
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitComment(); }
    if (e.key === 'Escape') hidePopover();
  });
}
// Drag an absolutely-positioned element by a handle. Delta-based (origin-agnostic), pointer events for
// mouse+touch, clamped so it can't be dragged fully off-screen.
function makeDraggable(el, handle) {
  let sx, sy, ox, oy, dragging = false;
  handle.addEventListener('pointerdown', (e) => {
    if (e.button != null && e.button !== 0) return;
    dragging = true;
    try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left) || 0; oy = parseFloat(el.style.top) || 0;
    e.preventDefault();
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const nx = ox + (e.clientX - sx), ny = oy + (e.clientY - sy);
    el.style.left = nx + 'px'; el.style.top = ny + 'px';
    const r = el.getBoundingClientRect();   // keep it reachable — nudge back inside the viewport
    let ax = 0, ay = 0;
    if (r.left < 6) ax = 6 - r.left; else if (r.right > innerWidth - 6) ax = (innerWidth - 6) - r.right;
    if (r.top < 6) ay = 6 - r.top; else if (r.bottom > innerHeight - 6) ay = (innerHeight - 6) - r.bottom;
    if (ax || ay) { el.style.left = (nx + ax) + 'px'; el.style.top = (ny + ay) + 'px'; }
  });
  const end = (e) => { if (dragging) { dragging = false; try { handle.releasePointerCapture(e.pointerId); } catch (_) {} } };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}

async function pushReviewItem(item) {
  state.review.items.push(item);
  const r = await api('PUT', '/api/review', { path: FILE, review: state.review });
  state.review = r.review; // server merge is authoritative
  renderSide();
}
async function submitComment() {
  const body = $('pobody').value.trim();
  if (!body || !pendingSel) return hidePopover();
  await flushSave();  // anchor must match what's on disk
  // Three anchor sources, one submit path: an element picked in an asset frame, a diagram node, or a
  // text selection. The element case carries its own synthesized quote (label · snippet) so cards, the
  // digest and `show` keep reading the one field.
  const anchor = (pendingElement && { element: pendingElement.element, quote: pendingElement.quote })
    || (pendingNode && nodeAnchor(pendingNode))
    || { quote: pendingSel, occurrence: occurrenceFor(pendingSel, pendingSelBlock, pendingSelOffset) };
  const item = { id: 'c' + Date.now(), kind: 'comment', by: state.user,
    anchor, status: 'open',
    thread: [{ by: state.user, at: new Date().toISOString(), text: body }] };
  hidePopover();
  await pushReviewItem(item);
}
// `run` was retired entirely (2026-07-22, Alex: "run is dead as a concept") — no button, no rendering; a
// legacy run:true item just shows as its underlying comment. `flag` lost its toolbar button the same day but
// is still a concept: flag items render (renderActive keys off it.flag) and an agent can write one into the JSON.
// ⌘B / ⌘I are handled natively by the contenteditable surface (fires 'input' → debounced save).

// ---------- sidebar ----------
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Comment and note bodies are markdown, same as the document — so render them as markdown. Escaping
// them into a <span> (which is what this did) collapsed every newline, because .msg .t sets no
// white-space rule, and printed literal ** and backticks: any structured comment arrived as one
// unreadable run-on block. Same marked→DOMPurify path as renderMd, for the same XSS reason — these
// strings reach innerHTML on a page that's same-origin with the file API.
// A body that is exactly one paragraph is unwrapped, so short replies stay on the author's line and
// look as they always have; only genuinely structured text becomes blocks.
// An image in a comment body is a relative path off the DOCUMENT, exactly like one in the document,
// so it needs the same /assets rewrite — without it every attached screenshot resolves against the
// app root and renders as a broken icon. Done on a detached node rather than by regex on the string:
// the sanitized markup is already parsed, and one rewriter (rewriteAssetSrc) serves both surfaces.
function proseHtml(s) {
  const box = document.createElement('div');
  box.innerHTML = DOMPurify.sanitize(marked.parse(String(s ?? ''), { breaks: true }));
  box.querySelectorAll('img[src]').forEach(rewriteAssetSrc);
  const html = box.innerHTML.trim();
  const one = html.match(/^<p>([\s\S]*)<\/p>$/);
  return one && !/<p[ >]/.test(one[1]) ? one[1] : html;
}
// Identity class for a card/thread author — the agent (its own name, default 'claude') gets the
// yellow chip; everyone else (the human, whatever SIDECAR_USER is) gets the ink dot. Keyed off the
// agent name from /api/state, never a literal, so legacy 'alex', the default 'you', and any custom
// name all color as the human.
function whoCls(by) { return (state && by === state.agent) ? 'agent' : 'human'; }
// ---------- per-thread presence: which card is the agent answering right now? ----------
// The agent's `wait` exit pings the server with the ids it woke on; they arrive here as
// state.presence.items [{id, agent, until}]. A mark is live until its `until` (the server's staleness
// horizon — a killed agent goes quiet instead of "replying" forever); expiry is enforced on OUR clock
// because a dead agent sends no further pings to trigger a re-render.
function liveMarks() {
  const now = Date.now();
  return ((state.presence && state.presence.items) || []).filter(m => !m.until || m.until > now);
}
// The card row: "<agent> is replying ···". Shown only while the thread's latest message is NOT the
// marking agent's — the moment the reply lands the row clears here, per thread, even though the
// server-side set only shrinks on the agent's next ping.
function replyingHtml(it) {
  const m = liveMarks().find(x => x.id === it.id);
  if (!m) return '';
  const last = (it.thread || []).slice(-1)[0];
  if (last && last.by === m.agent) return '';
  return `<div class="replying"><span class="lbl">${esc(m.agent)} is replying</span></div>`;
}
// One re-render scheduled at the earliest future expiry (marks or the header state), so stale
// presence disappears without waiting for the next SSE event. Cleared and re-armed on every render.
let presenceExpiryTimer = null;
function schedulePresenceExpiry() {
  clearTimeout(presenceExpiryTimer);
  const now = Date.now();
  const untils = [...liveMarks().map(m => m.until),
                  state.presence && state.presence.until].filter(u => u && u > now);
  if (!untils.length) return;
  presenceExpiryTimer = setTimeout(renderSide, Math.min(...untils) - now + 250);
}
// A suggestion's inner word-level diff (old → new), monochrome+accent.
function diffHtml(quote, replacement) {
  return '<div class="diffbox">' + Diff.diffWords(quote, replacement).map(p =>
    p.added ? '<ins>' + esc(p.value) + '</ins>' : p.removed ? '<del>' + esc(p.value) + '</del>' : esc(p.value)).join('') + '</div>';
}
// An orphan has three causes and the card must not conflate them: an anchor that never resolved once
// was mis-anchored from birth (a selection spanning two blocks, an agent quoting text that isn't
// there); "text changed" means it DID resolve and the human then edited underneath it; and on an asset
// the element it named is no longer in the file, which is not a text edit at all. Reporting any of them
// as another blames the wrong thing for the break.
// Module scope on purpose — BOTH renderActive and nestedSugHtml call it.
// `fromFrame` is the picker's verdict on an anchor the store still believes in — the same break, seen
// by the authority that has a DOM.
const orphanLabel = (it, fromFrame) => it.orphanReason === 'never-matched' ? 'orphaned — anchor never matched'
  : (fromFrame || it.orphanReason === 'element-changed') ? 'orphaned — element changed'

    if (!railResizable() || navCollapsed()) return;
    const step = e.shiftKey ? 48 : 12;
    if (e.key === 'ArrowRight') applyNavWidth(clampNav(navWidth) + step, true);
    else if (e.key === 'ArrowLeft') applyNavWidth(clampNav(navWidth) - step, true);
    else return;
    e.preventDefault();
    applyRailWidth(restRail(), false);
    relayoutDoc();
  });
})();
// Restore before the first render, so the panel never flashes at the default width and then jumps.
if (uiStore.get('navCollapsed', '')) document.body.classList.add('nav-collapsed');
applyNavWidth(navWidth, false);
paintNavToggle();
// The rail's fill is measured against what the panel left of the window, and the panel's own width
// only just landed — the rail applied itself against the stylesheet's 248px default further up this
// file. Re-apply now that the two are in the order they will be in for the rest of the session.
applyRailWidth(restRail(), false);

// ---------- mobile bottom sheet ----------
function toggleSheet(force) {
  const open = force === undefined ? !document.body.classList.contains('sheet-open') : force;
  document.body.classList.toggle('sheet-open', !!open);
}
// Drag-to-dismiss: the sheet follows the finger down and closes past a threshold, else snaps back.
// Only when the card list is scrolled to the top (scrollTop<=0), so dragging doesn't fight scrolling.
(function sheetDrag() {
  const sheet = $('side');
  let startY = 0, dy = 0, dragging = false, fromTop = false;
  sheet.addEventListener('touchstart', (e) => {
    if (!document.body.classList.contains('sheet-open')) return;
    startY = e.touches[0].clientY; dy = 0;
    fromTop = sheet.scrollTop <= 0;
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0 && fromTop) {                 // dragging the sheet down (not scrolling the list)
      e.preventDefault();
      sheet.style.transform = 'translateY(' + dy + 'px)';
    }
  }, { passive: false });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';             // restore the .26s ease so close/snap-back animates
    sheet.style.transform = '';              // fall back to CSS: translateY(0) or (on close) 102%
    if (dy > 110) toggleSheet(false);        // past threshold → dismiss
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
})();

// ---------- anchor highlights: a persistent cue on every commented/suggested span ----------
// Wrap the (occurrence-th) match of an anchor quote in <mark data-id> — across text nodes, so a
// phrase that spans bold/links stays fully highlighted. Marks are contenteditable:false (a clean tap
// target, no keyboard) and are stripped by toMd() on save, so they never touch the markdown.
// The document's rendered text as one string, plus the text nodes it was built from. Shared by the
// highlighter and the rail's ordering so an anchor's offset and its highlight can never disagree.
// (wrapAnchor must re-read this per item: wrapping one anchor mutates the tree under the next walk.)
function docText() {
  // Atomic blocks are excluded on purpose, for two independent reasons. (1) surroundContents() would
  // inject an HTML <mark> into the SVG namespace, where it doesn't render — the diagram would just
  // lose a label. (2) A diagram's rendered text is its node labels, one per node, while the fence
  // SOURCE mentions a label once per edge; letting the two into the same offset space makes the
  // occurrence index mean different things at write time and at highlight time. Anchored nodes get
  // their cue from markAnchors() marking the <g> instead.
  const walker = document.createTreeWalker($('doc'), NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentElement && n.parentElement.closest('[data-atomic]'))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = []; let full = '';
  while (walker.nextNode()) { nodes.push({ node: walker.currentNode, start: full.length }); full += walker.currentNode.textContent; }
  return { nodes, full };
}
function wrapAnchor(quote, occurrence, id) {
  const { nodes, full } = docText();
  // Same matcher the server + occurrenceFor use, run over the concatenated rendered text; the returned
  // offsets index straight into `full`, so the text-node slicing below is unchanged.
  const hit = Anchor.findNth(full, quote, occurrence || 0);
  if (!hit) return null;
  const { start, end } = hit;
  const slices = [];
  for (const { node, start: ns } of nodes) {
    const ne = ns + node.textContent.length;
    if (ne <= start || ns >= end) continue;
    slices.push({ node, s: Math.max(0, start - ns), e: Math.min(node.textContent.length, end - ns) });
  }
  let first = null;
  for (const sl of slices) {
    // A span crossing a block boundary also covers the structural newline BETWEEN the blocks, which is
    // its own whitespace text node. Wrapping it produced a 2px cue floating in the paragraph gap,
    // highlighting nothing. Skip whitespace-only slices that carry a newline: an inter-word space
    // between two inline elements is whitespace too, but never contains one, so it still gets marked.
    const slice = sl.node.textContent.slice(sl.s, sl.e);
    if (!slice.trim() && slice.includes('\n')) continue;
    const r = document.createRange(); r.setStart(sl.node, sl.s); r.setEnd(sl.node, sl.e);
    const mark = document.createElement('mark'); mark.className = 'anchor'; mark.dataset.id = id; mark.contentEditable = 'false';
    try { r.surroundContents(mark); if (!first) first = mark; } catch {}
  }
  return first;
}
// Re-apply the cues to match current open items. Skipped while the doc is being edited (protects the
// caret); the marks refresh on the next render/save cycle.
function markAnchors() {
  const doc = $('doc');
  // An asset's cues are drawn by the picker, inside the frame, on the elements themselves. Hand it the
  // current anchor set instead of running the text matcher over a document that holds one iframe.
  if (isAsset()) { sendFrame('init', { items: frameItems() }); return; }
  if (document.activeElement === doc || doc.contains(document.activeElement)) return;
  doc.querySelectorAll('mark.anchor').forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); });
  doc.querySelectorAll('.fl-node.anchored').forEach(g => { g.classList.remove('anchored'); delete g.dataset.itemId; });
  doc.normalize();
  for (const it of state.review.items) {
    if (!['open', 'pending'].includes(it.status)) continue;
    if (it.kind === 'suggestion' && it.replyTo) continue;   // shares its parent comment's span — don't double-wrap
    // Guarded per item: a throw here used to abandon every REMAINING highlight, so the document
    // silently lost its cues while the cards still listed them.
    // Nodes first, and a node claims the item outright. The quote is the node's LABEL, which usually
    // also appears in the prose around the diagram — highlighting that instead put the cue, and the
    // docked card, next to a paragraph the comment was never about.
    let onNode = false;
    try { onNode = markNodes(it.anchor.quote, it.id) > 0; }
    catch (e) { console.error('sidecar: failed to highlight node', it.id, e); }
    if (onNode) continue;
    try { wrapAnchor(it.anchor.quote, it.anchor.occurrence || 0, it.id); }
    catch (e) { console.error('sidecar: failed to highlight', it.id, e); }
  }
}
// A diagram node whose label IS this item's quote gets the cue. Matched on the label rather than on
// anything stored in the sidecar, so a node comment stays an ordinary comment on disk — an agent that
// quotes a node by name from the CLI lights it up too, without knowing diagrams exist.
function markNodes(quote, id) {
  const want = String(quote || '').trim();
  if (!want) return 0;
  let hit = 0;
  for (const blockEl of $('doc').querySelectorAll('.block[data-atomic]')) {
    (blockEl.__flowNodes || []).forEach((n, i) => {
      if (n.label !== want) return;
      const g = blockEl.querySelector('.fl-node[data-node="' + i + '"]');
      if (g) { g.classList.add('anchored'); g.dataset.itemId = id; hit++; }
    });
  }
  return hit;
}
function pulse(nodes) { nodes.forEach(m => m.classList.add('flash')); setTimeout(() => nodes.forEach(m => m.classList.remove('flash')), 1400); }
// Tap a highlight in the doc → open its review (sheet on mobile) and flash the matching card.
$('doc').addEventListener('click', (e) => {
  const m = e.target.closest && e.target.closest('mark.anchor');
  if (m && m.dataset.id) openReview(m.dataset.id);
});
// A link to another document in this root opens IN sidecar, on a plain click, the way the panel's rows
// do. Reviewing a folder means following its citations, and the alternative was editing the URL by
// hand. The reach is deliberately narrow — DocLink refuses anything with a scheme, an absolute path, a
// bare fragment, an extension sidecar does not review, or a path that climbs out of the served root —
// so every other link keeps the behaviour it has today, including placing the caret in this
// contenteditable. The cost is that the text of one of these links is awkward to click into; the class
// added at render time at least says so with the cursor.
//
// Modifiers and non-left buttons bail, same as the panel, so cmd-click still opens a second tab.
$('doc').addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  const to = DocLink.route(a.getAttribute('href') || '', FILE);
  if (!to) return;
  e.preventDefault();
  openDoc(to.rel);
});
// Cmd/Ctrl+click opens a link in a new tab. A PLAIN click must keep placing the caret: this is a
// contenteditable, so hijacking every click would make the text around a link uneditable.
$('doc').addEventListener('click', (e) => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href') || '';
  // A document-relative link has no address the browser could open on its own: `./research.md` off
  // `/?f=…` resolves to a path this server does not serve. The tab gets the same `/?f=` URL the panel's
  // rows carry, which is what makes cmd-click mean the same thing in both places.
  const to = DocLink.route(href, FILE);
  if (to) {
    e.preventDefault();
    window.open('/?f=' + encodeURIComponent(to.rel), '_blank', 'noopener,noreferrer');
    return;
  }
  if (!/^https?:\/\//i.test(href)) return;   // outbound http(s) only — never javascript:/file paths
  e.preventDefault();
  window.open(href, '_blank', 'noopener,noreferrer');
});
// While Cmd/Ctrl is held, mark the doc so links show a pointer (see #doc.mod a[href]). Cleared on
// keyup AND on window blur — otherwise Cmd+Tab away leaves the modifier stuck "held" on return.
const setModHeld = (on) => $('doc').classList.toggle('mod', on);
window.addEventListener('keydown', (e) => { if (e.key === 'Meta' || e.key === 'Control') setModHeld(true); });
window.addEventListener('keyup', (e) => { if (e.key === 'Meta' || e.key === 'Control') setModHeld(false); });
window.addEventListener('blur', () => setModHeld(false));
// Resize changes both the text reflow and the desktop/mobile cutoff, so the docked layout is recomputed
// (or torn down, below 781px) on every resize. An asset frame also re-scales: its canvas is fixed, the
// column it has to fit into is not.
// Both panels' bounds are viewport-relative, so a resize also re-clamps them — without persisting,
// since narrowing the window is not the human changing their mind about how wide either should be.
// Crossing up out of the drawer breakpoint also drops an open drawer: on the desktop grid the panel is
// a column, and a leftover "open" would come back the next time the window narrowed.
window.addEventListener('resize', () => {
  if (!navIsDrawer() && navDrawerOpen()) document.body.classList.remove('nav-open');
  applyNavWidth(navWidth, false);
  applyRailWidth(restRail(), false);
  paintNavToggle();          // the button means "collapse" above the breakpoint and "open" below it
  if (isAsset()) sizeFrame();
  scheduleDock();
});
// Everything in the document that stands for this item: its prose highlights, or the diagram node
// standing in for them. One helper so jumping, flashing and docking can never disagree about where an
// item lives — they did, and a node comment flashed nothing while its card docked next to a paragraph.
function anchorEls(id) {
  const sel = cssId(id);
  const marks = [...$('doc').querySelectorAll('mark.anchor[data-id="' + sel + '"]')];
  return marks.length ? marks : [...$('doc').querySelectorAll('.fl-node.anchored[data-item-id="' + sel + '"]')];
}
function openReview(id) {
  toggleSheet(true);
  document.querySelectorAll('.flash').forEach(m => m.classList.remove('flash'));
  pulse(anchorEls(id));
  if (isAsset()) sendFrame('pulse', { id });
  const card = $('side').querySelector('.card[data-id="' + id + '"]');
  if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); pulse([card]); }
}
// Click a card's quote → jump to (and flash) its highlight in the doc.
function locate(id) {
  toggleSheet(false);
  markAnchors();
  document.querySelectorAll('.flash').forEach(m => m.classList.remove('flash'));
  // On an asset the flash happens inside the frame; the page can only scroll to the element's rect,
  // which it has from the picker's geometry.
  if (isAsset()) {
    sendFrame('pulse', { id });
    const r = frameRectFor(id);
    if (r) scrollTo({ top: Math.max(0, scrollY + r.top - innerHeight / 2), behavior: 'smooth' });
    return;
  }
  const marks = anchorEls(id);
  if (!marks.length) return;
  marks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
  pulse(marks);
}
// Hovering a card lights its element in the frame — the asset's answer to the highlight a text anchor
// already carries in the document. Delegated, because renderSide rebuilds every card.
$('side').addEventListener('mouseover', (e) => {
  if (!isAsset()) return;
  const card = e.target.closest && e.target.closest('.card[data-id]');
  sendFrame('highlight', { id: card ? card.dataset.id : null });
});
$('side').addEventListener('mouseleave', () => { if (isAsset()) sendFrame('highlight', { id: null }); });

boot();
</script>
</body>
