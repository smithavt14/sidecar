<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sidecar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The palette itself, as data: the eight built-in themes, the value grammar a reader's own theme file
     is checked against, and boot(). Synchronous and ahead of the stylesheet, because the stamp below
     calls it and the stylesheet declares no colour of its own — a theme is what puts the colours on the
     page. server.js requires the same file, so the page and the server agree on what a theme is. -->
<script src="/themes.js"></script>
<script>
  /* Theme, before the first paint. Every colour on the page is an inline custom property now, so this
     is not a hint about which way round the room is — it IS the palette, and it has to run here in
     <head> or the first frame has no colours at all.
     Themes.boot reads `sc:theme` (system / light / dark), then `sc:themeLight` or `sc:themeDark` for
     which theme wears that scheme, and wraps every storage access itself: Safari in private mode throws
     on localStorage and no preference is worth a blank page. The outer catch covers the rest and falls
     back to paper rather than leaving the page unpainted. */
  (function () {
    try { Themes.boot(document, localStorage); }
    catch (e) { try { Themes.apply(document.documentElement, Themes.BUILTIN.paper); } catch (e2) {} }
  })();
  (function () {
    var W = { narrow: '29em', default: '33em', wide: '39em' };
    var m;
    try { m = localStorage.getItem('sidecar.measure'); } catch (e) {}
    // hasOwnProperty, not a truth test: a stored `constructor` would otherwise resolve up the
    // prototype chain and set the column's width to a function.
    if (!Object.prototype.hasOwnProperty.call(W, m)) m = 'default';
    document.documentElement.dataset.measure = m;
    document.documentElement.style.setProperty('--measure', W[m]);
  })();
  /* The document's type size, before the first paint and for the same reason the theme is: a reader
     who set 20px and gets one frame of 16.5 watches the whole page reflow on every load. Four steps,
     the same four the header's control cycles, and the two lists have to stay identical. The stored value
     is the px number as a string, so retuning a step moves every browser that chose it.
     The MOBILE floor is not applied here. It belongs to a breakpoint, an inline style beats every
     media query, and a window dragged across 780px has to re-clamp with no listener watching it. So the
     floor is --prose-floor in the stylesheet and #doc takes the larger of the two. */
  (function () {
    var S = ['15', '16.5', '18', '20'];
    var p;
    try { p = localStorage.getItem('sc:proseSize'); } catch (e) {}
    if (S.indexOf(p) === -1) p = '16.5';
    document.documentElement.dataset.prose = p;
    document.documentElement.style.setProperty('--prose-size', p + 'px');
  })();
</script>
<script src="/anchor.js"></script>   <!-- the shared matcher; server requires the same file so both agree on occurrences -->
<script src="/serialize.js"></script>   <!-- the tight-diff serialize/reindex round-trip; Node tests require the same file -->
<script src="/flow.js"></script>   <!-- ```flow fences → SVG; pure string in/out, Node tests require the same file -->
<script src="/navsort.js"></script>   <!-- the directory panel's ordering; pure list in/out, Node tests require the same file -->
<script src="/doclink.js"></script>   <!-- does a link in the document open IN sidecar; pure string in/out, Node tests require the same file -->
<script src="/turn.js"></script>   <!-- whose turn is it: the panel's badges; server.js requires the same file -->
<script src="/stability.js"></script>   <!-- freeze / last known position / orphan grace for the docked rail; Node tests require the same file -->
<script src="/focus.js"></script>   <!-- where the page sits for the caret's line to rest at 45%; pure numbers in/out, Node tests require the same file -->
<script src="/listkeys.js"></script>   <!-- Enter / Backspace / Tab inside a list item; pure elements in/out, Node tests require the same file -->
<script src="/assetframe.js"></script>   <!-- an .html asset → the sandboxed frame's srcdoc; Node tests require the same file -->
<script src="/lib/marked/marked.min.js"></script>
<script src="/lib/dompurify/dist/purify.min.js"></script>   <!-- marked v12 has no sanitizer; scrub its HTML before it hits innerHTML (XSS) -->
<script src="/lib/diff/dist/diff.min.js"></script>
<script src="/lib/turndown/dist/turndown.js"></script>
<script src="/lib/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>
<style>
  /* sidecar design system — clean, modern, single-user. Distinct from the spktr neo-brutalist look:
     hairlines + soft depth shadows, no hard offset borders. One rule holds it together —
     YELLOW = THE AGENT. #ffeb00 appears only on claude's presence, its diffs, its anchors, and
     open-item dots. Never on you, never on a primary button. Ink does the work; chrome is lowercase.
     Source: claude.ai/design "Sidecar Review" spec.

     Two themes, one set of names. Every colour in this file comes from a token, and the dark palette
     redeclares the same tokens rather than adding a parallel set of rules — so a new rule is written
     once and follows the theme for free. A test scans the stylesheet for a hex that escaped.

     Sizes work the same way. The chrome reads six type steps (--t-1 … --t-6), three radii plus the
     pill (--r-1 … --r-3, --r-pill) and one caps tracking (--track-caps), all declared on :root below
     and all exempt from the palette test for the reason --doc-space-* already is: a size is a size in
     both themes. The document is on its own scale and stays there. Tests scan this file for a
     font-size, a `font:` shorthand or a border-radius that named a number instead of a step. */
  @font-face { font-family:'Geist'; font-weight:100 900; font-display:swap;
    src:url('/fonts/geist-latin.woff2') format('woff2'), url('/fonts/geist-latin-ext.woff2') format('woff2'); }
  /* ---------- what :root still carries ----------
     Not the palette. Every colour sidecar draws lives in public/themes.js, as one flat object of token
     values per theme, and is written onto <html> as inline custom properties before the first paint
     (see the stamp in <head>). So this file declares no colour anywhere: a rule names a token, a theme
     decides what the token is, and adding a ninth theme costs no CSS at all. A test scans this
     stylesheet for a hex or an rgb() that escaped into a rule.

     What is left here is everything that is the same in every theme, which is what it always was: the
     two panel widths, the document's measure and type size, the chrome's six type steps, its three
     radii and the pill, one uppercase tracking, and the press spring. A size is a size in every theme,
     and a theme file that could change one would be a palette resizing the tool. */
  :root {
    /* Release spring for pressable things. Solved from stiffness 500 / damping 30 / mass 0.6, which is
       zeta 0.87 — it overshoots by 0.4%, so the "pop" is the curve's shape rather than a bounce. A real
       bounce on a button you hit fifty times in a review would read as slop. */
    --spring-press:linear(0,0.088,0.266,0.457,0.624,0.754,0.849,0.913,0.954,0.979,0.993,1.001,1.004);
    /* The review rail's width, in one place: the grid track, the drag handle's position and the
       persisted preference are all this number. JS overwrites it on the root element. */
    --rail-w:372px;
    /* The directory panel's width, the same way. Two variables rather than one because the panel has
       a second resting size: --nav-w is the preference the human dragged to, --nav-track is what the
       grid actually gives it, which collapsing swaps for the bare edge without touching the
       preference underneath. */
    --nav-w:248px;
    --nav-track:var(--nav-w);
    /* The document's type size: four steps the header cycles, remembered per browser and stamped on
       <html> before the first paint (see the script in the head, which holds the same four). This is
       what a browser with nothing stored reads.
       The floor is the breakpoint's, not the reader's. #doc is contenteditable, iOS Safari zooms into
       an editable under 16px and never zooms back, so the phone takes the larger of the two. It is a
       token in the stylesheet rather than a clamp in the stamp because the stamp writes an inline
       style, which beats every media query, and a window dragged across 780px has to re-clamp. */
    --prose-size:16.5px;
    --prose-floor:0px;
    /* The reading measure: the width of the TEXT, the document's two 44px margins not included. One
       of three the header cycles; the inline script in the head sets it on <html> before the first
       paint, and this is what a browser with nothing stored reads. */
    --measure:33em;
    /* ---------- the chrome's type scale ----------
       Six steps for the header, the folder panel, the rail, the cards, the toolbar, the popover, the
       menus, the toasts, the sheet and the picker. The audit that produced it counted SIXTEEN sizes
       across one screen (8px to 22px, six of them on a half pixel), each justified in a comment of
       its own and none of them part of a series. A reader's eye settles into a ladder it can predict;
       it cannot settle into sixteen one-off decisions, however good each one was.
       The document is NOT on this scale and must not be put on it. Prose was tuned separately (16.5px
       body, 28/21/17 headings, --doc-space-*), against a measure and a line height this chrome has
       nothing to do with. Two scales, one per surface, is the point.
       Each step has a job, which is how six stayed six:
         --t-1  mono meta, timestamps, counts, uppercase micro-labels
         --t-2  small labels, chips, quoted spans, secondary rows
         --t-3  the workhorse: buttons, tabs, card body, nav rows, inputs, menus
         --t-4  chrome body, the toast, a file row's name
         --t-5  the wordmark, and the mobile form-field floor (iOS Safari zooms a field below 16px
                and never zooms back, so this step is load-bearing rather than decorative)
         --t-6  the picker's heading, the one line of chrome that is a title */
    --t-1:11px;
    --t-2:12px;
    --t-3:13px;
    --t-4:14px;
    --t-5:16px;
    --t-6:20px;
    /* ---------- and its radii ----------
       Fourteen distinct corners (2 through 22px, the 99px pill included) became three and the pill. They nest
       concentrically, which is the rule for deciding between them: a control inside a rounded
       container takes the container's radius less its padding, so a button in the 8px view switcher
       is --r-1 and a button in the 12px selection toolbar is --r-2.
         --r-1  inline code, small chips, controls inside a rounded container
         --r-2  buttons, inputs, nav rows, menus, message bubbles, wells
         --r-3  raised surfaces: a card, the popover, the toolbar, the toast, the sheet's top corners
         --r-pill  a true pill or a capsule badge; a dot stays `50%`, which is a circle rather than a
                   step on this scale */
    --r-1:4px;
    --r-2:8px;
    --r-3:12px;
    --r-pill:99px;
    /* One tracking for every uppercase micro-label in the tool. It ran from .03em to .13em across
       six labels that all do the same job. */
    --track-caps:.06em;
    /* `color-scheme` is not declared here. It moves with the palette, so Themes.apply sets it inline
       beside the tokens — one place decides which way round the page is, and native controls follow a
       reader's own dark theme as readily as they follow ink. */
  }
  * { box-sizing: border-box; }
  body { margin:0; font:var(--t-4)/1.6 'Geist', ui-sans-serif, system-ui, sans-serif; background:var(--bg);
    color:var(--fg); -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--yellow); color:var(--on-yellow); }
  /* The shell: the folder panel is a fixed column down the left of the WINDOW and everything else is
     inset past it. The panel used to be the grid's first track, which meant it started wherever main's
     centred cap happened to put it and ended wherever the tallest document did — a panel floating in
     the page rather than the frame the page sits in. Fixed and full height, it is the frame; the
     header and the document are its contents. The inset is one declaration on the body, so the page
     header, the document, the rail and the whole-tree picker all follow it without knowing about it. */
  @media (min-width: 781px) { body { padding-left:var(--nav-track); } }
  /* No open document means no folder to be in: the panel is not rendered (main is hidden with it), so
     the inset it reserves has to come off too. See boot's no-FILE branch. */
  body.no-nav { padding-left:0; }
  /* The content area's header, to the RIGHT of the panel and never over it. 52px, the same as the
     panel's own brand row, so one hairline runs unbroken across the top of the application — the
     measurement borrowed straight from Grant Developer's shell, where a two-pixel step between the
     rail's rule and the header's was the bug that made the two read as separate bars. */
  header { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
  /* 51px + the 1px rule = the same 52px band the panel's brand row is, rule included. Both are
     border-box, so the two hairlines land on the same pixel row and read as one line across the app. */
  .hwrap { position:relative; display:flex; align-items:center; gap:12px; height:51px; padding:0 20px; }
  /* The title group, bounded so it can never run under the presence readout. That readout is
     absolutely centred, so it exerts no pressure on the flow and a long path simply slid beneath it:
     an asset's long path and the word `claude` printed on top of each other at 1440. Half the
     bar, less the widest half a readout gets, is where the title has to stop. */
  .htitle { display:flex; align-items:center; gap:10px; min-width:0; flex:0 1 auto; }
  /* The bound is the readout's, so it holds only while there is a readout. With nobody watching, the
     title has the whole run up to the controls, which in a header squeezed between two panels is the
     difference between a filename and four letters of one. */
  .hwrap:has(.presence:not(:empty)) .htitle { max-width:calc(50% - 92px); }
  .hbrand { display:none; align-items:center; gap:8px; text-decoration:none; color:inherit; }
  body.no-nav .hbrand { display:flex; }
  /* The mark is an <img>, so its `currentColor` cannot see the page's tokens: an SVG used as an
     image paints against its own document, where currentColor is always black. A filter is the only
     hook the page has on an image's pixels, and the mark is one flat colour, so inverting it is
     exact rather than approximate. brightness trims pure white back to the ink the wordmark uses.
     One selector, because `data-theme` now carries the RESOLVED scheme in every case: the stamp writes
     `light` or `dark` on <html> whichever way the reader got there, so the media-query copy this rule
     used to need (for an install that had never chosen) has nothing left to cover. */
  .hbrand .mark, .nav-brand .mark { height:20px; width:auto; flex:none; display:block; }
  :root[data-theme="dark"] .hbrand .mark,
  :root[data-theme="dark"] .nav-brand .mark { filter:invert(1) brightness(.91); }
  .hbrand .wm, .nav-brand .wm { color:var(--ink); font:600 var(--t-5) 'Geist', ui-sans-serif, sans-serif; letter-spacing:-.02em; }
  .spacer { flex:1; }
  #status { font-size:var(--t-2); color:var(--faint); min-width:64px; text-align:right; }
  /* buttons — ink primary, thin-outline secondary, text ghost. Depth, not weight. */
  button { font:600 var(--t-3) 'Geist', ui-sans-serif, sans-serif; padding:8px 16px; border:1px solid var(--line-strong);
    border-radius:var(--r-2); background:var(--bg); color:var(--fg); cursor:pointer;
    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease,
               transform .2s var(--spring-press); }
  button:hover { background:var(--fill); }
  /* Compress on press, spring back on release. The press uses a plain fast ease-out on the way DOWN (a
     spring there fights the finger) and the spring only on the way back up, which is where the pop
     lives. That half is on every button, because every button is pressed.
     The hover LIFT is opt-in, and only the moves that decide something carry it: accept and reject on a
     card, send in the comment popover, the selection toolbar. On `button` at large it put a 2% jump
     under the pointer on every tab, breadcrumb segment, sort chip and zoom control in the
     tool, and seven rules existed to take it back off again. Pointer-gated: on touch there is no hover,
     and without the gate the scale sticks after a tap. */
  /* :not(:active) keeps the press below: .pop:hover alone outranks button:active in the cascade, so a
     pressed button would hold its lift instead of compressing. */
  @media (hover:hover) and (pointer:fine) { .pop:hover:not(:active) { transform:scale(1.02); } }
  button:active { transform:scale(.96); transition:transform .1s ease-out; }
  /* Dark buttons: a faint light edge so they read as a surface rather than a slab, and a faint white
     wash on hover instead of going darker (going darker on a near-black button reads as nothing). */
  button.primary { background:var(--ink-btn); color:var(--on-ink); border-color:var(--on-ink-edge);
    padding:8px 18px; }
  button.primary:hover { background:var(--ink-btn-hover); border-color:var(--on-ink-edge-strong); }
  button.ghost { border:none; background:none; color:var(--muted); font-weight:500; padding:8px 4px; }
  button.ghost:hover { color:var(--fg); background:none; }
  /* The only icon button in the tool — everything else here is a word. It sits in a row of text
     buttons, so it matches their ink and weight rather than announcing itself: 16px, currentColor,
     same 1.5 stroke as the wordmark. pointer-events:none on the svg keeps the delegated click
     dispatcher seeing the BUTTON as e.target, never the path inside it. */
  button.iconbtn { padding:7px 6px; line-height:0; }
  button.iconbtn svg { width:16px; height:16px; display:block; pointer-events:none; }
  /* ---------- the theme menu ----------
     The folder's sort switcher drawn a second time (#navSort), because it answers the same shape of
     question: a list where the chosen one is the only one worth reading at rest. Three parts. A row of
     three icon buttons for the MODE (system, light, dark), which is what the header button used to
     cycle. The themes themselves, grouped by scheme and each carrying a swatch of its own ground and
     ink, since a name is not a colour. And one action at the foot.
     The swatch's two colours are the theme's own tokens, set inline from themes.js — the one place in
     the tool where a colour on screen is not the ACTIVE palette's, and it has to be, or every swatch in
     the menu would be the same square. */
  #themeCtl { position:relative; display:flex; }
  #themeCtl .menu { position:absolute; top:calc(100% + 6px); right:0; min-width:186px; z-index:30;
    background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-2); box-shadow:var(--shadow);
    padding:4px; display:flex; flex-direction:column; gap:1px; max-height:74vh; overflow-y:auto; }
  #themeCtl .menu[hidden] { display:none; }
  #themeCtl .menu button { display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    white-space:nowrap; border:none; background:none; box-shadow:none; padding:6px 9px;
    border-radius:var(--r-1); color:var(--fg); font:500 var(--t-3) 'Geist', ui-sans-serif, sans-serif; }
  #themeCtl .menu button:hover { background:var(--fill); }
  #themeCtl .menu button[aria-checked="true"], #themeCtl .menu button[aria-pressed="true"] {
    font-weight:600; color:var(--ink); background:var(--fill); }
  /* The mode row: three icons across, so it reads as one control rather than three menu items. */
  #themeCtl .mode { display:flex; gap:2px; }
  #themeCtl .mode button { justify-content:center; padding:6px 0; line-height:0; color:var(--muted); }
  #themeCtl .mode button svg { width:15px; height:15px; display:block; pointer-events:none; }
  #themeCtl .mode button[aria-pressed="true"] { color:var(--ink); }
  #themeCtl .grp { padding:9px 9px 3px; color:var(--faint); text-transform:uppercase;
    letter-spacing:var(--track-caps); font:500 var(--t-1) 'Geist', ui-sans-serif, sans-serif; }
  #themeCtl .sw { flex:none; width:16px; height:16px; border-radius:var(--r-1); position:relative;
    display:block; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line-2); }
  #themeCtl .sw i { position:absolute; left:3px; right:3px; top:7px; height:2px; border-radius:var(--r-1);
    display:block; }
  #themeCtl .sep { height:1px; background:var(--line); margin:4px 2px; flex:none; }
  /* The page-width icon reads the state it sets: its two rules sit where the column's edges do.
     transform-box:fill-box so the scale is about the group's own bounds rather than the SVG origin. */
  #measureToggle .mwb { transform-box:fill-box; transform-origin:center; transition:transform .18s ease; }
  :root[data-measure="narrow"] #measureToggle .mwb { transform:scaleX(.62); }
  :root[data-measure="wide"] #measureToggle .mwb { transform:scaleX(1.18); }
  @media (prefers-reduced-motion: reduce) { #measureToggle .mwb { transition:none; } }
  /* Two columns: the document and the review. It FILLS the frame rather than being capped and centred
     inside it. The 1280 cap used to be here, and on a wide window it cost twice over: a dead band of
     nothing to the right of the cards, and cards squeezed to 372px while that band sat beside them.
     The measure the cap was protecting belongs to the DOCUMENT, so it is on the document (below), and
     what the document does not want goes to the rail (see autoRailWidth). */
  main { position:relative; display:grid; grid-template-columns: minmax(0,1fr) var(--rail-w); gap:0; }
  /* ---------- the divider between the document and the rail ----------
     Absolutely placed over the column boundary rather than given a grid track of its own, so the two
     tracks stay exactly what they were and nothing that measures the document column (sizeFrame,
     dockCards) sees a third participant. 11px of grab area straddling the aside's hairline; the 1px
     line it draws on hover is the only thing it adds visually. */
  #railGrip { position:absolute; top:0; bottom:0; right:calc(var(--rail-w) - 5px); width:11px; z-index:3;
    cursor:col-resize; touch-action:none; }
  #railGrip::after { content:''; position:absolute; top:0; bottom:0; left:5px; width:1px;
    background:var(--ink); opacity:0; transition:opacity .15s ease; }
  #railGrip:hover::after, #railGrip:focus-visible::after, body.rail-dragging #railGrip::after { opacity:.3; }
  #railGrip:focus { outline:none; }
  /* While dragging, the cursor has to hold everywhere (the pointer leaves the 11px strip immediately)
     and nothing may select. The asset frame is a separate document that would otherwise swallow the
     pointer the moment the drag crossed it. */
  body.rail-dragging, body.nav-dragging { cursor:col-resize; user-select:none; }
  body.rail-dragging iframe, body.nav-dragging iframe { pointer-events:none; }
  /* Collapsed: the rail's track is gone, so the document column measures wider — which is why
     toggleRail re-runs the same relayout a window resize does. The panel's track stays; collapsing
     the two panels is two independent decisions. */
  body.rail-collapsed main { grid-template-columns: minmax(0,1fr); }
  body.rail-collapsed aside, body.rail-collapsed #railGrip { display:none; }
  /* ---------- the rail at rest ----------
     A document with nothing open and nothing archived has no review to show, and 372px of white
     carrying two tabs and one grey sentence was the biggest thing on the page before anyone had done
     anything. So the track rests as a 12px hairline edge, the tab bar goes, and the document takes the
     width back. #doc's measure is capped and auto-margined, so it re-centres on its own.
     Done by overriding --rail-w ON THE BODY rather than with a second grid-template-columns: the
     track, the grip's position and the header's inset are all that one variable, so all three follow
     it, and the width JS wrote on :root is still there for the moment a card arrives.
     Desktop only, like the folder's collapsed edge: below the breakpoint the rail is a fixed sheet with no
     track to shrink, and hiding its tabs there would leave the pull-up pill opening an empty box. */
  @media (min-width: 781px) {
    body.rail-bare { --rail-w:12px; }
    body.rail-bare aside { padding-left:0; padding-right:0; }
    body.rail-bare .tabs, body.rail-bare #railGrip { display:none; }
    /* The track animates across this one change and nowhere else. Left on `main` permanently the same
       transition would lag every drag of the grip and every window resize, which move --rail-w too. */
    body.rail-animating main { transition:grid-template-columns .22s ease; }
  }
  /* The rail's toggle: an icon button in the header chrome. Its badge is the agent's yellow, because
     what it counts is the agent's notes arriving while the panel was shut. */
  #railToggle { position:relative; }
  #railToggle .n { position:absolute; top:1px; right:-2px; min-width:14px; height:14px; padding:0 3px;
    border-radius:var(--r-pill); background:var(--yellow); color:var(--on-yellow); box-shadow:0 0 0 1.5px var(--bg);
    font:600 var(--t-1)/14px 'Geist', ui-sans-serif, sans-serif; text-align:center; }
  #railToggle .n:empty { display:none; }
  /* ---------- reading mode ----------
     Two axes, and this is the second one. Typewriter scrolling answers "where does the active line
     sit"; reading mode answers "what else is on screen", which is the split iA Writer, Ulysses,
     Typora and Byword all make and the reason it is a separate control rather than a mode that does
     both. Alex reads a draft straight through before deciding anything on it, and every card, mark,
     badge and panel in the frame is an invitation to decide something.
     Both tracks collapse to zero rather than being removed, because a track that stops existing
     cannot animate: --nav-track and --rail-w already drive the body's inset, the grid's second
     column, the header's right margin and both grips, so setting the two numbers moves all of it,
     and `main` interpolates a width where it could not interpolate a missing column. The panels
     themselves fade out over the same 220ms; they are 0px wide by then, and their own overflow
     clips what is inside.
     Nothing here persists. Reading mode is a thing you are doing right now, not a way you have
     configured the tool, so it always starts off (see setReading: there is no store write). */
  /* The second selector is not a duplicate: `body.nav-collapsed` pins --nav-track to the collapsed
     edge further down this file, and a single-class rule up here would lose to it on source order, so
     a reader who had minimized the folder got a band down the left of reading mode. */
  body.reading, body.reading.nav-collapsed { --nav-track:0px; --rail-w:0px; }
  body.reading #navGrip, body.reading #railGrip, body.reading #navBackdrop { display:none; }
  body.reading #nav, body.reading aside { opacity:0; pointer-events:none; overflow:hidden; }
  body.reading aside { padding-left:0; padding-right:0; }
  /* The bar keeps its height and its place, so the column does not jump 52px when the mode changes,
     and it keeps exactly one control: the way back out. Everything else in it belongs to a decision. */
  body.reading header { background:transparent; border-bottom-color:transparent; }
  body.reading .hwrap > *:not(#readingToggle):not(.spacer) { display:none; }
  /* The marks are the review showing through the prose. The rule stays in the DOM, where markAnchors,
     the click handler and dockCards all still find it. It simply stops painting. */
  body.reading mark.anchor { border-bottom-color:transparent; background:transparent; box-shadow:none; }
  body.reading #seltool { display:none; }
  /* The animation, on for the 260ms either side of the change and never left on: the same rule
     `rail-animating` follows, and for the same reason: a permanent transition on --rail-w would lag
     every drag of a grip and every window resize. */
  body.reading-animating { transition:padding-left .22s ease; }
  body.reading-animating main { transition:grid-template-columns .22s ease; }
  body.reading-animating #nav, body.reading-animating aside { transition:opacity .22s ease; }
  body.reading-animating header { transition:background .22s ease, border-color .22s ease; }
  @media (prefers-reduced-motion: reduce) {
    body.reading-animating, body.reading-animating main,
    body.reading-animating #nav, body.reading-animating aside,
    body.reading-animating header { transition:none; }
  }
  /* Typewriter's icon carries its own state, since there is no column to watch move: pressed is the
     page's ink against the chrome's grey. */
  #typewriterToggle[aria-pressed="true"] { color:var(--ink); }
  /* …and the document gets the room its last line needs. 45% of the window means 55vh of space below
     the caret, and #doc rests at 40vh (42vh on a phone), so the final paragraph topped out at 60% and
     the clamp ate the difference. Only while the mode is on: 58vh of blank under every document is a
     tax on reading one. Both breakpoints in one rule, since it outranks either #doc. */
  body.typewriter #doc { padding-bottom:58vh; }
  /* ---------- the directory panel ----------
     The folder the open document lives in, listed — and the application's frame. Fixed to the window
     rather than sitting in main's grid: full height, its own ground, one hairline down its right
     edge. It scrolls in its own box, because nothing in here has to stay level with the text and a
     folder of sixty documents would otherwise run the page's scroll height off the bottom of a short
     one. */
  #nav { position:fixed; top:0; left:0; bottom:0; width:var(--nav-track); z-index:32; overflow-y:auto;
    display:flex; flex-direction:column; min-width:0;
    padding:0 0 28px; border-right:1px solid var(--line); background:var(--shell); }
  /* The panel's chrome, sticky over its own list: a sixty-document folder otherwise scrolls its own
     controls away, and the panel scrolls itself to the open document on load. Opaque, so nothing
     shows through above it. */
  .nav-head { position:sticky; top:0; z-index:4; background:var(--shell);
    display:flex; flex-direction:column; }
  /* The brand row. The wordmark and the control that minimizes the panel sit together at the top of
     the frame, which is where Grant Developer puts its own wordmark and rail trigger — and it is what
     turns the panel from a column hung off the left edge into the application's first region. 52px and
     a hairline, matching the content header's to the pixel so the two rules meet as one line. */
  .nav-brand { display:flex; align-items:center; gap:8px; height:52px; flex:none; padding:0 10px 0 14px;
    border-bottom:1px solid var(--line); }
  .nav-brand .home { display:flex; align-items:center; gap:8px; min-width:0; text-decoration:none;
    color:inherit; border-radius:var(--r-2); padding:3px 5px; margin-left:-5px; transition:background .15s ease; }
  .nav-brand .home:hover { background:var(--shell-row); }
  /* 28px square, the trigger's size in GD's shell, and the same quiet ink so it reads as chrome. */
  #navCollapse, #navExpand { flex:none; margin-left:auto; width:28px; height:28px; padding:0;
    display:flex; align-items:center; justify-content:center; color:var(--faint); border-radius:var(--r-2); }
  #navCollapse:hover, #navExpand:hover { color:var(--ink); background:var(--shell-row); }
  /* Everything under the brand row that is still chrome: the path, then the list's label and its
     ordering control. Gone when the panel is collapsed. */
  .nav-nav { display:flex; flex-direction:column; gap:2px; padding:11px 8px 4px; }
  /* The folder, as a menu. It was a one-line breadcrumb that overflowed to the left behind a fade, and
     at the width this panel runs at that left two segments on screen: the rest of the path could be
     neither read nor clicked. The row now names the folder the list belongs to, which is the one
     segment that has to be read at rest, and the button opens the OPEN DOCUMENT's whole path as a
     list, root first and indented by depth, every level live. Stepping up is a shallower row and
     coming back down is a deeper one, which is what the breadcrumb was for. Same chip and menu as the
     sort beside it, because it answers the same shape of question. */
  #navPath { position:relative; flex:1 1 auto; min-width:0; }
  #navPath .pathbtn { display:flex; align-items:center; gap:5px; max-width:100%;
    border:none; background:none; box-shadow:none; padding:2px 4px; border-radius:var(--r-1);
    color:var(--ink-2); font:600 var(--t-1)/1.6 'Geist Mono', ui-monospace,SFMono-Regular,Menlo,monospace; }
  #navPath .pathbtn:hover { background:var(--shell-row); color:var(--ink); }
  #navPath .pathbtn #navPathLabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #navPath .pathbtn .car { flex:none; font-size:var(--t-1); opacity:.5; }
  #navPath .menu { position:absolute; top:calc(100% + 5px); left:0; min-width:100%; max-width:min(320px, 80vw);
    z-index:6; background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-2);
    box-shadow:var(--shadow); padding:4px; display:flex; flex-direction:column; gap:1px; }
  #navPath .menu[hidden] { display:none; }
  #navPath .menu button { display:block; width:100%; text-align:left; border:none; background:none;
    box-shadow:none; padding:6px 9px; border-radius:var(--r-1); color:var(--fg);
    font:500 var(--t-2) 'Geist Mono', ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #navPath .menu button:hover { background:var(--fill); }
  #navPath .menu button[aria-checked="true"] { font-weight:600; color:var(--ink); background:var(--fill); }
  /* The list's ordering control, on a row of its own. It used to share the row with an uppercase
     DOCUMENTS micro-label, borrowed from a rail that has two sections to tell apart (GD's WORK and
     ORGANIZATION). This panel has one: the files view is the only thing the label ever sat over, and
     the tab above it already reads `files`. A section label naming the only section is decoration. */
  .nav-sect { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 5px 3px 1px; }
  /* the sort switcher — a menu, not three tabs: at 248px three labels have nowhere to sit, and the
     one that is chosen is the one worth reading. It is drawn as a CONTROL: an outlined chip with a
     caret, which is what a bare lowercase word sitting on the panel's ground could never say. */
  #navSort { position:relative; flex:none; }
  #navSort .sortbtn { display:flex; align-items:center; gap:5px; max-width:112px;
    border:1px solid var(--line-2); background:var(--card); box-shadow:none;
    color:var(--fg); font:500 var(--t-2) 'Geist', ui-sans-serif, sans-serif; padding:2px 6px; border-radius:var(--r-2); }
  #navSort .sortbtn:hover { background:var(--fill); border-color:var(--line-strong); color:var(--ink); }
  #navSort .sortbtn #navSortLabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #navSort .sortbtn .car { flex:none; font-size:var(--t-1); opacity:.5; }
  #navSort .menu { position:absolute; top:calc(100% + 5px); right:0; left:auto; min-width:132px; z-index:6;
    background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-2); box-shadow:var(--shadow);
    padding:4px; display:flex; flex-direction:column; gap:1px; }
  #navSort .menu[hidden] { display:none; }
  #navSort .menu button { display:block; width:100%; text-align:left; white-space:nowrap; border:none;
    background:none; box-shadow:none; padding:7px 9px; border-radius:var(--r-1); color:var(--fg);
    font:500 var(--t-3) 'Geist', ui-sans-serif, sans-serif; }
  #navSort .menu button:hover { background:var(--fill); }
  #navSort .menu button[aria-checked="true"] { font-weight:600; color:var(--ink); background:var(--fill); }
  .nav-list { display:flex; flex-direction:column; gap:1px; padding:0 8px; }
  /* An icon-led row, GD's rail item measured across: the --t-3 label, a 15px glyph, 9px of horizontal
     padding on --r-2. Its 6px of vertical padding lands a 31px row, compact enough that a project
     folder is one glance. */
  .nav-list a { display:flex; align-items:center; gap:8px; min-width:0; padding:6px 9px; border-radius:var(--r-2);
    text-decoration:none; color:var(--fg); font-size:var(--t-3); line-height:1.45; }
  .nav-list a .ic { flex:none; width:15px; height:15px; display:block; color:var(--faint); }
  .nav-list a:hover { background:var(--shell-row); color:var(--ink); }
  .nav-list a:hover .ic { color:var(--muted); }
  /* the open document: filled and inked, no accent bar. The panel is chrome and stays monochrome —
     yellow belongs to the agent. */
  .nav-list a.on { background:var(--shell-on); color:var(--ink); font-weight:600; }
  .nav-list a.on .ic { color:var(--ink); }
  .nav-list a .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* The row's right edge, kept as a slot rather than as whatever happens to be there: the sort's
     timestamp today, the your-turn badge next. GD's rail counts sit in exactly this position. */
  .nav-list a .meta { flex:none; margin-left:auto; display:flex; align-items:center; gap:6px;
    font-family:'Geist Mono', ui-monospace, monospace; font-size:var(--t-1); font-weight:400; color:var(--faint); }
  .nav-list a .meta:empty { display:none; }
  .nav-empty { padding:10px; margin:0 8px; color:var(--muted); font-size:var(--t-2); line-height:1.45; }
  /* ---------- the your-turn badge ----------
     The count of items on a document that are waiting on the HUMAN (public/turn.js). Yellow, because
     yellow is the agent everywhere in this tool and a badge here means the agent is holding something
     out to you. A document with open items that are NOT your turn gets the neutral dot instead: still
     live, but the next move is the agent's, and drawing that in the same colour would make the whole
     folder look like a to-do list.
     The same pill as #railToggle's unread count, which is the other place a number means "look here". */
  .nav-list a .meta .nb { flex:none; }
  .nav-list a .meta .nb.turn { min-width:16px; height:16px; padding:0 4px; border-radius:var(--r-pill);
    background:var(--yellow); color:var(--on-yellow); box-shadow:0 0 0 1px var(--yellow-ring);
    font:600 var(--t-1)/16px 'Geist', ui-sans-serif, sans-serif; text-align:center; }
  .nav-list a .meta .nb.dot { width:6px; height:6px; margin:0 5px; border-radius:50%;
    background:var(--fainter); }
  .nav-list a.on .meta .nb.dot { background:var(--muted); }
  /* the handle between the panel and the document — the rail's grip mirrored, same 11px of grab area
     straddling the hairline, same reason it is placed over the boundary rather than given a track.
     Fixed now, because the boundary it straddles belongs to the window rather than to main. */
  #navGrip { position:fixed; top:0; bottom:0; left:calc(var(--nav-track) - 6px); width:11px; z-index:33;
    cursor:col-resize; touch-action:none; }
  #navGrip::after { content:''; position:absolute; top:0; bottom:0; right:5px; width:1px;
    background:var(--ink); opacity:0; transition:opacity .15s ease; }
  #navGrip:hover::after, #navGrip:focus-visible::after, body.nav-dragging #navGrip::after { opacity:.3; }
  #navGrip:focus { outline:none; }
  /* The panel's own control lives in its header, so the page header carries one only where the panel
     is a drawer and its header is off screen with it. */
  #navToggle, #navExpand { display:none; }
  /* The collapsed edge's own, shown only there (see the collapsed block below). */
  #navStripWaiting { display:none; }
  /* ---------- collapsed: a bare edge ----------
     It used to be a 48px icon strip: one initial per document, each wearing its own unread dot. That
     is the folder drawn a second time in a letter nobody can read, and it was the first thing Alex
     called distracting. Minimizing the folder is a request for the folder to go, so it goes. What is
     left is the same idea as the review rail at rest: a hairline edge that gets out of the way, one
     control wider because the way back out has to stay clickable.
     Two things draw. The expand handle, at the top where an IDE's activity bar puts it, brightening
     when the pointer is anywhere on the edge. And, only when something in the folder is waiting on
     you, the count. Nothing else moves, and nothing else is there to.
     Desktop only: down at the drawer breakpoint the panel is a fixed overlay with no track to shrink,
     so these rules are scoped rather than undone one by one below. The rail learned that lesson the
     expensive way. */
  @media (min-width: 781px) {
    body.nav-collapsed { --nav-track:34px; }
    body.nav-collapsed #navGrip, body.nav-collapsed .nav-nav { display:none; }
    body.nav-collapsed .nav-brand { padding:0; justify-content:center; }
    body.nav-collapsed .nav-brand .home { display:none; }
    body.nav-collapsed #navCollapse { display:none; }
    body.nav-collapsed #navExpand { display:flex; margin-left:0; }
    /* The list and the empty state go. Expanding restores them. */
    body.nav-collapsed .nav-list, body.nav-collapsed .nav-empty { display:none; }
    /* The pointer anywhere on the edge inks the handle, so a 34px band still says it is a control. */
    body.nav-collapsed #nav:hover #navExpand { color:var(--ink); }
    /* The one number the edge keeps: what is waiting on you across the whole folder, the sum of the
       rows' own badges. Clicking it opens the panel, where those badges say which documents. renderNav
       hides the button outright at zero (see the [hidden] rule) rather than leaving an empty pill,
       which would be a control that does nothing. */
    body.nav-collapsed #navStripWaiting { display:flex; align-self:center; width:auto; height:auto;
      margin:9px 0 0; padding:0; border-radius:var(--r-pill); }
    body.nav-collapsed #navStripWaiting[hidden] { display:none; }
        body.nav-collapsed #navStripWaiting .n { min-width:18px; height:18px; padding:0 5px;
      border-radius:var(--r-pill); background:var(--yellow); color:var(--on-yellow);
      font:600 var(--t-1)/18px 'Geist', ui-sans-serif, sans-serif; text-align:center; }
  }
  /* The document itself is the editor: edit rich text in place, no mode switch, no chrome. */
  /* pwd — the document's path, and the content header's title. It sits IN the header now rather than
     floating above the prose, which is what the shell asks for: the panel says which folder, the
     header says which document. The FOLDERS are what give way when the row is tight, the filename
     never — a path ellipsised from the right hides the one word that names what is open. */
  #pwd { display:flex; align-items:baseline; min-width:0; flex:0 1 auto;
    font-family:'Geist Mono', ui-monospace,SFMono-Regular,Menlo,monospace; font-size:var(--t-2); letter-spacing:0; }
  /* When the name has to give, it ellipsises inside its own box rather than printing under the
     controls beside it. */
  #pwd .file { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--ink); font-weight:600; }
  #pwd:empty { display:none; }
  /* The document's own measure, and the only place a measure is now capped. The cap is the TEXT's
     width plus the two 44px reading margins, and the text's width is a variable: three page widths
     the header cycles, remembered per browser and applied before the first paint.
     The three are stated in `em` rather than `ch`. The target is the 45 to 75 characters iA, Bear and
     Medium settle on, and Geist's zero is .66em wide, so a `ch` count overstates a line of real prose
     by about a third: 68ch of Geist is 744px and 96 characters, which is roughly the measure this
     replaces. Counted character by character down a real document at 16.5px, 29em is 479px and 58
     characters, 33em is 545px and 66, and 39em is 644px and 80.
     Centred in its column, because once the rail has stopped growing the slack is symmetric margin
     around the text and never a band on one side of it.
     The `em` is also what keeps the measure honest across the four type steps. It resolves against
     #doc's OWN size, so stepping the type up widens the column and the line still holds 66
     characters, rather than holding the column still and losing a third of them.
     --doc-size is the size the document actually draws at: the step the reader chose, floored by the
     breakpoint. Everything below is a multiple of it, which is what makes one control move the whole
     document rather than only its body copy. */
  #doc { --doc-size:max(var(--prose-size), var(--prose-floor));
    /* The vertical scale. One body line is 1.6 × --doc-size, and every gap between two blocks in #doc
       is a multiple of it. Four steps carry the whole document: before this, a paragraph gap, a
       heading's air and a code block's margin were three unrelated numbers and the page had no rhythm
       to read by. They are declared HERE rather than on :root so the multiplication happens once,
       against the document's own size, and what every block inherits is already pixels. A gap left in
       `em` would resolve against the h1 it sits above and open two headings' worth of air. */
    --doc-space-0:calc(var(--doc-size) * .4);    /* a quarter line: between two items of one list */
    --doc-space-1:calc(var(--doc-size) * .8);    /* half a line: under a heading */
    --doc-space-2:calc(var(--doc-size) * 1.6);   /* one line: between any two blocks */
    --doc-space-3:calc(var(--doc-size) * 2.4);   /* one and a half: above an h2, and around a rule */
    --doc-space-4:calc(var(--doc-size) * 3.2);   /* two: above an h1 */
    max-width:calc(var(--measure) + 88px); margin:0 auto; padding:30px 44px 40vh; min-width:0;
    outline:none; caret-color:var(--ink); color:var(--fg); font-size:var(--doc-size); line-height:1.6; }
  /* An ASSET is not prose and has no reason to inherit the measure. A 1600px artboard read inside 820
     of text column is read at half size, and half of a design is a different design — the type is
     unreadable and the spacing is a guess. So the cap comes off, and the column the two panels leave
     is the asset's to fill.
     The cap is lifted on the element that CARRIES it rather than the asset breaking out of it. A
     breakout wrapper would have to reconstruct the column width it is escaping (negative margins
     against a track that two independently draggable panels move, plus a breakpoint where both
     become overlays), and #doc already is that column — there is nothing to escape, only a measure
     that prose asked for and a picture did not. The gutter narrows with it: the frame draws its own
     edge, so the 44px reading margin is 40px of scale spent on nothing. */
  #doc.asset { max-width:none; padding-left:24px; padding-right:24px; }
  /* Stable asset space keeps the final fragment and its history position reachable. Match the
     typewriter rule's specificity so a prose preference cannot shorten an asset's scroll room. */
  body #doc.asset { padding-bottom:100vh; }
  #doc:focus, #doc *:focus { outline:none; }
  /* ---------- one vertical scale for every block in the document ----------
     Each markdown token renders inside its own .block wrapper, so this reaches the paragraph, heading
     or list inside one. Space is carried BELOW a block; a heading's own top margin is the exception,
     and it is what opens a section. Adjacent margins collapse, so a bottom-only scale makes the gap
     between two blocks the LARGER of the two rather than their sum, and a heading can sit far from
     what comes before it and close to what it introduces.
     What was here before: no paragraph spacing at all, .4em falling out of the .block rule, h1 and h2
     on em margins of their own sizes, and h3 declaring none. Four numbers from one scale replace it. */
  #doc > * > * { margin:0 0 var(--doc-space-2); }
  /* The first block in the document sits against the padding, never a heading's two lines below it. */
  #doc > :first-child, #doc > :first-child > * { margin-top:0; }
  /* The headings are RATIOS of the body, so the whole document steps together: 1.697 / 1.2727 /
     1.0303 are the 28 / 21 / 17 the reading column was tuned at, over its 16.5. `em` on a font-size
     resolves against the parent, which is the .block wrapper and so the document's own size. */
  #doc h1 { font-size:1.697em; line-height:1.25; font-weight:600; letter-spacing:-.03em; color:var(--ink);
    margin:var(--doc-space-4) 0 var(--doc-space-1); }
  /* The rule under an h2 is gone with its 7px of padding. A section break drawn twice (a size jump and
     a line) is one more horizontal in a document that already has tables and a horizontal rule, and
     the space above the heading says the same thing without drawing anything. */
  #doc h2 { font-size:1.2727em; line-height:1.3; font-weight:600; letter-spacing:-.02em; color:var(--ink);
    margin:var(--doc-space-3) 0 var(--doc-space-1); }
  #doc h3 { font-size:1.0303em; line-height:1.35; font-weight:600; letter-spacing:-.01em; color:var(--ink);
    margin:var(--doc-space-2) 0 var(--doc-space-1); }
  #doc ul, #doc ol { padding-left:var(--doc-space-2); }
  #doc li + li { margin-top:var(--doc-space-0); }
  #doc li > ul, #doc li > ol { margin:var(--doc-space-0) 0 0; }
  #doc li > p { margin:0 0 var(--doc-space-1); }
  #doc li > :last-child { margin-bottom:0; }
  #doc hr { height:0; border:0; border-top:1px solid var(--line); margin:var(--doc-space-3) 0; }
  #doc pre { background:var(--fill); padding:13px 16px; border-radius:var(--r-2); overflow-x:auto;
    font:.85em/1.6 'Geist Mono', ui-monospace, Menlo, monospace; margin:0 0 var(--doc-space-2); }
  #doc code { background:var(--fill); padding:1px 5px; border-radius:var(--r-1); font-size:.9em;
    font-family:'Geist Mono', ui-monospace, Menlo, monospace; }
  #doc pre code { padding:0; background:none; }
  #doc img { max-width:100%; height:auto; }
  /* ---------- atomic blocks: a rendered diagram or a raw-HTML island ----------
     These are contenteditable=false (set in renderDoc, not in the markup — DOMPurify strips the
     attribute). They can't be typed into, so turndown never gets the chance to flatten an SVG back
     into its bare label text, which is what it does to any HTML it doesn't understand. */
  /* The wrapper carries no margin of its own: the diagram or island INSIDE it takes the one line every
     other block gets from the scale above, and collapses it out through here. One number, one place. */
  #doc .block[data-atomic] { position:relative; margin:0; }
  #doc .block[data-atomic]:focus-within, #doc .block[data-atomic]:focus { outline:none; }
  /* A diagram is only worth drawing at a size its labels can be read at. `max-width:100%` alone
     shrank a six-node flow to fit a phone and produced 5px text — the picture was there and said
     nothing, which Alex hit reading a brief on his phone. So the SVG keeps a MIN-WIDTH (set in
     renderAtomic from its own intrinsic width and the smallest label size still worth reading) and
     this box scrolls sideways when the two conflict. min-width beats max-width in CSS, which is the
     whole mechanism: a diagram that fits legibly still shrinks to the column, and one that cannot
     stops shrinking and starts scrolling. */
  .fl-scroll { overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch; }
  .fl { display:block; max-width:100%; height:auto; margin:0 auto; }
  .fl-box { fill:var(--card); stroke:var(--line-strong); stroke-width:1.25; }
  .fl-label { font:var(--t-3)/1 'Geist', ui-sans-serif, system-ui, sans-serif; fill:var(--ink); text-anchor:middle; }
  .fl-edge { stroke:var(--line-2); stroke-width:1.5; fill:none; }
  .fl-head { fill:var(--line-2); }
  .fl-elabel { font:var(--t-1)/1 'Geist', ui-sans-serif, system-ui, sans-serif; fill:var(--muted); text-anchor:middle; }
  .fl-elabel-bg { fill:var(--bg); }
  /* a node is the click target — the affordance has to be visible before the click, or nobody finds it */
  .fl-node { cursor:pointer; }
  .fl-node:hover .fl-box, .fl-node:focus .fl-box { stroke:var(--ink); fill:var(--fill); }
  .fl-node:focus { outline:none; }
  /* an open comment on a node: the same yellow that marks the agent's anchors in prose */
  .fl-node.anchored .fl-box { stroke:var(--yellow-ring); stroke-width:2; }
  /* the flash on jump. `box-shadow` does nothing inside SVG, so this is the fill instead */
  .fl-node.flash .fl-box { fill:var(--flash-fill); stroke:var(--yellow-ring); stroke-width:2.5; }
  .fl-errors { margin-top:8px; text-align:center; font:var(--t-2)/1.45 'Geist Mono', ui-monospace, Menlo, monospace;
    color:var(--muted); }
  /* the one thing that tells you the boxes are live; hidden on touch, where hover doesn't exist */
  .fl-hint { position:absolute; right:0; top:-18px; font-size:var(--t-1); color:var(--faint);
    opacity:0; transition:opacity .15s; pointer-events:none; }
  #doc .block[data-atomic]:hover .fl-hint { opacity:1; }
  @media (hover:none) { .fl-hint { display:none; } }
  /* ---------- the asset frame ----------
     An .html asset renders in a sandboxed iframe at its NATURAL size, scaled down to the document
     column with a transform (see sizeFrame). The wrapper carries the scaled height, because a
     transform does not change layout size and the page would otherwise scroll to the unscaled one. */
  #doc .asset-wrap { position:relative; margin:10px 0 0; }
  /* At 100% nothing is scaling the canvas any more, so a design wider than the column overflows for
     real. The WRAPPER takes that scroll, never the page: a body scrolling sideways moves the header,
     the rail and every docked card with it. `overscroll-behavior-x` keeps a trackpad swipe that runs
     out of asset from becoming the browser's back gesture. */
  #doc .asset-wrap.zoomed { overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch; }
  /* The artboard is PAPER: white in both themes. An asset is someone's own design and usually
     paints its own ground; a dark backing would show through the gaps in one built for white and
     change the thing being reviewed. */
  /* margin:0 because the prose scale reaches every child of a #doc block and an asset is not prose. */
  #doc iframe.asset-frame { display:block; border:0; transform-origin:top left; margin:0; background:var(--asset-canvas);
    border-radius:var(--r-3); box-shadow:var(--shadow); }
  /* The asset's zoom is one icon among the view controls, and its ink is its whole state, the way the
     typewriter toggle's is: pressed is natural size, the chrome's grey is fit. */
  #zoomToggle[hidden] { display:none; }
  #zoomToggle[aria-pressed="true"] { color:var(--ink); }
  /* What a click in an asset would land on. It used to be written into the header's status slot,
     where a label as long as a sentence pushed every control in the bar to the left and ran the
     cluster into the title. Down here it moves nothing: fixed to the foot of the document column, the
     corner a browser names a link's destination in. pointer-events:none, because it sits over the
     asset and must never be the thing a pick lands on. */
  #hoverHint { position:fixed; left:0; bottom:12px; z-index:15; max-width:min(420px, calc(100vw - 24px));
    padding:4px 9px; border-radius:var(--r-1); background:var(--card); border:1px solid var(--line-2);
    box-shadow:var(--shadow-raise); color:var(--muted); pointer-events:none;
    font:500 var(--t-1) 'Geist Mono', ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hoverHint:empty { display:none; }
  body.reading #hoverHint { display:none; }
  /* A table is the one block that cannot always be squeezed into a reading measure, and a body that
     scrolls sideways takes the header, the rail and every docked card with it. So the table scrolls in
     its own box: it is as wide as its content wants, up to the column, and past that it carries the
     overflow itself. */
  #doc table { display:block; width:max-content; max-width:100%; overflow-x:auto;
    border-collapse:collapse; margin:0 0 var(--doc-space-2); }
  #doc td, #doc th { border:1px solid var(--line-2); padding:7px 11px; font-size:.909em; }
  /* a document blockquote is CONTENT, not the agent — keep it monochrome (yellow is reserved) */
  #doc blockquote { border-left:2px solid var(--line-2); margin:0 0 var(--doc-space-2);
    padding-left:var(--doc-space-1); color:var(--muted); }
  #doc blockquote p { margin:0 0 var(--doc-space-1); }
  #doc blockquote > :last-child { margin-bottom:0; }
  /* an in-doc hyperlink is distinct from an agent anchor (2px yellow underline) — ink, quiet underline */
  #doc a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--line-strong);
    text-underline-offset:2px; }
  #doc a:hover { text-decoration-color:var(--ink); }
  /* An outbound link opens only while Cmd/Ctrl is held (a plain click has to place the caret in a
     contenteditable), so show the pointer exactly then — same convention as an editor's ctrl+click. */
  #doc.mod a[href] { cursor:pointer; text-decoration-color:var(--accent, var(--ink)); }
  /* A link to another document in this root is the exception: a plain click opens it in place, so it
     points like a link at all times. Every other link keeps the caret the rest of the surface has. */
  #doc a.xdoc { cursor:pointer; }
  /* No margins here: the wrapper is transparent to the scale above, which puts the space on the block
     itself and lets it collapse out through this element. The .4em pair that used to live here was
     where a paragraph's spacing actually came from, a quarter of a line and nobody's decision. */
  .block { position:relative; }
  /* Persistent cue: an open item WASHES its span rather than ruling a line under it. The 2px solid
     #ffeb00 this replaced was the loudest element on a near-monochrome page, and it sat inside the
     reading column, under prose. Bear's red and iA's blue are watermarks (a cursor, a link) and
     neither draws a rule under a sentence. So the colour drops to a low-alpha fill that follows the
     dot convention (the agent's spans yellow, yours ink-tinted) and the underline becomes the HOVER
     state, where the link between one span and one card has to be explicit. `.lit` is that same state
     driven from the other end: the pointer over the card in the rail.
     It must still cost the line NOTHING, because the same text is read and edited in place and a mark
     that added a pixel would reflow the paragraph the moment a comment landed on it. A border on an
     inline box does not enter the line box, which is why the underline is one and why it is declared
     transparent at rest rather than added on hover; the horizontal padding that used to sit here did
     move the text, and `color:inherit` holds off the UA's own `mark` colour. */
  mark.anchor { background:var(--anchor-wash); color:inherit; border-bottom:2px solid transparent;
    padding:0; cursor:pointer; border-radius:var(--r-1);
    transition:background .15s ease, border-color .15s ease; }
  mark.anchor.mine { background:var(--anchor-wash-mine); }
  mark.anchor:hover, mark.anchor.lit { border-bottom-color:var(--yellow); }
  mark.anchor.mine:hover, mark.anchor.mine.lit { border-bottom-color:var(--ink); }
  mark.anchor.flash { background:var(--flash-fill); box-shadow:0 0 0 3px var(--flash-ring); }
  /* The rail scrolls WITH the page rather than in its own scroll box. That's what lets a card sit level
     with the text it's about (see dockCards): two independent scrollers can't stay aligned without a
     scroll handler, and one shared scroll context needs none. The mobile sheet below re-adds its own
     height + overflow, since there it really is a separate scrolling surface. */
  aside { border-left:1px solid var(--line); padding:22px 20px; display:flex; flex-direction:column; gap:0;
    background:var(--bg); }
  /* review-rail tabs: active threads ↔ archived threads. Sticky to the PAGE now (under the 52px header),
     so the tabs and their counts stay reachable however far down the document you are.
     The padding is an OPAQUE buffer (no transparent margin/gap) so scrolling cards can't crowd under it. */
  .tabs { position:sticky; top:52px; z-index:2; display:flex; gap:2px; margin:0 -2px;
    padding:10px 2px 14px; background:var(--bg); }
  .tab { font:600 var(--t-3) 'Geist', ui-sans-serif, sans-serif; border:none; background:none; color:var(--muted);
    padding:7px 11px; border-radius:var(--r-2); display:inline-flex; align-items:center; gap:6px; box-shadow:none; }
  .tab:hover { background:var(--fill); color:var(--fg); }
  .tab.on { color:var(--ink); background:var(--fill); }
  .tab .tc { font-size:var(--t-1); font-weight:600; background:var(--chip-n); color:var(--ink-2); border-radius:var(--r-pill);
    padding:0 6px; min-width:17px; text-align:center; }
  .tab.on .tc { background:var(--chip-n-2); }
  /* The density control, at the right end of the tab bar. What it changes is the column underneath it,
     so it belongs to that column's chrome rather than to the page header, where the three controls
     next to it are all about the document. Icon and title, like every other toggle in the tool. */
  .tabs .dens { margin-left:auto; color:var(--muted); }
  .tabs .dens:hover { background:var(--fill); color:var(--ink); }
  .side-list { display:flex; flex-direction:column; gap:8px; }
  /* ---------- the full-height rail (desktop) ----------
     The rail is the frame's right column now, the folder panel mirrored: it runs the full height of
     the window and the header spans only the band between the two panels. The aside STAYS a grid
     item — its content still sizes main, and the one shared scroll context is what lets dockCards
     hold a card level with its anchor — the negative margin just extends it up over the 52px the
     header no longer covers. The header's inset follows --rail-w the same way the body's follows
     --nav-track, so a drag on the grip moves both edges together. */
  @media (min-width: 781px) {
    body:not(.no-nav):not(.rail-collapsed) header { margin-right:var(--rail-w); }
    aside { margin-top:-52px; padding:0 20px 28px; }
    #railGrip { top:-52px; }
    /* The tabs are the rail's brand row now: 52px including the rule, full bleed past the aside's
       padding, sticky at the top of the WINDOW — so the folder's brand row, the header and this row
       put their three hairlines on the same pixel line across the application. */
    .tabs { top:0; height:52px; align-items:center; margin:0 -20px; padding:0 14px;
      border-bottom:1px solid var(--line); }
    .side-list { margin-top:16px; }
  }
  /* Docked layout (desktop, active tab): each card is absolutely placed level with its anchor by
     dockCards(), which also sets the list's height so the page can scroll to the last one. Cards keep
     left/right 0 so they still span the rail's width and measure the same height they did in flow. */
  .side-list.docked { display:block; position:relative; }
  .side-list.docked .card { position:absolute; left:0; right:0; }
  /* A docked card SLIDES to its new home rather than appearing in it. The move that matters is the
     one an agent causes: it rewrites the anchored sentence, the anchor stops matching, and a few
     seconds later `sidecar reanchor` points the card at the new text. Two jumps with a pause between
     them read as a glitch; one glide reads as the document settling. renderSide rebuilds every card
     via innerHTML, so a fresh element has no `top` to move FROM — dockCards seeds it with the position
     the card held before the rebuild, which is what gives this rule something to animate. */
  .side-list.docked .card { transition:box-shadow .2s ease, background .2s ease, top .22s ease; }
  /* A card being typed into is pinned where it is; if a neighbour above grows past it, it stays
     readable rather than being painted under. */
  .side-list.docked .card.pinned { z-index:1; }
  @media (prefers-reduced-motion: reduce) {
    .side-list.docked .card { transition:box-shadow .2s ease, background .2s ease; }
  }
  /* A tall card would shove every later card far below its own anchor, so unfocused cards are clipped to
     a cap (set inline by dockCards) and carry a fade + toggle. This is what keeps the column honest.
     Only .cbody clips: resolve / reply / send sit OUTSIDE it and stay reachable without expanding. */
  .card .cbody { position:relative; }
  .side-list.docked .card.clipped .cbody { overflow:hidden; }
  .side-list.docked .card.clipped .cbody::after { content:''; position:absolute; left:0; right:0; bottom:0;
    height:44px; pointer-events:none; background:linear-gradient(to bottom, var(--card-fade), var(--card)); }
  /* A direct child of the card, which is what the toggle is: a message carries one of its own now
     (.side-list .card .msg .more), and it is neither hidden with this one nor centred with it. */
  .side-list .card > .more { display:none; }
  .side-list.docked .card.has-more > .more { display:block; width:100%; text-align:center; margin:7px 0 0;
    padding:2px 0; border:0; background:none; box-shadow:none; cursor:pointer;
    font:600 var(--t-2) 'Geist', ui-sans-serif, sans-serif; color:var(--muted); }
  .side-list.docked .card.has-more > .more:hover { color:var(--ink); background:none; }
  /* review card: no border, a soft depth shadow lifts it off the rail.
     `position:relative` is for the fold control in the corner; the docked rule below overrides it to
     absolute, which positions the same way. */
  .card { position:relative; background:var(--card); border-radius:var(--r-3); padding:15px 16px; font-size:var(--t-3);
    box-shadow:var(--shadow); transition:box-shadow .2s ease, background .2s ease; }
  .card.flash { box-shadow:var(--shadow), 0 0 0 3px var(--flash-ring-strong); }
  /* ---------- the collapsed card ----------
     The second of three densities (public/turn.js: DENSITIES). A thread whose next move is not the
     human's rests as a pill level with its anchor: the provenance dot, one mono word for the kind, and
     the reply count. No body, which is the whole point: a rail of settled threads was charging full
     card height for conversations nobody was going to read again.
     The pill carries the surface, not the card, so the card measures the pill's own height and
     dockCards can sit four of them level with four anchors instead of stacking one down the rail. */
  /* The archived and orphaned tints are declared further down and would otherwise paint a full-width
     recessed bar behind a 110px pill, so both are named here rather than relying on source order. */
  .card.collapsed, .card.collapsed.archived, .card.collapsed.orphaned {
    background:none; box-shadow:none; padding:0; border-radius:var(--r-pill); }
  .card.collapsed .pill { display:inline-flex; align-items:center; gap:7px; max-width:100%;
    background:var(--card); box-shadow:var(--shadow); border:0; border-radius:var(--r-pill); padding:5px 11px;
    cursor:pointer; text-align:left; color:var(--ink-2);
    font:600 var(--t-1) 'Geist Mono', ui-monospace, Menlo, monospace; letter-spacing:.02em; }
  .card.collapsed .pill:hover { color:var(--ink); background:var(--card); }
  .card.collapsed .pill .dot { width:7px; height:7px; border-radius:50%; background:var(--ink); flex:none; }
  .card.collapsed.by-agent .pill .dot { background:var(--yellow); box-shadow:0 0 0 1px var(--yellow-ring); }
  .card.collapsed .pill .n { background:var(--chip-n); color:var(--ink-2); border-radius:var(--r-pill); padding:0 6px; }
  /* An unsent reply survives the fold (see replyDrafts), so the pill has to say so. Ink rather than the
     chip grey the count wears: the draft is the human's own text and the one thing on a settled pill
     that is still owed something. */
  .card.collapsed .pill .draft { background:var(--fill); color:var(--ink); border-radius:var(--r-pill); padding:0 6px; }
  /* Per-thread presence, on a pill. At compact a human's comment is collapsed exactly while it waits on
     the agent, which is the whole window in which the agent is answering it, so a rail that dropped the
     signal here would drop it where it is most often true. Same markup and the same shimmer as the full
     card's row (one rule, one reduced-motion fallback), laid inline instead of on its own line. */
  .card.collapsed .pill .replying { display:inline-flex; margin:0; padding:0; min-width:0; }
  .card.collapsed .pill .replying .lbl { font:inherit; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card.collapsed.archived .pill, .card.collapsed.orphaned .pill { background:var(--card-off); }
  .card.collapsed.orphaned .pill .dot { background:var(--dead); box-shadow:none; }
  /* The flash lands on the pill, since the card itself is now a transparent box the size of one. */
  .card.collapsed.flash { box-shadow:none; }
  .card.collapsed.flash .pill { box-shadow:var(--shadow), 0 0 0 3px var(--flash-ring-strong); }
  /* The hover preview: the last line said on the thread, painted OVER whatever is below it. Absolute
     and pointer-events:none, so hovering a pill never lays a second box into the column and never
     moves the card under the pointer. The reason a preview is worth having at all is that it costs
     the layout nothing. */
  .card.collapsed .peek { position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:1;
    background:var(--card); box-shadow:var(--shadow); border-radius:var(--r-2); padding:8px 11px;
    font-size:var(--t-2); line-height:1.45; color:var(--fg); pointer-events:none;
    opacity:0; transform:translateY(-2px); transition:opacity .13s ease, transform .13s ease; }
  /* The clamp lives on the inner span, not on the box: Chrome blockifies an absolutely positioned
     `-webkit-box` to `flow-root`, which drops the line clamp and leaves a third line cut in half under
     the bottom edge. A static child keeps the clamp and the ellipsis it draws. */
  .card.collapsed .peek span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; }
  .card.collapsed:hover { z-index:3; }
  .card.collapsed:hover .peek { opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce) { .card.collapsed .peek { transition:none; } }
  /* Fold an expanded card back to its pill. Drawn only at compact, where folding means something:
     `full` is the promise that nothing is folded, so the control would be a lie there. */
  .card .fold { position:absolute; top:11px; right:11px; z-index:1; padding:2px 4px; line-height:0;
    border:0; background:none; box-shadow:none; color:var(--faint); cursor:pointer; }
  .card .fold:hover { color:var(--ink); background:none; }
  .card .fold svg { width:13px; height:13px; display:block; pointer-events:none; }
  .card.foldable .cbody, .card.foldable .chead { padding-right:20px; }
  /* A decided card leaves toward the document it was anchored to, which is where the change just
     landed. Short, because the list rebuild is waiting on it. */
  .card.leaving { opacity:0; transform:translateX(-10px); transition:opacity .18s ease-out, transform .18s ease-out; }
  /* A newly arrived card fades up rather than appearing mid-list. Marked by renderSide, which knows
     which ids it had not rendered before. */
  @keyframes cardIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .card.entering { animation:cardIn .22s ease-out; }
  /* orphaned: the anchor text is gone — greyed surface, muted identity. The background transition on
     .card above carries this, so an item going orphaned under you fades rather than blinks. */
  .card.orphaned { background:var(--card-off); }
  /* identity — the agent is a yellow chip (its color); the human is an ink dot + name. Classed
     .agent / .human, not by literal name, so any SIDECAR_USER / SIDECAR_AGENT colors correctly. */
  .card .who { font-weight:600; display:inline-flex; align-items:center; }
  .who.agent { gap:5px; font-size:var(--t-2); color:var(--chip-fg); background:var(--chip);
    border-radius:var(--r-1); padding:2px 8px; }
  .who.agent::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--yellow);
    box-shadow:0 0 0 1px var(--yellow-ring); }
  .who.human { gap:6px; font-size:var(--t-3); color:var(--ink); }
  .who.human::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--ink); }
  .card.orphaned .who.agent { color:var(--ink-2); background:var(--chip-n); }
  .card.orphaned .who.agent::before { background:var(--dead); box-shadow:none; }
  /* kind label — quiet uppercase text, not a bordered badge */
  .card .badge { font-size:var(--t-1); font-weight:600; letter-spacing:var(--track-caps); text-transform:uppercase;
    color:var(--muted); margin-left:8px; }
  .card .badge.suggestion { color:var(--muted); }
  /* flag = "look here" from you — monochrome chip (yellow is the agent's, never yours) */
  .card .badge.flag { background:var(--chip-n); color:var(--ink-2); border-radius:var(--r-pill); padding:2px 9px;
    margin-left:8px; }
  .card .badge.orphaned { color:var(--muted); }
  /* final-status chips on archived cards — monochrome, quiet */
  .card .badge.accepted, .card .badge.rejected, .card .badge.resolved {
    background:var(--chip-n); color:var(--ink-2); border-radius:var(--r-pill); padding:2px 9px; }
  /* archived card — settled, recessed; a flex header so the decided-time sits at the right */
  .card.archived { background:var(--card-off); }
  .card.archived .quote { cursor:default; }
  .card .chead { display:flex; align-items:center; }
  /* the anchored span the card refers to — a yellow left-rule (the agent's), quiet quoted text */
  .card .quote { color:var(--muted); font-size:var(--t-2); border-left:2px solid var(--yellow); padding-left:10px;
    margin:9px 0; line-height:1.45; cursor:pointer; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card.orphaned .quote { border-left-color:var(--line-2); color:var(--faint); text-decoration:line-through; }
  .card .when { font-size:var(--t-1); color:var(--fainter); margin-left:auto; }
  /* thread messages — bold name (no chip, no dot; the header carries identity) + body */
  /* A thread message is a block with its own tint, so who said what is legible at a glance instead of
     depending on reading the name. The tints are the identity colors already in use elsewhere: the
     agent's yellow chip, the human's neutral well. Left border carries it when tints get subtle. */
  .msg { margin:8px 0; padding:7px 10px; border-radius:var(--r-2); font-size:var(--t-3); line-height:1.45;
    color:var(--fg); background:var(--fill); }
  .msg.by-agent { background:var(--chip); }
  .msg .who { background:none; padding:0; color:inherit; font-size:var(--t-2); display:block; margin-bottom:2px; }
  /* The dot comes back in-thread — it is the fastest identity read, and hiding it was why replies all
     looked alike. Inline-flex on the name row keeps it aligned with the text. */
  .msg .who::before { display:inline-block; vertical-align:middle; margin-right:5px; }
  .msg .who.agent { color:var(--chip-fg); }
  .msg .who.human { color:var(--ink); }
  /* A block rather than the span it renders as, in every message rather than only in a clipped one:
     clampMessages measures each message body against twelve lines, and an inline box has no height to
     measure and nothing to clip. `.who` above it is already a block, so nothing moves. */
  .msg .t { color:var(--fg); display:block; position:relative; }
  /* A message body is rendered markdown (proseHtml). One-paragraph bodies come back inline and sit on
     the author's line; anything structured brings real blocks, styled tight so a card stays scannable. */
  .msg .t > :first-child { margin-top:0; }
  .msg .t > :last-child { margin-bottom:0; }
  .msg .t p { margin:0 0 8px; }
  .msg .t ul, .msg .t ol { margin:6px 0; padding-left:19px; }
  .msg .t li { margin:3px 0; }
  .msg .t li > p { margin:0; }
  .msg .t h1, .msg .t h2, .msg .t h3, .msg .t h4 {
    font-size:var(--t-3); font-weight:600; color:var(--ink); margin:11px 0 4px; letter-spacing:0; }
  .msg .t code { font:var(--t-2) 'Geist Mono', ui-monospace, Menlo, monospace;
    background:var(--fill); border-radius:var(--r-1); padding:1px 4px; word-break:break-word; }
  .msg .t pre { background:var(--fill); border-radius:var(--r-2); padding:9px 11px; margin:8px 0; overflow-x:auto; }
  .msg .t pre code { background:none; padding:0; }
  .msg .t blockquote { margin:8px 0; padding-left:10px; border-left:2px solid var(--line-2); color:var(--muted); }
  .msg .t a { color:var(--ink); text-decoration:underline; text-underline-offset:2px; }
  .msg .t hr { border:0; border-top:1px solid var(--line); margin:11px 0; }
  .msg .t table { border-collapse:collapse; margin:8px 0; font-size:var(--t-2); display:block; overflow-x:auto; }
  .msg .t th, .msg .t td { border:1px solid var(--line-2); padding:4px 7px; text-align:left; }
  /* An attached screenshot in a 300px rail is unreadable at rail width — it's a thumbnail that
     opens. zoom-in says so before the click does. */
  .msg .t img { max-width:100%; height:auto; border-radius:var(--r-1); display:block; margin:7px 0;
    border:1px solid var(--line-2); cursor:zoom-in; background:var(--fill); }
  /* ---------- a long thread folds in its middle, and a long message clips ----------
     The row that stands in for the hidden replies (public/turn.js: foldThread). It sits where the
     messages it replaces sat, with a hairline running out to each side, so it reads as a gap in the
     conversation rather than as another thing said in it. Same type as the card's own `more` toggle:
     one vocabulary in the rail for "there is more here than is drawn". */
  .side-list .msgfold { display:flex; align-items:center; gap:9px; width:100%; margin:9px 0; padding:0;
    border:0; background:none; box-shadow:none; cursor:pointer; color:var(--muted);
    font:600 var(--t-2) 'Geist', ui-sans-serif, sans-serif; }
  .side-list .msgfold::before, .side-list .msgfold::after { content:''; flex:1; height:1px; background:var(--line); }
  .side-list .msgfold:hover { color:var(--ink); background:none; }
  /* A message taller than twelve lines clips to them (clampMessages). The fade runs to the message's
     own ground, which is the human's well or the agent's chip. */
  .side-list .msg.clamped .t { overflow:hidden; }
  .side-list .msg.clamped .t::after { content:''; position:absolute; left:0; right:0; bottom:0; height:32px;
